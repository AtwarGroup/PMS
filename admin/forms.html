<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة النماذج والأدلة</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.head{margin-bottom:16px}.box{background:#fff;border:1px solid #dfe7f0;border-radius:16px;padding:18px;margin-bottom:12px}.form-grid{display:grid;grid-template-columns:1fr 2fr 1fr 1fr;gap:10px}.form-grid textarea{grid-column:1/-1;min-height:85px}.form-grid input,.form-grid select,.form-grid textarea{border:1px solid #d7e1ec;border-radius:9px;padding:10px;font:500 12px Tajawal}.btn{border:1px solid #d7e1ec;border-radius:9px;padding:9px 13px;background:#fff;font:800 11px Tajawal;cursor:pointer}.primary{background:#1769e0;color:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:14px;padding:15px}.card small{color:#64748b}.links{display:flex;gap:8px;margin-top:10px}@media(max-width:800px){.form-grid,.cards{grid-template-columns:1fr}.form-grid textarea{grid-column:auto}}</style></head><body data-min-role="admin" style="visibility:hidden"><div class="atwar-shell"><atwar-sidebar active="admin"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><header class="head"><h1>مكتبة النماذج والأدلة</h1><p>يرفع النموذج مرة واحدة ثم يُربط بأي عدد من الوظائف.</p></header><section class="box form-grid"><input id="formCode" placeholder="رمز النموذج"><input id="formTitle" placeholder="اسم النموذج أو الدليل"><select id="formType"><option value="FORM">نموذج</option><option value="REGISTER">سجل</option><option value="REPORT">تقرير</option><option value="CHECKLIST">قائمة تحقق</option><option value="GUIDE">دليل</option></select><input id="formVersion" value="1.0" placeholder="الإصدار"><input id="formUrl" placeholder="رابط الملف"><input id="formDepartment" placeholder="الإدارة المالكة"><textarea id="formDescription" placeholder="الغرض وطريقة الاستخدام"></textarea><button id="saveForm" class="btn primary">حفظ كمسودة</button></section><div id="formsList" class="cards"></div></main></section></div><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/permissions.js"></script><script type="module" src="../assets/js/forms-admin.js"></script></body></html>
