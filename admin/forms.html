<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة النماذج والأدلة</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@1.47.0"></script><script src="../assets/js/shell-components.js?v=2.5.9"></script><script src="../assets/js/ui-feedback.js?v=2.5.2"></script><script src="../assets/js/session-service.js?v=2.5.2"></script><link rel="stylesheet" href="../assets/css/shared.css?v=2.5.2"><style>.head{margin-bottom:16px}.box{background:var(--atwar-surface);border:1px solid var(--atwar-border);border-radius:var(--atwar-radius-card);padding:20px;margin-bottom:16px;box-shadow:var(--atwar-shadow-card)}.form-grid{display:grid;grid-template-columns:1fr 2fr 1fr 1fr;gap:10px}.form-grid textarea{grid-column:1/-1;min-height:85px}.form-grid input,.form-grid select,.form-grid textarea{border:1px solid #d7e1ec;border-radius:9px;padding:10px;font:500 12px Tajawal}.btn{border:1px solid #d7e1ec;border-radius:9px;padding:9px 13px;background:#fff;font:800 11px Tajawal;cursor:pointer}.primary{background:#1769e0;color:#fff}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:14px;padding:15px}.card small{color:#64748b}.links{display:flex;gap:8px;margin-top:10px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){.form-grid,.cards{grid-template-columns:1fr}.form-grid textarea{grid-column:auto}}</style></head><body data-min-role="admin" style="visibility:hidden"><div class="atwar-shell"><atwar-sidebar active="admin"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><header class="atwar-page-head"><div><h1>مكتبة النماذج والأدلة</h1><p>تُضاف القوالب الأولية كمسودات، ويُنشر النموذج بعد مراجعة محتواه وربطه بالوظيفة المناسبة.</p></div></header><section class="box" aria-labelledby="newFormTitle"><div class="atwar-panel-head"><div><h2 id="newFormTitle">نموذج جديد</h2><p>أدخل بيانات النموذج ورابط الملف واحفظه كمسودة.</p></div></div><div class="form-grid"><input id="formCode" aria-label="رمز النموذج" placeholder="رمز النموذج"><input id="formTitle" aria-label="اسم النموذج أو الدليل" placeholder="اسم النموذج أو الدليل"><select id="formType" aria-label="نوع النموذج"><option value="FORM">نموذج</option><option value="REGISTER">سجل</option><option value="REPORT">تقرير</option><option value="CHECKLIST">قائمة تحقق</option><option value="GUIDE">دليل</option></select><input id="formVersion" aria-label="الإصدار" value="1.0" placeholder="الإصدار"><input id="formUrl" aria-label="رابط الملف" placeholder="رابط الملف"><input id="formDepartment" aria-label="الإدارة المالكة" placeholder="الإدارة المالكة"><textarea id="formDescription" aria-label="الغرض وطريقة الاستخدام" placeholder="الغرض وطريقة الاستخدام"></textarea><button id="saveForm" class="atwar-btn primary">حفظ كمسودة</button></div></section><section class="box" aria-labelledby="formsTitle"><div class="atwar-panel-head"><h2 id="formsTitle">النماذج المحفوظة</h2></div><div id="formsList" class="cards" aria-live="polite"></div></section></main></section></div><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/permissions.js"></script><script type="module" src="../assets/js/forms-admin.js"></script></body></html>
