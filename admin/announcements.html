<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الإعلانات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@1.47.0"></script><script src="../assets/js/shell-components.js?v=2.5.8"></script><script src="../assets/js/ui-feedback.js?v=2.5.2"></script><script src="../assets/js/session-service.js?v=2.5.2"></script><link rel="stylesheet" href="../assets/css/shared.css?v=2.5.2"><style>.head{margin-bottom:16px}.head h1{margin:0}.box{background:var(--atwar-surface);border:1px solid var(--atwar-border);border-radius:var(--atwar-radius-card);padding:20px;margin-bottom:16px;box-shadow:var(--atwar-shadow-card)}.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.form textarea{grid-column:1/-1;min-height:110px}.form input,.form select,.form textarea{border:1px solid #d7e1ec;border-radius:9px;padding:10px;font:500 12px Tajawal}.actions{display:flex;gap:8px}.btn{min-height:40px;border:1px solid var(--atwar-border-strong);border-radius:var(--atwar-radius-control);padding:9px 14px;background:#fff;font:800 13px Tajawal;cursor:pointer}.primary{background:var(--atwar-blue-600);color:#fff}.cards{display:grid;gap:9px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:13px;padding:14px}.card.important{border-right:5px solid #ef9b18}.meta{font-size:10px;color:#64748b}.toast{position:fixed;bottom:20px;left:20px;background:#102744;color:#fff;padding:10px;border-radius:9px;display:none}@media(max-width:700px){.form{grid-template-columns:1fr}.form textarea{grid-column:auto}}</style></head>
<body style="visibility:hidden"><div class="atwar-shell"><atwar-sidebar active="admin"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><header class="atwar-page-head"><div><h1>لوحة الإعلانات</h1><p>أنشئ إعلانًا وحدد جمهوره ومدة عرضه قبل النشر.</p></div></header><section class="box" aria-labelledby="announcementFormTitle"><div class="atwar-panel-head"><h2 id="announcementFormTitle">إعلان جديد</h2></div><div class="form"><input id="announcementTitle" aria-label="عنوان الإعلان" placeholder="عنوان الإعلان"><select id="announcementAudience" aria-label="جمهور الإعلان"><option value="ALL">الجميع</option><option value="EMPLOYEES">الموظفون</option><option value="MANAGERS">المدراء</option></select><select id="announcementImportance" aria-label="أهمية الإعلان"><option value="NORMAL">عادي</option><option value="IMPORTANT">مهم</option></select><textarea id="announcementBody" aria-label="نص الإعلان" placeholder="نص الإعلان"></textarea><input id="announcementStarts" aria-label="بداية العرض" type="datetime-local"><input id="announcementEnds" aria-label="نهاية العرض" type="datetime-local"><div class="actions"><button id="saveDraft" class="btn">حفظ كمسودة</button><button id="publishAnnouncement" class="btn primary">نشر</button></div></div></section><section class="box" aria-labelledby="announcementListTitle"><div class="atwar-panel-head"><h2 id="announcementListTitle">الإعلانات المحفوظة</h2></div><div id="announcementCards" class="cards" aria-live="polite"></div></section></main></section></div><div id="announcementToast" class="toast"></div><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/permissions.js"></script><script type="module" src="../assets/js/announcements-admin.js"></script></body></html>
