<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قائمة تحقق مراجعة الوصف الوظيفي | ATWAR ONE</title><link rel="stylesheet" href="../../assets/css/shared.css"><style>body{background:#f5f8fc;color:#17324d;font-family:Tajawal,Arial,sans-serif;margin:0}main{max-width:850px;margin:30px auto;padding:28px;background:white;border:1px solid #dce6f2;border-radius:18px}header{border-bottom:2px solid #1366b5;margin-bottom:22px;padding-bottom:14px}h1{margin:0;font-size:23px}p{color:#62768e}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{font-weight:bold;font-size:13px}label span{display:block;margin-bottom:6px}textarea{box-sizing:border-box;display:block;width:100%;border:1px solid #cbd8e6;border-radius:8px;padding:10px;font:inherit;resize:vertical}button{background:#12365e;color:white;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}@media(max-width:650px){.fields{grid-template-columns:1fr}main{margin:10px;padding:16px}}@media print{body{background:white}main{border:0;margin:0;padding:0}button{display:none}textarea{border-color:#879db4;min-height:55px}}</style></head><body><main><header><small>ATWAR ONE • قالب تشغيلي قابل للتعبئة</small><h1>قائمة تحقق مراجعة الوصف الوظيفي</h1><p>نسخة ١٫٠ — للاستخدام بعد مراجعة الجهة المختصة. احفظ الصفحة كملف PDF بعد تعبئة الحقول.</p></header><h2>بنود المراجعة</h2><div class="fields"><label><span>المسمى والإدارة والمدير المباشر</span><textarea aria-label="المسمى والإدارة والمدير المباشر" rows="2"></textarea></label><label><span>الغرض الوظيفي</span><textarea aria-label="الغرض الوظيفي" rows="2"></textarea></label><label><span>المهام والمسؤوليات</span><textarea aria-label="المهام والمسؤوليات" rows="2"></textarea></label><label><span>حدود الصلاحيات والتصعيد</span><textarea aria-label="حدود الصلاحيات والتصعيد" rows="2"></textarea></label><label><span>المؤشرات وطريقة القياس</span><textarea aria-label="المؤشرات وطريقة القياس" rows="2"></textarea></label><label><span>مصادر الأدلة والتقارير</span><textarea aria-label="مصادر الأدلة والتقارير" rows="2"></textarea></label><label><span>المؤهلات والمهارات</span><textarea aria-label="المؤهلات والمهارات" rows="2"></textarea></label><label><span>النماذج المرتبطة</span><textarea aria-label="النماذج المرتبطة" rows="2"></textarea></label><label><span>الملاحظات وقرار المراجعة</span><textarea aria-label="الملاحظات وقرار المراجعة" rows="2"></textarea></label></div><p>هذا النموذج يساعد على التوثيق، ولا ينشئ اعتمادًا آليًا داخل النظام.</p><button onclick="window.print()">طباعة / حفظ PDF</button></main></body></html>
