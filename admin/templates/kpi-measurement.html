<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل قياس مؤشر الأداء | ATWAR ONE</title><link rel="stylesheet" href="../../assets/css/shared.css"><style>body{background:#f5f8fc;color:#17324d;font-family:Tajawal,Arial,sans-serif;margin:0}main{max-width:850px;margin:30px auto;padding:28px;background:white;border:1px solid #dce6f2;border-radius:18px}header{border-bottom:2px solid #1366b5;margin-bottom:22px;padding-bottom:14px}h1{margin:0;font-size:23px}p{color:#62768e}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{font-weight:bold;font-size:13px}label span{display:block;margin-bottom:6px}textarea{box-sizing:border-box;display:block;width:100%;border:1px solid #cbd8e6;border-radius:8px;padding:10px;font:inherit;resize:vertical}button{background:#12365e;color:white;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}@media(max-width:650px){.fields{grid-template-columns:1fr}main{margin:10px;padding:16px}}@media print{body{background:white}main{border:0;margin:0;padding:0}button{display:none}textarea{border-color:#879db4;min-height:55px}}</style></head><body><main><header><small>ATWAR ONE • قالب تشغيلي قابل للتعبئة</small><h1>سجل قياس مؤشر الأداء</h1><p>نسخة ١٫٠ — للاستخدام بعد مراجعة الجهة المختصة. احفظ الصفحة كملف PDF بعد تعبئة الحقول.</p></header><h2>بيانات المؤشر والقياس</h2><div class="fields"><label><span>اسم المؤشر</span><textarea aria-label="اسم المؤشر" rows="2"></textarea></label><label><span>الوظيفة أو الإدارة</span><textarea aria-label="الوظيفة أو الإدارة" rows="2"></textarea></label><label><span>فترة القياس</span><textarea aria-label="فترة القياس" rows="2"></textarea></label><label><span>وحدة القياس</span><textarea aria-label="وحدة القياس" rows="2"></textarea></label><label><span>طريقة الحساب</span><textarea aria-label="طريقة الحساب" rows="2"></textarea></label><label><span>المستهدف المعتمد</span><textarea aria-label="المستهدف المعتمد" rows="2"></textarea></label><label><span>النتيجة الفعلية</span><textarea aria-label="النتيجة الفعلية" rows="2"></textarea></label><label><span>مصدر البيانات</span><textarea aria-label="مصدر البيانات" rows="2"></textarea></label><label><span>الدليل أو الرابط</span><textarea aria-label="الدليل أو الرابط" rows="2"></textarea></label><label><span>اسم معد القياس</span><textarea aria-label="اسم معد القياس" rows="2"></textarea></label><label><span>اسم المراجع</span><textarea aria-label="اسم المراجع" rows="2"></textarea></label><label><span>تاريخ الاعتماد</span><textarea aria-label="تاريخ الاعتماد" rows="2"></textarea></label></div><p>هذا النموذج يساعد على التوثيق، ولا ينشئ اعتمادًا آليًا داخل النظام.</p><button onclick="window.print()">طباعة / حفظ PDF</button></main></body></html>
