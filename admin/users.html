<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – إدارة المستخدمين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.a-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.a-head h1{font-size:28px;margin:0}.a-head p{font-size:12px;color:#7b8aa5;margin:5px 0 0}
.a-actions{display:flex;gap:8px}
.a-actions button{border:0;background:#0b1d3a;color:#fff;border-radius:12px;padding:11px 15px;font-family:inherit;font-weight:900;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #e5edf6;border-radius:17px;padding:15px}
.stat b{font-size:24px;display:block}.stat span{font-size:10px;color:#7b8aa5}
.toolbar{background:#fff;border:1px solid #e5edf6;border-radius:17px;padding:13px;display:flex;gap:10px;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid #dfe7f1;border-radius:11px;padding:10px 12px;font-family:inherit}
.toolbar input{flex:1}
.table{background:#fff;border:1px solid #e5edf6;border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr .7fr;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #edf2f7}
.row:last-child{border:0}.row.head{background:#f8fafc;font-size:10px;font-weight:900;color:#738196}
.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:12px;background:#edf4ff;color:#176fd3;display:grid;place-items:center;font-weight:900}
.name{font-size:12px;font-weight:900}.mail{font-size:9px;color:#8895a6;margin-top:3px}
.badge{font-size:9px;font-weight:900;padding:6px 8px;border-radius:999px;display:inline-block}
.employee{background:#f1f5f9;color:#475569}.manager{background:#eef6ff;color:#176fd3}.admin{background:#f3edff;color:#7846d1}
.active{background:#edf9f3;color:#17805d}.inactive{background:#fff0f0;color:#c73b42}
.edit-btn{border:1px solid #dce6f1;background:#fff;border-radius:9px;padding:7px 9px;font-family:inherit;font-size:10px;font-weight:900;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(8,20,38,.48);z-index:1000;place-items:center;padding:20px}
.modal.show{display:grid}.box{width:min(580px,100%);background:#fff;border-radius:20px;padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;border:1px solid #dfe7f1;border-radius:10px;padding:10px;font-family:inherit}
.box-actions{display:flex;justify-content:flex-end;gap:8px}.box-actions button{border:0;border-radius:9px;padding:9px 12px;font-family:inherit;font-weight:900;cursor:pointer}.save{background:#0b1d3a;color:#fff}.cancel{background:#eef2f7;color:#52647a}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.row.head{display:none}.toolbar{flex-direction:column}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body data-min-role="admin">
<div class="atwar-shell">
<atwar-sidebar active=""></atwar-sidebar>

<section class="atwar-main">
<atwar-header></atwar-header>

<main class="atwar-content">
<section style="min-height:420px;display:flex;align-items:center;justify-content:center">
<div style="background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:32px;text-align:center;max-width:520px">
<div style="font-size:22px;font-weight:900">الصفحة تحت الإنشاء</div>
<div style="font-size:11px;color:#7b8aa5;margin-top:8px;line-height:1.8">سيتم ربط إدارة المستخدمين مباشرة ببيانات Firebase بعد اعتماد دورة إدارة الحسابات والصلاحيات.</div>
</div></section>
</main>
<footer class="atwar-footer"><span>ATWAR ONE • Users & Permissions</span><span>V0.37.9</span><span>الإدارة قيد التطوير</span></footer>
</main></section></div>
<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/permissions.js"></script>

<script src="../assets/js/consolidation.js"></script>

</body></html>
