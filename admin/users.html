<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – الحسابات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/supabase-config.js"></script><script>
window.atwarGetSupabase=window.atwarGetSupabase||async function(){
  if(window.ATWAR_SUPABASE)return window.ATWAR_SUPABASE;
  const m=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  window.ATWAR_SUPABASE=m.createClient(window.ATWAR_SUPABASE_CONFIG.url,window.ATWAR_SUPABASE_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return window.ATWAR_SUPABASE;
};
</script><script src="../assets/js/shell-components.js?v=2.5.6"></script><script src="../assets/js/ui-feedback.js?v=2.5.2"></script><script src="../assets/js/session-service.js?v=2.5.2"></script><link rel="stylesheet" href="../assets/css/shared.css?v=2.5.2"><style>
.btn:disabled{opacity:.7;cursor:wait}.btn.saved{background:#15803d}.row-save-state{min-width:72px;font-size:9px;font-weight:800;color:#15803d}.row-save-state.error{color:#b42318}
.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px;margin-bottom:14px}.head,.row{display:grid;grid-template-columns:1.3fr 1.1fr 1fr 1fr 1.1fr .9fr auto;gap:8px;padding:10px 0;align-items:center}.head{font-size:10px;font-weight:900;color:#6f7f93;border-bottom:1px solid #edf2f7}.row{border-bottom:1px solid #edf2f7}.row input,.row select,.create-grid input,.create-grid select{border:1px solid #dce5ef;border-radius:8px;padding:8px;font-family:inherit;min-width:0}.btn{border:0;background:#0b1d3a;color:#fff;border-radius:8px;padding:9px 12px;font-family:inherit;font-weight:900;cursor:pointer}.btn.danger{background:#b42318}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.secondary{background:#edf3fa;color:#183b62}.msg{font-size:11px;margin:8px 0;color:#157347}.err{color:#b42318}.password-dialog[hidden]{display:none}.password-dialog{position:fixed;inset:0;z-index:150;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;padding:18px}.password-box{width:min(430px,100%);background:#fff;border-radius:18px;padding:18px;border:1px solid #dfe7f0;box-shadow:0 24px 60px rgba(15,23,42,.22)}.password-box input{width:100%;border:1px solid #dce5ef;border-radius:9px;padding:10px;font-family:inherit}.password-actions{display:flex;gap:8px;margin-top:14px}.password-actions .btn{flex:1}.create-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.create-grid label,.profile-extra label{display:block;font-size:10px;font-weight:900;margin-bottom:4px}.create-grid input,.create-grid select{width:100%}.full{grid-column:1/-1}.hint{font-size:10px;color:#7a899d;margin:6px 0 0}.profile-extra{grid-column:1/-1;background:#f8fafc;border:1px solid #e5edf6;border-radius:12px;padding:10px}.profile-extra summary{cursor:pointer;font-size:11px;font-weight:900;color:#174f93}.profile-extra-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.profile-extra input,.profile-extra select{width:100%}@media(max-width:1050px){.head{display:none}.row{grid-template-columns:1fr 1fr}.btn{grid-column:1/-1}.create-grid{grid-template-columns:1fr 1fr}.profile-extra-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.create-grid,.profile-extra-grid{grid-template-columns:1fr}}
</style></head><body data-min-role="admin"><div class="atwar-shell"><atwar-sidebar active="admin"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><h1>إدارة الحسابات</h1>
<section class="card"><h3 style="margin-top:0">إضافة مستخدم جديد</h3><p class="hint">يتم إنشاء الحساب وإعداد بيانات ملفه التعريفي من داخل ATWAR ONE.</p><div class="create-grid" style="margin-top:12px"><div><label>الاسم</label><input id="nName" autocomplete="off"></div><div><label>البريد الإلكتروني</label><input id="nEmail" type="email" autocomplete="off"></div><div><label>كلمة المرور المؤقتة</label><input id="nPassword" type="password" minlength="6" autocomplete="new-password"></div><div><label>المسمى</label><input id="nTitle" autocomplete="off"></div><div><label>القسم</label><input id="nDept" autocomplete="off"></div><div><label>الدور</label><select id="nRole"><option value="employee">موظف</option><option value="manager">مدير</option><option value="admin">مدير نظام</option></select></div><div><label>المدير المباشر</label><select id="nManager"><option value="">بدون مدير</option></select></div><div><label>الحالة</label><select id="nStatus"><option value="active">نشط</option><option value="inactive">غير نشط</option></select></div><div><label>الرقم الوظيفي</label><input id="nEmployeeCode"></div><div><label>تاريخ الانضمام</label><input id="nJoinDate" type="date"></div><div><label>الموقع / الفرع</label><input id="nWorkLocation"></div><div><label>نوع الموظف</label><input id="nEmploymentType" placeholder="دوام كامل"></div><div style="display:flex;align-items:end"><button id="createUser" class="btn" style="width:100%">إضافة المستخدم</button></div></div><div id="createState" class="msg"></div></section>
<div id="state" class="msg"></div><section class="card"><div class="head"><span>الاسم</span><span>المسمى</span><span>القسم</span><span>الدور</span><span>المدير المباشر</span><span>الحالة</span><span></span></div><div id="list">جاري التحميل...</div></section>
<div id="passwordDialog" class="password-dialog" hidden><div class="password-box" role="dialog" aria-modal="true" aria-labelledby="passwordDialogTitle"><h3 id="passwordDialogTitle" style="margin:0 0 6px">تغيير كلمة المرور</h3><div id="passwordTarget" class="hint" style="margin-bottom:12px"></div><label style="display:block;font-size:11px;font-weight:900;margin:8px 0 5px">كلمة المرور الجديدة</label><input id="resetPassword1" type="password" minlength="6" autocomplete="new-password"><label style="display:block;font-size:11px;font-weight:900;margin:10px 0 5px">تأكيد كلمة المرور</label><input id="resetPassword2" type="password" minlength="6" autocomplete="new-password"><div id="passwordState" class="msg"></div><div class="password-actions"><button id="confirmPasswordReset" class="btn" type="button">حفظ كلمة المرور</button><button id="cancelPasswordReset" class="btn secondary" type="button">إلغاء</button></div></div></div><footer class="atwar-footer"><span>ATWAR ONE • Admin Users</span><span>Production 1.7H</span><span>Auth + Profiles</span></footer></main></section></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const c=window.ATWAR_SUPABASE_CONFIG; const sb=await window.atwarGetSupabase();
let users=[];
let currentAdminId=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const state=(m,e=false,id='state')=>{const x=document.getElementById(id);x.textContent=m;x.className='msg'+(e?' err':'')};
function managerOptions(selected='',exclude=''){return '<option value="">بدون مدير</option>'+users.filter(x=>x.id!==exclude&&x.active&&x.status==='active'&&['manager','admin'].includes(x.role)).map(m=>`<option value="${m.id}" ${selected===m.id?'selected':''}>${esc(m.full_name)}</option>`).join('')}
async function invoke(body){
  const {data:{session},error:sessionErr}=await sb.auth.getSession();
  if(sessionErr||!session?.access_token) throw new Error('انتهت جلسة الدخول. أعد تسجيل الدخول.');
  const res=await fetch(`${c.url}/functions/v1/admin-create-user`,{
    method:'POST',
    headers:{
      'Authorization':`Bearer ${session.access_token}`,
      'apikey':c.publishableKey,
      'Content-Type':'application/json'
    },
    body:JSON.stringify(body)
  });
  const text=await res.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{throw new Error(`استجابة غير صالحة من خدمة المستخدمين (${res.status})`)}
  if(!res.ok||data?.error) throw new Error(data?.error||`فشل الطلب (${res.status})`);
  return data;
}
async function load(successMessage=''){
  const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}
  currentAdminId=session.user.id;
  const{data:p,error:pe}=await sb.from('profiles').select('id,full_name,email,job_title,department,role,status,active,manager_id,permissions').eq('id',session.user.id).single();
  if(pe||!p||p.role!=='admin'||!p.active||p.status!=='active'){location.href='../home.html';return}
  window.atwarSyncShellIdentity?.(p,session.user);
  try{
    const data=await invoke({action:'list'});
    const details=await sb.from('profiles').select('id,permissions,employee_code,join_date,work_location,employment_type');
    if(details.error)throw details.error;
    const detailsById=new Map((details.data||[]).map(row=>[row.id,row]));
    users=(data.users||[]).map(user=>({...user,...(detailsById.get(user.id)||{})}));
  }catch(e){console.error(e);state('تعذر تحميل المستخدمين: '+(e?.message||String(e)),true);document.getElementById('list').innerHTML='';return}
  document.getElementById('nManager').innerHTML=managerOptions();
  document.getElementById('list').innerHTML=users.map(u=>`<div class="row" data-id="${u.id}"><input class="name" value="${esc(u.full_name||'')}"><input class="title" value="${esc(u.job_title||'')}"><input class="dept" value="${esc(u.department||'')}"><select class="role"><option value="employee" ${u.role==='employee'?'selected':''}>موظف</option><option value="manager" ${u.role==='manager'?'selected':''}>مدير</option><option value="admin" ${u.role==='admin'?'selected':''}>مدير نظام</option></select><select class="manager">${managerOptions(u.manager_id||'',u.id)}</select><select class="status"><option value="active" ${u.status==='active'?'selected':''}>نشط</option><option value="inactive" ${u.status==='inactive'?'selected':''}>غير نشط</option></select><div class="actions"><label class="hint" title="يظهر للمستخدم رابط صفحة اطلاع تنفيذي مستقلة للقراءة فقط"><input class="executive-access" type="checkbox" ${(u.permissions||[]).includes('tasks.read_all')?'checked':''}> اطلاع تنفيذي</label><button class="btn save">حفظ</button><span class="row-save-state" aria-live="polite"></span><button class="btn secondary reset-password" type="button">تغيير كلمة المرور</button>${u.id===currentAdminId?'':`<button class="btn danger delete" type="button">حذف</button>`}</div><details class="profile-extra"><summary>البيانات الإضافية للملف التعريفي</summary><div class="profile-extra-grid"><div><label>الرقم الوظيفي</label><input class="employee-code" value="${esc(u.employee_code||'')}"></div><div><label>تاريخ الانضمام</label><input class="join-date" type="date" value="${esc(u.join_date||'')}"></div><div><label>الموقع / الفرع</label><input class="work-location" value="${esc(u.work_location||'')}"></div><div><label>نوع الموظف</label><input class="employment-type" value="${esc(u.employment_type||'')}"></div></div></details></div>`).join('')||'<div style="padding:14px">لا يوجد مستخدمون.</div>';
  document.querySelectorAll('.save').forEach(b=>b.onclick=()=>save(b.closest('.row')));
  document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>deleteUser(b.closest('.row')));
  document.querySelectorAll('.reset-password').forEach(b=>b.onclick=()=>openPasswordDialog(b.closest('.row')));
  state(successMessage||`تم تحميل ${users.length} مستخدمًا.`);
}
async function save(r){
  const button=r.querySelector('.save'),feedback=r.querySelector('.row-save-state');
  window.AtwarUI?.saveState(button,'saving');button.textContent='جارٍ الحفظ…';button.classList.remove('saved');feedback.className='row-save-state';feedback.textContent='';
  const body={action:'update',id:r.dataset.id,full_name:r.querySelector('.name').value.trim(),job_title:r.querySelector('.title').value.trim(),department:r.querySelector('.dept').value.trim(),role:r.querySelector('.role').value,status:r.querySelector('.status').value,manager_id:r.querySelector('.manager').value||null};
  try{await invoke(body);const permission=await sb.rpc('admin_set_executive_task_access',{p_profile_id:r.dataset.id,p_enabled:r.querySelector('.executive-access').checked});if(permission.error)throw permission.error;const details=await sb.rpc('admin_update_profile_details',{p_profile_id:r.dataset.id,p_employee_code:r.querySelector('.employee-code').value.trim()||null,p_join_date:r.querySelector('.join-date').value||null,p_work_location:r.querySelector('.work-location').value.trim()||null,p_employment_type:r.querySelector('.employment-type').value.trim()||null});if(details.error)throw details.error;const savedUser=users.find(x=>x.id===r.dataset.id);if(savedUser)Object.assign(savedUser,{...body,permissions:r.querySelector('.executive-access').checked?[...new Set([...(savedUser.permissions||[]),'tasks.read_all'])]:(savedUser.permissions||[]).filter(x=>x!=='tasks.read_all'),employee_code:r.querySelector('.employee-code').value.trim()||null,join_date:r.querySelector('.join-date').value||null,work_location:r.querySelector('.work-location').value.trim()||null,employment_type:r.querySelector('.employment-type').value.trim()||null});if(r.dataset.id===currentAdminId){const session=JSON.parse(localStorage.getItem('atwarSession')||'null')||{};localStorage.setItem('atwarSession',JSON.stringify({...session,name:body.full_name,title:body.job_title,role:body.role,managerId:body.manager_id||null}));window.atwarSyncShellIdentity?.(savedUser)}window.AtwarUI?.saveState(button,'saved');button.textContent='✓ تم الحفظ';button.classList.add('saved');feedback.textContent='تم حفظ جميع بيانات المستخدم';window.AtwarUI?.toast('تم حفظ بيانات المستخدم بنجاح','success');setTimeout(()=>{if(!document.body.contains(button))return;window.AtwarUI?.saveState(button,'idle');button.classList.remove('saved');feedback.textContent=''},3000)}catch(e){console.error(e);window.AtwarUI?.saveState(button,'error');feedback.className='row-save-state error';feedback.textContent='تعذر الحفظ: '+(e?.message||String(e));window.AtwarUI?.toast(feedback.textContent,'error')}finally{button.disabled=false}
}
let passwordTargetId='';
function openPasswordDialog(r){
  const id=r?.dataset?.id||'';const u=users.find(x=>x.id===id);if(!u)return;
  passwordTargetId=id;document.getElementById('passwordTarget').textContent=`المستخدم: ${u.full_name||u.email||id}`;
  document.getElementById('resetPassword1').value='';document.getElementById('resetPassword2').value='';state('',false,'passwordState');
  document.getElementById('passwordDialog').hidden=false;setTimeout(()=>document.getElementById('resetPassword1').focus(),0);
}
function closePasswordDialog(){document.getElementById('passwordDialog').hidden=true;passwordTargetId='';document.getElementById('resetPassword1').value='';document.getElementById('resetPassword2').value='';state('',false,'passwordState')}
async function resetPassword(){
  const p1=document.getElementById('resetPassword1').value,p2=document.getElementById('resetPassword2').value,b=document.getElementById('confirmPasswordReset');
  if(!passwordTargetId){state('لم يتم تحديد المستخدم.',true,'passwordState');return}
  if(p1.length<6){state('يجب ألا تقل كلمة المرور عن 6 أحرف.',true,'passwordState');return}
  if(p1!==p2){state('كلمتا المرور غير متطابقتين.',true,'passwordState');return}
  b.disabled=true;state('جاري تغيير كلمة المرور...',false,'passwordState');
  try{await invoke({action:'reset_password',id:passwordTargetId,password:p1});const u=users.find(x=>x.id===passwordTargetId);closePasswordDialog();state(`تم تغيير كلمة مرور ${u?.full_name||u?.email||'المستخدم'} بنجاح.`)}
  catch(e){console.error(e);state('تعذر تغيير كلمة المرور: '+(e?.message||String(e)),true,'passwordState')}
  finally{b.disabled=false}
}
async function deleteUser(r){
  const id=r?.dataset?.id||'';
  const u=users.find(x=>x.id===id);
  if(!id||!u)return;
  if(id===currentAdminId){state('لا يمكن حذف حساب مدير النظام المستخدم حاليًا.',true);return}
  const ok=await (window.AtwarUI?.confirm({title:'حذف حساب المستخدم',message:`سيتم حذف حساب ${u.full_name||u.email||id} نهائيًا من Auth وملف المستخدم. إذا كان للحساب سجل مهام أو مرؤوسون فلن يسمح النظام بالحذف.`,confirmText:'حذف الحساب',danger:true})??Promise.resolve(false));
  if(!ok)return;
  state('جاري حذف المستخدم...');
  try{await invoke({action:'delete',id});await load('تم حذف المستخدم بنجاح.')}
  catch(e){console.error(e);state('تعذر حذف المستخدم: '+(e?.message||String(e)),true)}
}
document.getElementById('confirmPasswordReset').onclick=resetPassword;
document.getElementById('cancelPasswordReset').onclick=closePasswordDialog;
document.getElementById('passwordDialog').addEventListener('click',e=>{if(e.target.id==='passwordDialog')closePasswordDialog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('passwordDialog').hidden)closePasswordDialog()});
document.getElementById('createUser').onclick=async()=>{
  const b=document.getElementById('createUser');const body={action:'create',full_name:document.getElementById('nName').value.trim(),email:document.getElementById('nEmail').value.trim(),password:document.getElementById('nPassword').value,job_title:document.getElementById('nTitle').value.trim(),department:document.getElementById('nDept').value.trim(),role:document.getElementById('nRole').value,status:document.getElementById('nStatus').value,manager_id:document.getElementById('nManager').value||null};
  if(!body.full_name||!body.email||body.password.length<6){state('الاسم والبريد وكلمة مرور من 6 أحرف على الأقل مطلوبة.',true,'createState');return}
  b.disabled=true;state('جاري إنشاء الحساب...',false,'createState');
  try{const created=await invoke(body);const newId=created?.user?.id||created?.id;if(newId){const details=await sb.rpc('admin_update_profile_details',{p_profile_id:newId,p_employee_code:document.getElementById('nEmployeeCode').value.trim()||null,p_join_date:document.getElementById('nJoinDate').value||null,p_work_location:document.getElementById('nWorkLocation').value.trim()||null,p_employment_type:document.getElementById('nEmploymentType').value.trim()||null});if(details.error)throw details.error}state('تم إنشاء المستخدم بنجاح.',false,'createState');['nName','nEmail','nPassword','nTitle','nDept','nEmployeeCode','nJoinDate','nWorkLocation','nEmploymentType'].forEach(id=>document.getElementById(id).value='');document.getElementById('nRole').value='employee';document.getElementById('nStatus').value='active';document.getElementById('nManager').value='';await load('تم إنشاء المستخدم بنجاح.')}
  catch(e){console.error(e);state('تعذر إنشاء الحساب: '+(e?.message||String(e)),true,'createState')}
  finally{b.disabled=false}
};
load().catch(e=>{console.error(e);state('حدث خطأ غير متوقع: '+(e?.message||String(e)),true)});
</script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script></body></html>
