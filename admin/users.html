<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – الحسابات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>
.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px;margin-bottom:14px}.head,.row{display:grid;grid-template-columns:1.3fr 1.1fr 1fr 1fr 1.1fr .9fr auto;gap:8px;padding:10px 0;align-items:center}.head{font-size:10px;font-weight:900;color:#6f7f93;border-bottom:1px solid #edf2f7}.row{border-bottom:1px solid #edf2f7}.row input,.row select,.create-grid input,.create-grid select{border:1px solid #dce5ef;border-radius:8px;padding:8px;font-family:inherit;min-width:0}.btn{border:0;background:#0b1d3a;color:#fff;border-radius:8px;padding:9px 12px;font-family:inherit;font-weight:900;cursor:pointer}.secondary{background:#edf3fa;color:#183b62}.msg{font-size:11px;margin:8px 0;color:#157347}.err{color:#b42318}.create-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.create-grid label{display:block;font-size:10px;font-weight:900;margin-bottom:4px}.create-grid input,.create-grid select{width:100%}.full{grid-column:1/-1}.hint{font-size:10px;color:#7a899d;margin:6px 0 0}@media(max-width:1050px){.head{display:none}.row{grid-template-columns:1fr 1fr}.btn{grid-column:1/-1}.create-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.create-grid{grid-template-columns:1fr}}
</style></head><body data-min-role="admin"><div class="atwar-shell"><atwar-sidebar active="admin"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><h1>إدارة الحسابات</h1>
<section class="card"><h3 style="margin-top:0">إضافة مستخدم جديد</h3><p class="hint">يتم إنشاء الحساب وإعداد صلاحياته بالكامل من داخل ATWAR ONE.</p><div class="create-grid" style="margin-top:12px"><div><label>الاسم</label><input id="nName"></div><div><label>البريد الإلكتروني</label><input id="nEmail" type="email"></div><div><label>كلمة المرور المؤقتة</label><input id="nPassword" type="password" minlength="8"></div><div><label>المسمى</label><input id="nTitle"></div><div><label>القسم</label><input id="nDept"></div><div><label>الدور</label><select id="nRole"><option value="employee">موظف</option><option value="manager">مدير</option><option value="admin">مدير نظام</option></select></div><div><label>المدير المباشر</label><select id="nManager"><option value="">بدون مدير</option></select></div><div><label>الحالة</label><select id="nStatus"><option value="active">نشط</option><option value="inactive">غير نشط</option></select></div><div style="display:flex;align-items:end"><button id="createUser" class="btn" style="width:100%">إضافة المستخدم</button></div></div><div id="createState" class="msg"></div></section>
<div id="state" class="msg"></div><section class="card"><div class="head"><span>الاسم</span><span>المسمى</span><span>القسم</span><span>الدور</span><span>المدير المباشر</span><span>الحالة</span><span></span></div><div id="list">جاري التحميل...</div></section>
<footer class="atwar-footer"><span>ATWAR ONE • Admin Users</span><span>Production 1.3</span><span>Auth + Profiles</span></footer></main></section></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;
let users=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const state=(m,e=false,id='state')=>{const x=document.getElementById(id);x.textContent=m;x.className='msg'+(e?' err':'')};
function managerOptions(selected='',exclude=''){return '<option value="">بدون مدير</option>'+users.filter(x=>x.id!==exclude&&x.active&&x.status==='active'&&['manager','admin'].includes(x.role)).map(m=>`<option value="${m.id}" ${selected===m.id?'selected':''}>${esc(m.full_name)}</option>`).join('')}
async function invoke(body){
  const {data:{session},error:sessionErr}=await sb.auth.getSession();
  if(sessionErr||!session?.access_token) throw new Error('انتهت جلسة الدخول. أعد تسجيل الدخول.');
  const res=await fetch(`${c.url}/functions/v1/admin-create-user`,{
    method:'POST',
    headers:{
      'Authorization':`Bearer ${session.access_token}`,
      'apikey':c.publishableKey,
      'Content-Type':'application/json'
    },
    body:JSON.stringify(body)
  });
  const text=await res.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{throw new Error(`استجابة غير صالحة من خدمة المستخدمين (${res.status})`)}
  if(!res.ok||data?.error) throw new Error(data?.error||`فشل الطلب (${res.status})`);
  return data;
}
async function load(){
  const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}
  const{data:p,error:pe}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(pe||!p||p.role!=='admin'||!p.active||p.status!=='active'){location.href='../home.html';return}
  window.atwarSyncShellIdentity?.(p,session.user);
  try{
    const data=await invoke({action:'list'});users=data.users||[];
  }catch(e){console.error(e);state('تعذر تحميل المستخدمين: '+(e?.message||String(e)),true);document.getElementById('list').innerHTML='';return}
  document.getElementById('nManager').innerHTML=managerOptions();
  document.getElementById('list').innerHTML=users.map(u=>`<div class="row" data-id="${u.id}"><input class="name" value="${esc(u.full_name||'')}"><input class="title" value="${esc(u.job_title||'')}"><input class="dept" value="${esc(u.department||'')}"><select class="role"><option value="employee" ${u.role==='employee'?'selected':''}>موظف</option><option value="manager" ${u.role==='manager'?'selected':''}>مدير</option><option value="admin" ${u.role==='admin'?'selected':''}>مدير نظام</option></select><select class="manager">${managerOptions(u.manager_id||'',u.id)}</select><select class="status"><option value="active" ${u.status==='active'?'selected':''}>نشط</option><option value="inactive" ${u.status==='inactive'?'selected':''}>غير نشط</option></select><button class="btn save">حفظ</button></div>`).join('')||'<div style="padding:14px">لا يوجد مستخدمون.</div>';
  document.querySelectorAll('.save').forEach(b=>b.onclick=()=>save(b.closest('.row')));
  state(`تم تحميل ${users.length} مستخدمًا.`);
}
async function save(r){
  state('جاري الحفظ...');const body={action:'update',id:r.dataset.id,full_name:r.querySelector('.name').value.trim(),job_title:r.querySelector('.title').value.trim(),department:r.querySelector('.dept').value.trim(),role:r.querySelector('.role').value,status:r.querySelector('.status').value,manager_id:r.querySelector('.manager').value||null};
  try{await invoke(body);state('تم الحفظ بنجاح.');await load()}catch(e){console.error(e);state('تعذر الحفظ: '+(e?.message||String(e)),true)}
}
document.getElementById('createUser').onclick=async()=>{
  const b=document.getElementById('createUser');const body={action:'create',full_name:document.getElementById('nName').value.trim(),email:document.getElementById('nEmail').value.trim(),password:document.getElementById('nPassword').value,job_title:document.getElementById('nTitle').value.trim(),department:document.getElementById('nDept').value.trim(),role:document.getElementById('nRole').value,status:document.getElementById('nStatus').value,manager_id:document.getElementById('nManager').value||null};
  if(!body.full_name||!body.email||body.password.length<8){state('الاسم والبريد وكلمة مرور من 8 أحرف على الأقل مطلوبة.',true,'createState');return}
  b.disabled=true;state('جاري إنشاء الحساب...',false,'createState');
  try{await invoke(body);state('تم إنشاء المستخدم بنجاح.',false,'createState');['nName','nEmail','nPassword','nTitle','nDept'].forEach(id=>document.getElementById(id).value='');document.getElementById('nRole').value='employee';document.getElementById('nStatus').value='active';document.getElementById('nManager').value='';await load()}
  catch(e){console.error(e);state('تعذر إنشاء الحساب: '+(e?.message||String(e)),true,'createState')}
  finally{b.disabled=false}
};
load().catch(e=>{console.error(e);state('حدث خطأ غير متوقع: '+(e?.message||String(e)),true)});
</script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script></body></html>
