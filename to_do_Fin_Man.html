<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهام وأعمال ومشاريع المدير المالي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgvfHsmtb0qYAMfUJv7iKmZUCJ5n_aSy4",
            authDomain: "atwarpms.firebaseapp.com",
            databaseURL: "https://atwarpms-default-rtdb.firebaseio.com",
            projectId: "atwarpms",
            storageBucket: "atwarpms.appspot.com",
            messagingSenderId: "352965627186",
            appId: "1:352965627186:web:4da393db672e3d90c45b2b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // متغير عالمي للمهام
        window.tasks = [];
        const tasksRef = ref(db, 'tasks');

        // الاستماع للتغييرات لحظياً
        onValue(tasksRef, (snapshot) => {
            const data = snapshot.val();
            window.tasks = data ? Object.keys(data).map(key => ({ dbKey: key, ...data[key] })) : [];
            renderTable();
            updateStats();
        });

        // دوال تعديل السحاب
        window.saveToCloud = function(task, key) {
            if (key) {
                update(ref(db, 'tasks/' + key), task);
            } else {
                push(tasksRef, task);
            }
        };

        window.deleteFromCloud = function(key) {
            remove(ref(db, 'tasks/' + key));
        };
    </script>

    <style>
        body{font-family:'Tajawal',sans-serif;}
        .desc-textarea{line-height:1.4;max-height:38px;transition:max-height .3s ease;}
        .desc-textarea:focus{max-height:120px;overflow-y:auto!important;}
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-[98%] mx-auto px-4 py-4 flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-3 h-9 bg-blue-500 rounded-full"></div>
                <h1 class="text-xl font-bold">مهام وأعمال ومشاريع المدير المالي</h1>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="addNewTask()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl">➕ إضافة مهمة جديدة</button>
            </div>
        </div>
    </header>

    <!-- Main Table -->
    <main class="max-w-[98%] mx-auto px-2 py-6">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <table class="w-full text-right text-xs">
                <thead class="bg-slate-800 text-white">
                    <tr>
                        <th class="p-3">عنوان المهمة</th>
                        <th class="p-3">الحالة</th>
                        <th class="p-3">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody" class="divide-y divide-slate-200"></tbody>
            </table>
        </div>
    </main>

<script>
    function renderTable() {
        const tbody = document.getElementById('tasksTableBody');
        tbody.innerHTML = '';
        window.tasks.forEach((t, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-3"><input type="text" value="${t.title}" onchange="updateField(${i},'title',this.value)" class="w-full bg-transparent"></td>
                <td class="p-3">
                    <select onchange="updateField(${i},'status',this.value)">
                        <option value="مكتملة" ${t.status==='مكتملة'?'selected':''}>مكتملة</option>
                        <option value="قيد التنفيذ" ${t.status==='قيد التنفيذ'?'selected':''}>قيد التنفيذ</option>
                    </select>
                </td>
                <td class="p-3"><button onclick="deleteFromCloud('${t.dbKey}')" class="text-rose-500">حذف</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateField(i, field, val) {
        let task = {...window.tasks[i]};
        const key = task.dbKey;
        delete task.dbKey;
        task[field] = val;
        saveToCloud(task, key);
    }

    function addNewTask() {
        saveToCloud({title: "مهمة جديدة", status: "قيد الانتظار", progress: 0});
    }

    function updateStats() { /* نفس كود الإحصائيات القديم */ }
</script>
</body>
</html>
