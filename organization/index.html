<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – الهيكل التنظيمي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.o-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.o-head h1{font-size:30px;margin:0}.o-head p{font-size:12px;color:#7b8aa5;margin:5px 0 0}
.dept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dept{background:#fff;border:1px solid #e5edf6;border-radius:19px;padding:18px;text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(20,45,80,.035)}
.dept:hover{border-color:#bcd7f7;transform:translateY(-1px)}
.dept-top{display:flex;justify-content:space-between;align-items:center}.dept-icon{width:45px;height:45px;border-radius:14px;background:#eef6ff;color:#1677ff;display:grid;place-items:center}
.dept h3{font-size:15px;margin:14px 0 5px}.dept p{font-size:10px;color:#7c8ba0;margin:0;line-height:1.7}.count{font-size:10px;font-weight:900;background:#f1f5f9;padding:5px 8px;border-radius:999px}
.org-note{margin-top:16px;background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:18px}
.org-note h3{font-size:15px;margin:0 0 8px}.org-note p{font-size:11px;color:#69798f;line-height:1.9;margin:0}
@media(max-width:1000px){.dept-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.dept-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="atwar-shell">
<atwar-sidebar active=""></atwar-sidebar>
<section class="atwar-main">
<atwar-header></atwar-header>
<main class="atwar-content">
<section style="min-height:460px;display:flex;align-items:center;justify-content:center">
<div style="width:min(620px,100%);background:#fff;border:1px solid #e5edf6;border-radius:20px;padding:34px;text-align:center">
<i data-lucide="network" style="width:42px;height:42px;color:#1677ff"></i>
<h1 style="font-size:24px;margin:14px 0 8px">الهيكل التنظيمي</h1>
<p style="font-size:12px;color:#66778d;line-height:1.9">لن نعرض إدارات أو هيكلاً افتراضيًا غير مخزن في النظام. الهيكل التشغيلي الحالي يظهر ديناميكيًا في صفحة الفريق اعتمادًا على علاقات المدير المباشر المسجلة في Firebase.</p>
<a href="../team/index.html" style="display:inline-block;margin-top:16px;padding:10px 16px;background:#0b1d3a;color:#fff;border-radius:10px;text-decoration:none;font-weight:900;font-size:11px">فتح الفريق والهيكل الفعلي</a>
</div></section>
<footer class="atwar-footer"><span>ATWAR ONE • Organization</span><span>V0.40.5</span><span>بيانات فعلية فقط</span></footer>
</main></section></div>
<script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/permissions.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{const q=document.querySelector('[data-global-search]');if(q)q.addEventListener('keydown',e=>{if(e.key==='Enter'&&q.value.trim())location.href='../search/index.html?q='+encodeURIComponent(q.value.trim())})});
lucide.createIcons();
</script>
<script src="../assets/js/consolidation.js"></script>
</body></html>
