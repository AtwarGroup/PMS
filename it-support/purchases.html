<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/shared.css?v=2.5.26" />
    <link rel="stylesheet" href="../assets/css/app-theme.css?v=2.8.5" />
    <link rel="stylesheet" href="../assets/css/recruitment.css?v=1" />
    <link rel="stylesheet" href="../assets/css/fleet-operations.css?v=2" />
    <link rel="stylesheet" href="../assets/css/it-support.css?v=9" />
    <script src="../assets/vendor/lucide-1.47.0.min.js"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/module-access.js?v=it-live-20261101"></script>
    <script src="../assets/js/supabase-runtime.js"></script>
    <script src="../assets/js/session-service.js?v=2.5.2"></script>
    <script src="../assets/js/shell-components.js?v=it-live-20261101"></script>
    <script src="../assets/js/ui-feedback.js?v=2.5.27"></script>
  </head>
  <body>
    <div class="atwar-shell">
      <atwar-sidebar active="it_support"></atwar-sidebar>
      <section class="atwar-main">
        <atwar-header></atwar-header>
        <main class="atwar-content recruitment-page it-support-page">
          <header class="atwar-page-head">
            <div>
              <p class="recruitment-eyebrow">
                الخدمات التقنية · الدعم والمساندة
              </p>
              <h1>طلبات الشراء التقنية</h1>
              <p>عرض السعر والاعتماد والاستلام والصرف في طلب واحد.</p>
            </div>
            <button id="createRequest" class="rec-btn" hidden>
              طلب شراء تقني
            </button>
          </header>
          <p id="pageStatus" role="status" aria-live="polite">
            جارٍ التحقق من الصلاحيات…
          </p>
          <section id="supportMetrics" class="task-suite-metrics" aria-label="ملخص طلبات الدعم"></section>
<section class="task-filter-bar" aria-label="تصفية طلبات الدعم">
<input id="search" type="search" aria-label="البحث في الطلبات" placeholder="بحث في طلبات الدعم…">
<div id="quickFilters"><button class="qf active" data-filter="all" aria-pressed="true">الكل</button><button class="qf" data-filter="overdue" aria-pressed="false">متأخرة</button><button class="qf" data-filter="today" aria-pressed="false">اليوم</button><button class="qf" data-filter="new" aria-pressed="false">جديدة</button><button class="qf" data-filter="working" aria-pressed="false">قيد المعالجة</button><button class="qf" data-filter="approval" aria-pressed="false">بانتظار الاعتماد</button><button class="qf" data-filter="waiting" aria-pressed="false">بانتظار الرد</button></div>
<div class="view-switch" role="group" aria-label="طريقة العرض"><button type="button" data-display="LIST" class="active" aria-pressed="true">قائمة</button><button type="button" data-display="KANBAN" aria-pressed="false">كانبان</button></div>
<select id="sortFilter" aria-label="ترتيب الطلبات"><option value="default">الترتيب الافتراضي</option><option value="newest">الأحدث</option><option value="oldest">الأقدم</option><option value="priority">الأولوية</option></select>
<select id="scopeFilter" aria-label="نطاق الطلبات" hidden><option value="all">جميع الطلبات المتاحة</option><option value="mine">طلباتي</option></select>
<select id="stateFilter" hidden aria-label="حالة الطلب"><option value="">جميع الحالات</option></select>
</section>
<section id="viewContent" aria-live="polite"></section>
          <dialog id="recDialog" aria-labelledby="dialogTitle">
            <header>
              <div>
                <p class="recruitment-eyebrow">ATWAR ONE · طلبات الشراء التقنية</p>
                <h2 id="dialogTitle"></h2>
              </div>
              <button id="closeDialog" class="rec-btn secondary" type="button">
                إغلاق
              </button>
            </header>
            <div id="dialogBody"></div>
            <p id="dialogStatus" role="status" aria-live="polite"></p>
          </dialog>
        </main>
      </section>
    </div>
    <script type="module" src="../assets/js/it-support-page.mjs?v=12"></script>
  </body>
</html>
