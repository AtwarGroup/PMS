<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – المهام الدورية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
*{box-sizing:border-box}body{font-family:'Tajawal',sans-serif}
.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:2fr 1.25fr 1fr .8fr 1.25fr .9fr;gap:10px}
.field{min-width:0}.field label{display:block;font-size:10px;font-weight:900;color:#64748b;margin:0 2px 6px}
.field input,.field select{width:100%;border:1px solid #dfe7f1;border-radius:10px;padding:10px 11px;font-family:inherit;background:#fff}
.field-help{font-size:9px;color:#94a3b8;margin-top:4px;line-height:1.5}
.second-row{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin-top:10px;align-items:end}
.btn{border:0;background:#0b1d3a;color:#fff;border-radius:10px;padding:10px 14px;font-family:inherit;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}.danger{background:#b42318}.secondary{background:#eaf2fb;color:#173b64}
.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf2f7}
.meta{font-size:10px;color:#7b8aa5}.success{color:#15803d;font-weight:800}.error{color:#b42318;font-weight:800}
@media(max-width:950px){.form-grid{grid-template-columns:1fr 1fr}.second-row,.row{grid-template-columns:1fr 1fr}.second-row .wide{grid-column:1/-1}}
@media(max-width:620px){.form-grid,.second-row,.row{grid-template-columns:1fr}}
</style>
</head>
<body data-min-role="manager">
<div class="atwar-shell">
<atwar-sidebar active=""></atwar-sidebar>
<section class="atwar-main">
<atwar-header></atwar-header>
<main class="atwar-content">
<h1 style="margin-bottom:5px">المهام الدورية</h1>
<p style="font-size:11px;color:#7b8aa5;margin-top:0">ينشئ النظام المهمة تلقائيًا عند موعدها، ويمكن تشغيل المهام المستحقة يدويًا عند الحاجة.</p>

<section class="card">
<h3 style="margin-top:0">إضافة مهمة دورية</h3>
<div class="form-grid">
  <div class="field"><label>عنوان المهمة</label><input id="title" placeholder="مثال: مراجعة تقرير المبيعات الأسبوعي"></div>
  <div class="field"><label>المسند إليه</label><select id="assignee"></select></div>
  <div class="field"><label>التكرار</label><select id="recurrence"><option value="daily">يومي</option><option value="weekly">أسبوعي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></div>
  <div class="field"><label>كل</label><input id="interval" type="number" min="1" max="365" value="1"><div id="intervalHelp" class="field-help">كل أسبوع</div></div>
  <div class="field"><label>موعد أول إنشاء</label><input id="next" type="datetime-local"></div>
  <div class="field"><label>الأولوية</label><select id="priority"><option value="normal">عادية</option><option value="important">مهمة</option><option value="urgent">عاجلة</option></select></div>
</div>

<div class="second-row">
  <div class="field wide"><label>الوصف</label><input id="desc" placeholder="وصف المهمة أو التعليمات (اختياري)"></div>
  <div class="field"><label>مهلة الإنجاز بالأيام</label><input id="dueOffset" type="number" min="0" max="365" value="0"><div class="field-help">عدد الأيام من تاريخ إنشاء المهمة حتى تاريخ استحقاقها.</div></div>
  <button id="add" class="btn">إضافة</button>
</div>
<div id="msg" class="meta" style="margin-top:10px"></div>
</section>

<section class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
  <h3 style="margin:0">المهام الدورية الحالية</h3>
  <button id="run" class="btn">تشغيل المستحق الآن</button>
</div>
<div id="list" style="margin-top:10px">جاري التحميل...</div>
</section>
<footer class="atwar-footer"><span>ATWAR ONE • Recurring Tasks</span><span>Production 1.8.1</span><span>Hourly Scheduler</span></footer>
</main></section></div>

<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/supabase-runtime.js"></script>
<script type="module">
const sb=await window.atwarGetSupabase();
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let me=null,people=[];
const labelMap={daily:'يوم',weekly:'أسبوع',monthly:'شهر',yearly:'سنة'};
const displayMap={daily:'يومي',weekly:'أسبوعي',monthly:'شهري',yearly:'سنوي'};
function dt(v){try{return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Riyadh'}).format(new Date(v))}catch{return v||''}}
function recurrenceText(kind,n){
 n=Number(n||1);const unit=labelMap[kind]||'دورة';
 if(n===1)return `كل ${unit}`;
 if(kind==='weekly'&&n===2)return 'كل أسبوعين';
 if(kind==='daily'&&n===2)return 'كل يومين';
 if(kind==='monthly'&&n===2)return 'كل شهرين';
 if(kind==='yearly'&&n===2)return 'كل سنتين';
 return `كل ${n} ${unit}`;
}
function setDefaultNext(){
 const d=new Date(Date.now()+3600000);d.setMinutes(0,0,0);
 document.getElementById('next').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
}
function updateIntervalHelp(){document.getElementById('intervalHelp').textContent=recurrenceText(document.getElementById('recurrence').value,document.getElementById('interval').value)}
function resetForm(){
 document.getElementById('title').value='';
 document.getElementById('desc').value='';
 document.getElementById('recurrence').value='weekly';
 document.getElementById('interval').value='1';
 document.getElementById('priority').value='normal';
 document.getElementById('dueOffset').value='0';
 if(document.getElementById('assignee').options.length)document.getElementById('assignee').selectedIndex=0;
 setDefaultNext();updateIntervalHelp();
}
async function load(){
 const r=await sb.from('recurring_task_templates').select('*').order('next_run_at');
 const rows=r.data||[];
 document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<div class="row">
 <div><b>${esc(x.title)}</b><div class="meta">${esc(people.find(p=>p.id===x.assignee_id)?.full_name||x.assignee_id)}</div></div>
 <div class="meta">${esc(recurrenceText(x.recurrence,x.interval_count))}</div>
 <div class="meta">التالي: ${esc(dt(x.next_run_at))}</div>
 <label class="meta"><input type="checkbox" class="active" data-id="${x.id}" ${x.active?'checked':''}> نشط</label>
 <button class="btn danger del" data-id="${x.id}">حذف</button></div>`).join(''):'<div class="meta" style="padding:24px;text-align:center">لا توجد مهام دورية.</div>';
 document.querySelectorAll('.active').forEach(x=>x.onchange=async()=>{const r=await sb.from('recurring_task_templates').update({active:x.checked}).eq('id',x.dataset.id);if(r.error){alert(r.error.message);x.checked=!x.checked}});
 document.querySelectorAll('.del').forEach(x=>x.onclick=async()=>{if(!confirm('حذف هذه المهمة الدورية؟'))return;const r=await sb.from('recurring_task_templates').delete().eq('id',x.dataset.id);if(r.error)alert(r.error.message);else load()});
}
const{data:{session}}=await sb.auth.getSession();
if(!session?.user)location.href='../login.html';
else{
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=p;
 if(!p||!['manager','admin'].includes(p.role))location.href='../home.html';
 else{
  window.atwarSyncShellIdentity?.(p,session.user);
  const pr=await sb.from('profiles').select('id,full_name,email,manager_id,role,active,status').eq('active',true).eq('status','active').order('full_name');
  people=(pr.data||[]).filter(x=>p.role==='admin'||x.id===p.id||x.manager_id===p.id);
  document.getElementById('assignee').innerHTML=people.map(x=>`<option value="${x.id}">${esc(x.full_name||x.email)}</option>`).join('');
  resetForm();await load();
 }
}
document.getElementById('recurrence').addEventListener('change',updateIntervalHelp);
document.getElementById('interval').addEventListener('input',updateIntervalHelp);
document.getElementById('add').onclick=async()=>{
 const title=document.getElementById('title').value.trim(),assignee=document.getElementById('assignee').value,next=document.getElementById('next').value;
 const msg=document.getElementById('msg');
 if(!title||!assignee||!next){msg.className='meta error';msg.textContent='العنوان والمسند إليه وموعد أول إنشاء حقول مطلوبة.';return}
 const payload={owner_id:me.id,assignee_id:assignee,title,description:document.getElementById('desc').value.trim()||null,priority:document.getElementById('priority').value,recurrence:document.getElementById('recurrence').value,interval_count:Number(document.getElementById('interval').value||1),next_run_at:new Date(next).toISOString(),due_offset_days:Number(document.getElementById('dueOffset').value||0)};
 const b=document.getElementById('add');b.disabled=true;
 const r=await sb.from('recurring_task_templates').insert(payload);
 b.disabled=false;
 if(r.error){msg.className='meta error';msg.textContent='تعذر الإضافة: '+r.error.message;return}
 resetForm();msg.className='meta success';msg.textContent='تمت إضافة المهمة الدورية بنجاح وتم تفريغ الحقول.';await load();
};
document.getElementById('run').onclick=async()=>{const r=await sb.rpc('run_recurring_tasks_safe');if(r.error)alert(r.error.message);else{alert(`تم إنشاء ${r.data||0} مهمة مستحقة.`);await load()}};
try{lucide.createIcons()}catch{}
</script>
</body></html>
