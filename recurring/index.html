<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – المهام الدورية</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:2fr 1.2fr 1fr .8fr 1.2fr .8fr;gap:8px}.grid input,.grid select{border:1px solid #dfe7f1;border-radius:9px;padding:9px;font-family:inherit;min-width:0}.btn{border:0;background:#0b1d3a;color:#fff;border-radius:9px;padding:9px 12px;font-family:inherit;font-weight:900;cursor:pointer}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #edf2f7}.meta{font-size:10px;color:#7b8aa5}.danger{background:#b42318}@media(max-width:900px){.grid,.row{grid-template-columns:1fr}}</style></head><body data-min-role="manager"><div class="atwar-shell"><atwar-sidebar active="recurring"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><h1 style="margin-bottom:5px">المهام الدورية</h1><p style="font-size:11px;color:#7b8aa5;margin-top:0">ينشئ النظام المهام المستحقة تلقائيًا كل ساعة، ويمكن التشغيل اليدوي عند الحاجة.</p><section class="card"><h3 style="margin-top:0">إضافة مهمة دورية</h3><div class="grid"><input id="title" placeholder="عنوان المهمة"><select id="assignee"></select><select id="recurrence"><option value="daily">يومي</option><option value="weekly">أسبوعي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select><input id="interval" type="number" min="1" max="365" value="1" title="كل كم دورة"><input id="next" type="datetime-local"><select id="priority"><option value="normal">عادية</option><option value="important">مهمة</option><option value="urgent">عاجلة</option></select></div><div class="grid" style="margin-top:8px;grid-template-columns:2fr 1fr auto"><input id="desc" placeholder="الوصف (اختياري)"><input id="dueOffset" type="number" min="0" max="365" value="0" placeholder="مهلة بالأيام"><button id="add" class="btn">إضافة</button></div><div id="msg" class="meta" style="margin-top:8px"></div></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">المهام الدورية الحالية</h3><button id="run" class="btn">تشغيل المستحق الآن</button></div><div id="list" style="margin-top:10px">جاري التحميل...</div></section><footer class="atwar-footer"><span>ATWAR ONE • Recurring Tasks</span><span>Production 1.8.0</span><span>Hourly Scheduler</span></footer></main></section></div><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/permissions.js"></script><script type="module">const sb=await window.atwarGetSupabase();const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let me=null,people=[];function dt(v){try{return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Riyadh'}).format(new Date(v))}catch{return v||''}}async function load(){const r=await sb.from('recurring_task_templates').select('*').order('next_run_at');const rows=r.data||[];document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="meta">${esc(people.find(p=>p.id===x.assignee_id)?.full_name||x.assignee_id)}</div></div><div class="meta">${esc(({daily:'يومي',weekly:'أسبوعي',monthly:'شهري',yearly:'سنوي'})[x.recurrence]||x.recurrence)} × ${x.interval_count}</div><div class="meta">التالي: ${esc(dt(x.next_run_at))}</div><label class="meta"><input type="checkbox" class="active" data-id="${x.id}" ${x.active?'checked':''}> نشط</label><button class="btn danger del" data-id="${x.id}">حذف</button></div>`).join(''):'<div class="meta" style="padding:24px;text-align:center">لا توجد مهام دورية.</div>';document.querySelectorAll('.active').forEach(x=>x.onchange=async()=>{const r=await sb.from('recurring_task_templates').update({active:x.checked}).eq('id',x.dataset.id);if(r.error){alert(r.error.message);x.checked=!x.checked}});document.querySelectorAll('.del').forEach(x=>x.onclick=async()=>{if(!confirm('حذف هذه المهمة الدورية؟'))return;const r=await sb.from('recurring_task_templates').delete().eq('id',x.dataset.id);if(r.error)alert(r.error.message);else load()})}const{data:{session}}=await sb.auth.getSession();if(!session?.user)location.href='../login.html';else{const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=p;if(!p||!['manager','admin'].includes(p.role))location.href='../home.html';else{window.atwarSyncShellIdentity?.(p,session.user);const pr=await sb.from('profiles').select('id,full_name,email,manager_id,role,active,status').eq('active',true).eq('status','active').order('full_name');people=(pr.data||[]).filter(x=>p.role==='admin'||x.id===p.id||x.manager_id===p.id);document.getElementById('assignee').innerHTML=people.map(x=>`<option value="${x.id}">${esc(x.full_name||x.email)}</option>`).join('');const d=new Date(Date.now()+3600000);d.setMinutes(0,0,0);document.getElementById('next').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);await load()}}document.getElementById('add').onclick=async()=>{const title=document.getElementById('title').value.trim(),assignee=document.getElementById('assignee').value,next=document.getElementById('next').value;if(!title||!assignee||!next){document.getElementById('msg').textContent='العنوان والمسؤول والموعد مطلوبة.';return}const payload={owner_id:me.id,assignee_id:assignee,title,description:document.getElementById('desc').value.trim()||null,priority:document.getElementById('priority').value,recurrence:document.getElementById('recurrence').value,interval_count:Number(document.getElementById('interval').value||1),next_run_at:new Date(next).toISOString(),due_offset_days:Number(document.getElementById('dueOffset').value||0)};const r=await sb.from('recurring_task_templates').insert(payload);document.getElementById('msg').textContent=r.error?'تعذر الإضافة: '+r.error.message:'تمت إضافة المهمة الدورية.';if(!r.error){document.getElementById('title').value='';document.getElementById('desc').value='';await load()}};document.getElementById('run').onclick=async()=>{const r=await sb.rpc('run_recurring_tasks_safe');if(r.error)alert(r.error.message);else{alert(`تم إنشاء ${r.data||0} مهمة مستحقة.`);await load()}};try{lucide.createIcons()}catch{}</script></body></html>
