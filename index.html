                                        <div className={`absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l ${activeDept.gradient} opacity-10 pointer-events-none`}></div>
                                        <div className="p-8 md:p-12 relative z-10 flex flex-col md:flex-row items-center md:items-start gap-8">
                                            <div className={`w-20 h-20 bg-gradient-to-br ${activeDept.gradient} text-white rounded-[1.5rem] flex items-center justify-center shadow-xl shadow-${activeDept.color}-500/30 flex-shrink-0`}>
                                                <Icon name={activeDept.icon} className="w-10 h-10" />
                                            </div>
                                            <div className="text-center md:text-right flex-grow">
                                                <span className={`text-xs font-black uppercase tracking-widest text-${activeDept.color}-600 mb-2 block`}>دليل الأداء الوظيفي</span>
                                                <h2 className="text-3xl font-black text-slate-900 mb-3">{activeDept.name}</h2>
                                                <p className="text-slate-500 font-bold max-w-2xl leading-relaxed">
                                                    {activeDept.desc} اختر الوظيفة أدناه لاستعراض المهام الدورية، مؤشرات القياس (KPIs)، والصلاحيات المعتمدة للتقييم.
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Roles Grid */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                                        {activeDept.roles.map((role, index) => (
                                            <a 
                                                key={index} 
                                                href={role.url}
                                                target={role.url !== '#' ? "_blank" : "_self"}
                                                className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 hover:shadow-xl transition-all duration-300 group flex flex-col items-center text-center cursor-pointer hover:-translate-y-1 block"
                                            >
                                                <div className={`w-16 h-16 rounded-2xl bg-slate-50 flex items-center justify-center mb-5 group-hover:bg-${activeDept.color}-600 transition-colors shadow-inner group-hover:shadow-${activeDept.color}-500/40`}>
                                                    <Icon name="contact" className={`w-8 h-8 text-slate-400 group-hover:text-white transition-colors`} />
                                                </div>
                                                <h4 className="font-black text-slate-800 text-lg mb-4 h-12 flex items-center justify-center">{role.title}</h4>
                                                
                                                <div className="w-full h-px bg-slate-100 mb-4 group-hover:bg-slate-200 transition-colors"></div>
                                                
                                                <div className={`w-full py-3 bg-slate-50 text-slate-600 text-xs font-black rounded-xl group-hover:bg-${activeDept.color}-50 group-hover:text-${activeDept.color}-700 transition-colors flex items-center justify-center gap-2 border border-transparent group-hover:border-${activeDept.color}-200`}>
                                                    <Icon name="arrow-up-left" className="w-4 h-4" />
                                                    {role.url === '#' ? 'قريباً...' : 'عرض منظومة الأداء'}
                                                </div>
                                            </a>
                                        ))}
                                    </div>

                                </main>

                            </div>
                        )}
                        
                        {/* Global Footer (Visible on all pages) */}
                        <footer className="py-10 text-center border-t border-slate-200 bg-white mt-auto flex-shrink-0">
                            <div className="max-w-[1600px] mx-auto px-6 flex flex-col items-center justify-center gap-3">
                                <Icon name="shield-check" className="w-6 h-6 text-sky-500" />
                                <p className="text-slate-800 font-black text-base">نظام إدارة الأداء - إدارة تطوير الأعمال</p>
                                <p className="text-slate-400 font-bold text-xs mt-1">جميع الحقوق محفوظة لمؤسسة أطوار للتجارة &copy; 2026</p>
                            </div>
                        </footer>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
