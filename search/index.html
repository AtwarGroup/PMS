<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – البحث</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px}.searchbar{display:flex;gap:8px}.searchbar input{flex:1;border:1px solid #dce5ef;border-radius:10px;padding:10px;font-family:inherit}.item{padding:12px 0;border-bottom:1px solid #edf2f7;cursor:pointer}.item:last-child{border-bottom:0}.item b{font-size:12px}.item small{display:block;color:#7a899d;margin-top:4px}.primary{border:0;background:#0b1d3a;color:#fff;border-radius:10px;padding:9px 12px;font-family:inherit;font-weight:900}</style></head><body><div class="atwar-shell"><atwar-sidebar></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><h1>البحث</h1><div class="card"><div class="searchbar"><input id="q" placeholder="ابحث في العنوان، الوصف، الملاحظات، المسؤول..."><button id="go" class="primary">بحث</button></div><div id="result" style="margin-top:14px"></div></div><footer class="atwar-footer"><span>ATWAR ONE • Search</span><span>Production 1.6</span><span>RLS Search</span></footer></main></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(p)window.atwarSyncShellIdentity?.(p,session.user);const{data,error}=await sb.from('tasks').select('*').order('updated_at',{ascending:false});if(error){console.error(error);document.getElementById('result').textContent='تعذر تحميل بيانات البحث.';return}rows=data||[];const pms=new URLSearchParams(location.search);document.getElementById('q').value=pms.get('q')||'';render()}function render(){const q=document.getElementById('q').value.trim().toLowerCase();const r=q?rows.filter(t=>[t.title,t.description,t.notes,t.manager_notes,t.assignee_name_snapshot,t.creator_name_snapshot].some(v=>String(v||'').toLowerCase().includes(q))):[];document.getElementById('result').innerHTML=!q?'اكتب كلمة للبحث.':r.length?r.map(t=>`<div class="item" data-id="${t.id}"><b>${esc(t.title)}</b><small>${esc(t.assignee_name_snapshot)} · ${esc(t.status)} · ${esc(t.due_date||'بدون تاريخ')}</small></div>`).join(''):'لا توجد نتائج.';document.querySelectorAll('.item[data-id]').forEach(x=>x.onclick=()=>location.href='../tasks/index.html?task='+encodeURIComponent(x.dataset.id))}document.getElementById('go').onclick=render;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')render()};init().catch(console.error);</script><script src="../assets/js/permissions.js"></script></body></html>
