<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – البحث</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.search-hero{max-width:850px;margin:12px auto 28px;text-align:center}
.search-hero h1{font-size:28px;margin:0 0 7px}.search-hero p{font-size:12px;color:#7b8aa5}
.big-search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dfe8f2;border-radius:18px;padding:5px 15px;margin-top:18px;box-shadow:0 8px 25px rgba(20,45,80,.06)}
.big-search input{border:0;outline:0;width:100%;padding:14px 5px;font-family:inherit;font-size:14px}
.result{background:#fff;border:1px solid #e5edf6;border-radius:17px;padding:16px;margin-bottom:10px;display:flex;gap:13px;align-items:center;text-decoration:none;color:inherit}
.result:hover{border-color:#bfd9f8}.r-icon{width:42px;height:42px;border-radius:13px;background:#eef6ff;color:#1677ff;display:grid;place-items:center;flex:none}
.r-title{font-weight:900;font-size:14px}.r-meta{font-size:10px;color:#8a97a8;margin-top:4px}.empty{text-align:center;padding:50px;color:#8b98aa}
</style>
</head>
<body>
<div class="atwar-shell">
<atwar-sidebar active=""></atwar-sidebar>

<section class="atwar-main">
<atwar-header></atwar-header>

<main class="atwar-content">
<section class="search-hero">
<h1>البحث في ATWAR ONE</h1>
<p>ابحث عن مهمة، موظف، وصف وظيفي، مؤشر أداء أو صفحة داخل النظام.</p>
<div class="big-search"><i data-lucide="search"></i><input id="query" autofocus placeholder="اكتب كلمة البحث..."></div>
</section>
<section id="results"></section>
<footer class="atwar-footer"><span>ATWAR ONE • Search</span><span>V0.40.5</span><span>Firebase Live Search</span></footer>
</main></section></div>

<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/permissions.js"></script>
<script type="module" id="liveSearchBinding">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app=getApps().length?getApps()[0]:initializeApp(window.ATWAR_FIREBASE_CONFIG),auth=getAuth(app),db=getDatabase(app);
const input=document.getElementById('query'),results=document.getElementById('results');
let pages=[],people=[],tasks=[],profile=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function render(q=''){
 q=String(q||'').trim().toLowerCase();
 if(!q){results.innerHTML='<div class="empty">ابدأ بكتابة كلمة البحث.</div>';return}
 const pageRows=pages.filter(x=>`${x.title} ${x.meta} ${x.keys}`.toLowerCase().includes(q)).map(x=>({...x,kind:'صفحة'}));
 const peopleRows=people.filter(x=>`${x.name||''} ${x.email||''} ${x.title||x.jobTitle||''}`.toLowerCase().includes(q)).slice(0,10).map(x=>({title:x.name||x.email||'مستخدم',meta:x.title||x.jobTitle||x.email||'',icon:'user',href:`../team/employee.html?uid=${encodeURIComponent(x.uid)}`,kind:'موظف'}));
 const taskRows=tasks.filter(x=>`${x.title||''} ${x.desc||''} ${x.notes||''} ${x.assign||''}`.toLowerCase().includes(q)).slice(0,15).map(x=>({title:x.title||'مهمة',meta:`${x.status||''} • ${x.assign||''}`,icon:'square-check-big',href:'../tasks/index.html',kind:'مهمة'}));
 const rows=[...taskRows,...peopleRows,...pageRows];
 results.innerHTML=rows.length?rows.map(x=>`<a class="result" href="${x.href}"><div class="r-icon"><i data-lucide="${x.icon}"></i></div><div><div class="r-title">${esc(x.title)}</div><div class="r-meta">${esc(x.kind)} • ${esc(x.meta||'')}</div></div></a>`).join(''):'<div class="empty">لم يتم العثور على نتائج مطابقة ضمن نطاق صلاحيتك.</div>';
 try{lucide.createIcons()}catch{}
}

onAuthStateChanged(auth,async user=>{
 if(!user){location.href='../login.html';return}
 try{
  const us=await get(ref(db,'users')),allUsers=us.exists()?Object.entries(us.val()).map(([uid,v])=>({uid,...v})):[];
  profile=allUsers.find(u=>u.uid===user.uid)||{uid:user.uid,role:'employee'};
  const direct=allUsers.filter(u=>String(u.managerUid||'')===String(user.uid));
  const descendants=allUsers.filter(u=>
    u.uid!==user.uid &&
    u.active!==false &&
    (String(u.managerUid||'')===String(user.uid) || u.managerChain?.[user.uid]===true)
  );
  const visibleUsers=profile.role==='admin'?allUsers.filter(u=>u.active!==false):profile.role==='manager'?descendants:[];
  people=visibleUsers;

  const ownerIds=profile.role==='admin'?allUsers.map(u=>u.uid):profile.role==='manager'?[user.uid,...descendants.map(u=>u.uid)]:[user.uid];
  const buckets=await Promise.all([...new Set(ownerIds)].map(async uid=>{try{const q=await get(ref(db,`tasksByUser/${uid}`));return q.exists()?Object.entries(q.val()).map(([id,v])=>({_key:id,_ownerUid:uid,...v})):[]}catch{return []}}));
  tasks=buckets.flat();

  pages=[
   {title:'المهام',meta:'إدارة المهام',icon:'square-check-big',href:'../tasks/index.html',keys:'مهمة مهام task'},
   {title:'ملفي الوظيفي',meta:'الملف الوظيفي',icon:'circle-user-round',href:'../profile/index.html',keys:'وظيفة ملف شخصي'},
   {title:'مساحة عملي',meta:'ملاحظات ومتابعات',icon:'notebook-tabs',href:'../workspace/index.html',keys:'ملاحظات متابعة عملي'},
   ...(profile.role!=='employee'?[{title:'الفريق',meta:'إدارة الفريق',icon:'users',href:'../team/index.html',keys:'فريق موظفين'}]:[]),
   ...(profile.role==='admin'?[{title:'إدارة النظام',meta:'الإعدادات',icon:'settings',href:'../admin/index.html',keys:'ادارة نظام صلاحيات'}]:[])
  ];

  const q=new URLSearchParams(location.search).get('q')||'';input.value=q;render(q);
 }catch(e){console.error('Search:',e);results.innerHTML='<div class="empty">البحث غير متاح حالياً، حاول مرة أخرى بعد لحظات.</div>'}
});
input.addEventListener('input',e=>render(e.target.value));
</script>
<script src="../assets/js/consolidation.js"></script>
</body></html>
