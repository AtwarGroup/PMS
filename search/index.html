<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – البحث</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.47.0"></script>
<script src="../assets/js/shell-components.js?v=2.5.41"></script><script src="../assets/js/ui-feedback.js?v=2.5.27"></script><script src="../assets/js/session-service.js?v=2.5.2"></script>
<link rel="stylesheet" href="../assets/css/shared.css?v=2.5.26">
<style>
.search-hero{max-width:850px;margin:12px auto 28px;text-align:center}
.search-hero h1{font-size:28px;margin:0 0 7px}.search-hero p{font-size:12px;color:#7b8aa5}
.big-search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dfe8f2;border-radius:18px;padding:5px 15px;margin-top:18px;box-shadow:0 8px 25px rgba(20,45,80,.06)}
.big-search input{border:0;outline:0;width:100%;padding:14px 5px;font-family:inherit;font-size:14px}
.result{background:#fff;border:1px solid #e5edf6;border-radius:17px;padding:16px;margin-bottom:10px;display:flex;gap:13px;align-items:center;text-decoration:none;color:inherit}
.result:hover{border-color:#bfd9f8}.r-icon{width:42px;height:42px;border-radius:13px;background:#eef6ff;color:#1677ff;display:grid;place-items:center;flex:none}
.r-title{font-weight:900;font-size:14px}.r-meta{font-size:10px;color:#8a97a8;margin-top:4px}.empty{text-align:center;padding:50px;color:#8b98aa}
.search-tools{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;text-align:start;font-size:13px;color:#64748b}.search-tools select{font:inherit;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;background:white;margin-inline-start:8px}.search-group{max-width:1000px;margin:0 auto 26px}.search-group header{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}.search-group h2{font-size:17px;margin:0}.search-group header span,.search-limit{font-size:12px;color:#64748b}.r-copy{flex:1;min-width:0}.r-title{display:block;overflow-wrap:anywhere}.r-meta{display:block;font-size:12px}.r-open{font-size:12px;color:#64748b;white-space:nowrap}.result{padding:15px 18px;border-radius:12px;box-shadow:none}.search-hero{margin:0 auto 24px}.search-hero p{line-height:1.8}#searchStatus{font-size:12px;text-align:start}@media(max-width:550px){.search-tools{align-items:start;flex-direction:column}.r-open{display:none}}
</style>
<link rel="stylesheet" href="../assets/css/app-theme.css?v=2.5.36" data-atwar-app-theme="1">
</head>
<body>
<div class="atwar-shell">
<atwar-sidebar active=""></atwar-sidebar>

<section class="atwar-main">
<atwar-header></atwar-header>

<main class="atwar-content">
<section class="search-hero">
<h1>البحث في ATWAR ONE</h1>
<p>المهام والمشاريع والأوصاف الوظيفية والسياسات، في بحث واحد.</p>
<div class="big-search"><i data-lucide="search"></i><input id="query" aria-label="كلمة البحث" autofocus placeholder="اكتب كلمة البحث..."></div>
<div class="search-tools"><label>نوع النتائج <select id="searchType"><option value="all">كل النتائج</option><option value="tasks">المهام</option><option value="projects">المشاريع</option><option value="jobs">الأوصاف الوظيفية</option><option value="policies">السياسات</option><option value="people">الفريق</option><option value="pages">صفحات النظام</option></select></label><span id="searchCount">جاري التجهيز…</span></div><p id="searchStatus" role="status">جاري تحميل بيانات البحث…</p></section>
<section id="results" aria-live="polite"></section>
<footer class="atwar-footer"><span>ATWAR ONE • Search</span><span>نظام إدارة الأداء المؤسسي</span><span>Supabase Live Search</span></footer>
</main></section></div>

<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/supabase-runtime.js"></script>
<script src="../assets/js/permissions.js"></script>
<script type="module" id="liveSearchBinding" src="../assets/js/search-page.mjs?v=2.5.42"></script>
</body></html>
