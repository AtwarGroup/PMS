<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – مكتبة الوظائف</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>.library-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}@media(max-width:650px){.library-head{align-items:flex-start!important;flex-direction:column}}</style>
<script src="../assets/js/shell-components.js?v=1.9.18"></script><link rel="stylesheet" href="../assets/css/shared.css"><link rel="stylesheet" href="../assets/css/job-library.css"><link rel="stylesheet" href="../assets/css/job-library-v2.css"></head>
<body style="visibility:hidden"><div class="atwar-shell"><atwar-sidebar active="jobLibrary"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content">
<header class="library-head"><div><h1>مكتبة الوظائف</h1><p>مصدر واحد للوصف الوظيفي؛ يُراجع ثم يُنشر للموظف في صورة واضحة.</p></div><div class="library-actions admin-only"><button id="reviewDraftBtn" class="jl-btn"><i data-lucide="file-pen-line"></i> تجهيز المسودات المهنية</button><button id="importBtn" class="jl-btn primary"><i data-lucide="upload"></i> إضافة الوظائف الناقصة</button></div></header>
<nav class="view-tabs"><button class="active" data-view="library">الأوصاف الوظيفية</button><button class="admin-only" data-view="assignments">ربط الموظفين</button></nav>
<section id="libraryView"><div id="stats" class="stats"></div><div class="toolbar"><input id="search" placeholder="ابحث بالمسمى أو الرمز أو الاسم البديل"><select id="statusFilter"><option value="">كل الحالات</option><option value="DRAFT">مسودة</option><option value="IN_REVIEW">قيد المراجعة</option><option value="CHANGES_REQUESTED">تحتاج تعديل</option><option value="MANAGER_APPROVED">موافق عليها</option><option value="PUBLISHED">منشورة</option></select></div><div id="state" class="empty">جاري تحميل المكتبة...</div><div id="grid" class="job-grid"></div></section>
<section id="assignmentsView" hidden><div class="assignment-note"><b>الربط التنظيمي</b><span>اختر وصف الموظف فقط. المدير المراجع يُستمد من المدير المباشر المسجل للموظف، ولا يُستنتج من المسمى.</span></div><div class="toolbar"><input id="employeeSearch" placeholder="ابحث باسم الموظف أو المسمى"><select id="assignmentFilter"><option value="">الكل</option><option value="unlinked">غير مربوط</option><option value="linked">مربوط</option></select></div><div id="assignmentList" class="assignment-list"></div></section>
<footer class="atwar-footer"><span>ATWAR ONE • Job Library</span><span>Review & Publication</span><span>Version history enabled</span></footer></main></section></div>
<div id="workspace" class="workspace" hidden><div class="workspace-shell"><header class="workspace-head"><button id="closeBtn" class="icon-btn" aria-label="إغلاق"><i data-lucide="x"></i></button><div class="workspace-title"><span id="editorCode"></span><h2 id="editorTitle"></h2><div id="editorMeta"></div></div><div id="editorActions"></div></header><nav id="editorTabs" class="editor-tabs"></nav><main id="editorBody" class="editor-body"></main></div></div><div id="toast" class="toast"></div>
<script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/permissions.js"></script><script type="module" src="../assets/js/job-library-page.js"></script></body></html>
