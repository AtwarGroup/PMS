<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – مكتبة الوظائف</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>
.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:16px}.page-head h1{margin:0;font-size:27px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-family:inherit;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.danger{background:#fff1f2;color:#b42318}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:9px;color:var(--muted)}.toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.toolbar input,.toolbar select,.editor input,.editor select,.editor textarea{border:1px solid #dce5ef;border-radius:9px;padding:9px;font-family:inherit;background:#fff}.toolbar input{min-width:260px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;cursor:pointer}.card:hover{border-color:#9cc8f7}.card-top{display:flex;justify-content:space-between;gap:8px}.code{font-size:9px;color:#718096}.card h3{font-size:14px;margin:5px 0}.meta{font-size:10px;color:#718096;line-height:1.7}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900}.DRAFT{background:#eef2f7}.IN_REVIEW{background:#fff7df;color:#8a5a00}.CHANGES_REQUESTED{background:#fff0f0;color:#b42318}.MANAGER_APPROVED{background:#e9f8f1;color:#067647}.PUBLISHED{background:#e8f2ff;color:#175cd3}.drawer{position:fixed;inset:0;background:rgba(11,29,58,.45);display:none;z-index:50}.drawer.open{display:block}.panel{position:absolute;top:0;bottom:0;right:0;width:min(880px,96vw);background:#f7f9fc;padding:18px;overflow:auto}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;top:-18px;background:#f7f9fc;padding:12px 0;z-index:2}.editor{display:grid;gap:12px}.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.section h3{font-size:13px;margin:0 0 8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editor label{display:grid;gap:5px;font-size:10px;font-weight:900}.editor textarea{min-height:115px;line-height:1.8;resize:vertical}.comments{display:grid;gap:7px}.comment{background:#f5f8fc;border-radius:10px;padding:9px;font-size:10px}.empty{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:35px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:20px;background:#10274b;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:90}.hint{font-size:9px;color:#7b8aa5;line-height:1.7}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid,.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.page-head,.toolbar{display:block}.actions,.filters{margin-top:9px}.toolbar input{min-width:0;width:100%}}
</style></head><body style="visibility:hidden"><div class="atwar-shell"><atwar-sidebar active="jobLibrary"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content">
<div class="page-head"><div><h1>مكتبة الوظائف</h1><p>مراجعة واعتماد ونشر الأوصاف الوظيفية من مصدر واحد دون تكرار.</p></div><div class="actions"><button id="importBtn" class="btn primary" data-role-only="admin"><i data-lucide="upload"></i> رفع المكتبة المعتمدة للمراجعة</button></div></div>
<div id="stats" class="stats"></div><div class="toolbar"><div class="filters"><input id="search" placeholder="ابحث بالمسمى أو الرمز"><select id="statusFilter"><option value="">كل الحالات</option><option value="DRAFT">مسودة</option><option value="IN_REVIEW">قيد مراجعة المدير</option><option value="CHANGES_REQUESTED">معادة للتعديل</option><option value="MANAGER_APPROVED">موافق عليها</option><option value="PUBLISHED">منشورة</option></select></div><span class="hint">المدير يرى الوظائف المسندة له فقط، والموظف يرى النسخة المنشورة لوظيفته من «ملفي الوظيفي».</span></div>
<div id="state" class="empty">جاري تحميل المكتبة...</div><div id="grid" class="grid"></div>
<footer class="atwar-footer"><span>ATWAR ONE • Job Library</span><span>Review & Publication</span><span>Version history enabled</span></footer></main></section></div>
<div id="drawer" class="drawer"><div class="panel"><div class="panel-head"><div><b id="editorTitle">الوصف الوظيفي</b><div id="editorMeta" class="meta"></div></div><button id="closeBtn" class="btn secondary">إغلاق</button></div><div id="editor" class="editor"></div></div></div><div id="toast" class="toast"></div>
<script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/permissions.js"></script>
<script type="module">
const sb=await window.atwarGetSupabase(),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={DRAFT:'مسودة',IN_REVIEW:'قيد مراجعة المدير',CHANGES_REQUESTED:'معادة للتعديل',MANAGER_APPROVED:'موافق عليها',PUBLISHED:'منشورة',ARCHIVED:'مؤرشفة'};
let me=null,jobs=[],profiles=[],current=null;const grid=document.getElementById('grid'),state=document.getElementById('state'),drawer=document.getElementById('drawer');
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}const{data,error}=await sb.from('profiles').select('id,full_name,email,role,job_title,department,manager_id,active,status').eq('id',session.user.id).single();if(error||!data||data.active===false||data.status!=='active'){location.href='../login.html';return}me=data;if(!['manager','admin'].includes(me.role)){location.href='../profile/job-description.html';return}window.atwarSyncShellIdentity?.(me,session.user);if(me.role==='admin'){const cfg=window.ATWAR_SUPABASE_CONFIG,r=await fetch(cfg.url+'/functions/v1/admin-create-user',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':cfg.publishableKey},body:JSON.stringify({action:'list'})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'تعذر تحميل المديرين');profiles=(j.users||[]).filter(x=>x.active!==false&&x.status!=='inactive'&&['manager','admin'].includes(x.role)).sort((a,b)=>String(a.full_name||'').localeCompare(String(b.full_name||''),'ar'))}document.body.style.visibility='visible';await load()}
async function load(){state.style.display='block';grid.innerHTML='';const{data,error}=await sb.from('job_descriptions').select('*').order('job_code');if(error){state.textContent='تعذر تحميل المكتبة: '+error.message;return}jobs=data||[];state.style.display=jobs.length?'none':'block';state.textContent='لا توجد أوصاف مرفوعة بعد.';render()}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('statusFilter').value;const rows=jobs.filter(j=>(!f||j.status===f)&&(!q||`${j.title} ${j.job_code} ${j.family}`.toLowerCase().includes(q)));const counts=Object.fromEntries(['DRAFT','IN_REVIEW','CHANGES_REQUESTED','MANAGER_APPROVED','PUBLISHED'].map(x=>[x,jobs.filter(j=>j.status===x).length]));document.getElementById('stats').innerHTML=[['الإجمالي',jobs.length,''],['المسودات',counts.DRAFT,'DRAFT'],['قيد المراجعة',counts.IN_REVIEW,'IN_REVIEW'],['تحتاج تعديل',counts.CHANGES_REQUESTED,'CHANGES_REQUESTED'],['منشورة',counts.PUBLISHED,'PUBLISHED']].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');grid.innerHTML=rows.map(j=>`<article class="card" data-id="${j.id}"><div class="card-top"><span class="code">${esc(j.job_code)}</span><span class="badge ${j.status}">${labels[j.status]||j.status}</span></div><h3>${esc(j.title)}</h3><div class="meta">${esc(j.family||'')} • ${esc(j.job_level||'')}<br>يرفع إلى: ${esc(j.reports_to_title||'غير محدد')}<br>الإصدار ${j.revision}</div></article>`).join('');grid.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>openJob(c.dataset.id));window.lucide?.createIcons()}
const lines=v=>(Array.isArray(v)?v:[]).map(x=>typeof x==='string'?x:(x.text||x.name||JSON.stringify(x))).join('\n');
function parseLines(v){return v.split('\n').map(x=>x.trim()).filter(Boolean)}
function openJob(id){current=jobs.find(j=>j.id===id);const c=current.content||{},editable=me.role==='admin'||(['IN_REVIEW','CHANGES_REQUESTED'].includes(current.status)&&current.reviewer_id===me.id);document.getElementById('editorTitle').textContent=current.title;document.getElementById('editorMeta').textContent=`${current.job_code} • الإصدار ${current.revision} • ${labels[current.status]}`;const reviewerOptions=profiles.map(p=>`<option value="${p.id}" ${p.id===current.reviewer_id?'selected':''}>${esc(p.full_name)} — ${esc(p.job_title||p.role)}</option>`).join('');document.getElementById('editor').innerHTML=`
<section class="section two"><label>المسمى<input id="fTitle" value="${esc(current.title)}" ${editable?'':'disabled'}></label><label>المدير المراجع<select id="fReviewer" ${me.role==='admin'?'':'disabled'}><option value="">غير محدد</option>${reviewerOptions}</select></label><label>العائلة<input id="fFamily" value="${esc(current.family||'')}" ${editable?'':'disabled'}></label><label>المستوى<input id="fLevel" value="${esc(current.job_level||'')}" ${editable?'':'disabled'}></label></section>
<section class="section"><h3>الغرض الوظيفي</h3><textarea id="fPurpose" ${editable?'':'disabled'}>${esc(current.purpose)}</textarea></section>
<section class="section"><h3>المسؤوليات</h3><textarea id="fResponsibilities" ${editable?'':'disabled'}>${esc(lines(c.responsibilities))}</textarea><div class="hint">مسؤولية واحدة في كل سطر.</div></section>
<section class="section"><h3>الصلاحيات</h3><textarea id="fAuthorities" ${editable?'':'disabled'}>${esc(lines(c.authorities))}</textarea><div class="hint">يمكن تعديل نص الصلاحية؛ تحفظ الحدود الأصلية للبنود غير المعدلة.</div></section>
<section class="section"><h3>مؤشرات الأداء</h3><textarea id="fKpis" ${editable?'':'disabled'}>${esc(lines(c.kpis))}</textarea></section>
<section class="section"><h3>التقارير</h3><textarea id="fReports" ${editable?'':'disabled'}>${esc(lines(c.reports))}</textarea></section>
<section class="section"><h3>ملاحظات المراجعة</h3><div id="comments" class="comments">جاري التحميل...</div><div class="actions" style="margin-top:9px"><input id="commentBody" style="flex:1" placeholder="أضف ملاحظة واضحة"><button id="commentBtn" class="btn secondary">إضافة ملاحظة</button></div></section>
<section class="section actions">${editable?'<button id="saveBtn" class="btn secondary">حفظ التعديلات</button>':''}${me.role==='admin'&&['DRAFT','CHANGES_REQUESTED'].includes(current.status)?'<button id="submitBtn" class="btn primary">إرسال للمدير</button>':''}${current.reviewer_id===me.id&&['IN_REVIEW','CHANGES_REQUESTED'].includes(current.status)?'<button id="approveBtn" class="btn primary">موافقة المدير</button><button id="returnBtn" class="btn danger">إعادة للتعديل</button>':''}${me.role==='admin'&&current.status==='MANAGER_APPROVED'?'<button id="publishBtn" class="btn primary">اعتماد ونشر</button>':''}</section>`;
drawer.classList.add('open');document.getElementById('saveBtn')?.addEventListener('click',()=>save());document.getElementById('submitBtn')?.addEventListener('click',()=>transition('IN_REVIEW'));document.getElementById('approveBtn')?.addEventListener('click',()=>transition('MANAGER_APPROVED'));document.getElementById('returnBtn')?.addEventListener('click',()=>transition('CHANGES_REQUESTED',true));document.getElementById('publishBtn')?.addEventListener('click',()=>transition('PUBLISHED'));document.getElementById('commentBtn').onclick=addComment;loadComments()}
function mergeObjects(original,newLines,key){const old=Array.isArray(original)?original:[];return newLines.map((text,i)=>typeof old[i]==='object'?{...old[i],[key]:text}:text)}
async function save(extra={}){const id=current?.id,button=document.getElementById('saveBtn');if(!id)return false;try{if(button){button.disabled=true;button.textContent='جارٍ الحفظ...'}const title=document.getElementById('fTitle').value.trim(),purpose=document.getElementById('fPurpose').value.trim();if(!title||!purpose)throw new Error('المسمى والغرض الوظيفي حقول إلزامية');const c=current.content||{},payload={title,family:document.getElementById('fFamily').value.trim(),job_level:document.getElementById('fLevel').value.trim(),purpose,reviewer_id:document.getElementById('fReviewer')?.value||current.reviewer_id||null,content:{...c,responsibilities:parseLines(document.getElementById('fResponsibilities').value),authorities:mergeObjects(c.authorities,parseLines(document.getElementById('fAuthorities').value),'text'),kpis:mergeObjects(c.kpis,parseLines(document.getElementById('fKpis').value),'name'),reports:mergeObjects(c.reports,parseLines(document.getElementById('fReports').value),'name')},...extra};const{data,error}=await sb.from('job_descriptions').update(payload).eq('id',id).select('id').maybeSingle();if(error)throw error;if(!data)throw new Error('لم يسمح النظام بحفظ هذا السجل؛ تحقق من صلاحية المراجع وحالة الوصف');toast('تم حفظ التحديث مع تسجيل الإصدار');await load();current=jobs.find(j=>j.id===id);if(current)openJob(id);return true}catch(e){console.error('Job library save:',e);toast('تعذر الحفظ: '+(e?.message||'خطأ غير معروف'));if(button){button.disabled=false;button.textContent='حفظ التعديلات'}return false}}
async function transition(status,noteRequired=false){try{if(status==='IN_REVIEW'&&!document.getElementById('fReviewer').value){toast('حدد المدير المراجع أولًا');return}let note=current.review_note||'';if(noteRequired){note=prompt('اكتب الملاحظات المطلوبة قبل إعادة الوصف للتعديل:','')||'';if(note.trim().length<2)return}const saved=await save({status,review_note:note,submitted_at:status==='IN_REVIEW'?new Date().toISOString():current.submitted_at});if(saved)toast(status==='PUBLISHED'?'تم نشر الوصف الوظيفي':'تم تحديث حالة المراجعة')}catch(e){console.error(e);toast(e.message||'تعذر تنفيذ الإجراء')}}
async function loadComments(){const{data,error}=await sb.from('job_description_comments').select('id,body,created_at,author_id').eq('job_description_id',current.id).order('created_at');const host=document.getElementById('comments');if(error){host.textContent='تعذر تحميل الملاحظات';return}const names=new Map(profiles.map(p=>[p.id,p.full_name]));names.set(me.id,me.full_name);host.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="comment"><b>${esc(names.get(x.author_id)||'مستخدم')}</b> — ${new Date(x.created_at).toLocaleString('ar-SA')}<br>${esc(x.body)}</div>`).join(''):'<div class="hint">لا توجد ملاحظات بعد.</div>'}
async function addComment(){const input=document.getElementById('commentBody'),body=input.value.trim();if(body.length<2)return;const{error}=await sb.from('job_description_comments').insert({job_description_id:current.id,author_id:me.id,body});if(error){toast(error.message);return}input.value='';await loadComments();toast('تمت إضافة الملاحظة')}
async function importLibrary(){if(me.role!=='admin'||!confirm('سيتم رفع 46 وصفًا كمسودات للمراجعة. هل تريد المتابعة؟'))return;try{const source=await fetch('data/atwar-job-library-v1.json').then(r=>{if(!r.ok)throw new Error('تعذر قراءة ملف المكتبة');return r.json()});const existing=new Map(jobs.map(j=>[j.job_code,j]));const managerFor=title=>{const t=String(title||'').split('/')[0].trim();return profiles.find(p=>p.job_title===t)||profiles.find(p=>t&&String(p.job_title||'').includes(t))};for(let i=0;i<source.jobs.length;i+=20){const batch=source.jobs.slice(i,i+20).map(j=>{const old=existing.get(j.job_code),mgr=managerFor(j.reports_to_title);return{...j,status:old?.published_at?'DRAFT':(mgr?'IN_REVIEW':'DRAFT'),reviewer_id:mgr?.id||old?.reviewer_id||null,created_by:me.id,updated_by:me.id,submitted_at:mgr?new Date().toISOString():null}});const{error}=await sb.from('job_descriptions').upsert(batch,{onConflict:'job_code'});if(error)throw error}toast('تم رفع المكتبة وتوجيه الوظائف المطابقة للمديرين');await load()}catch(e){console.error(e);toast(e.message||'تعذر رفع المكتبة')}}
document.getElementById('importBtn').onclick=importLibrary;document.getElementById('closeBtn').onclick=()=>drawer.classList.remove('open');drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.classList.remove('open')});document.getElementById('search').oninput=render;document.getElementById('statusFilter').onchange=render;boot().catch(e=>{console.error(e);state.textContent='تعذر تشغيل المكتبة: '+e.message;document.body.style.visibility='visible'});
</script></body></html>
