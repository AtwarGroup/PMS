<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATWAR ONE – مراجعة الوصف الوظيفي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.47.0"></script>
  <script src="../assets/js/shell-components.js?v=2.5.36"></script><script src="../assets/js/ui-feedback.js?v=2.5.27"></script><script src="../assets/js/session-service.js?v=2.5.2"></script>
  <link rel="stylesheet" href="../assets/css/shared.css?v=2.5.26">
  <link rel="stylesheet" href="../assets/css/job-review.css">
  <style>.scorecard-reference{border-right:4px solid #1769e0}.scorecard-reference p{line-height:1.8;color:#485d75}.scorecard-reference .reference-note{margin:12px 0 0;color:#9a640e}.manager-alert.approved{background:#eaf9f2;border-color:#bce8d3;color:#087f5b}</style>
<link rel="stylesheet" href="../assets/css/job-document.css?v=2.5.14">
<script src="../assets/js/job-kpi-proposals.js?v=2.5.21"></script>
<script src="../assets/js/job-document-view.js?v=2.5.21"></script>
<link rel="stylesheet" href="../assets/css/app-theme.css?v=2.5.36" data-atwar-app-theme="1">
</head>
<body style="visibility:hidden">
  <div class="atwar-shell">
    <atwar-sidebar active="jobLibrary"></atwar-sidebar>
    <section class="atwar-main">
      <atwar-header></atwar-header>
      <main class="atwar-content review-page">
        <a class="back-link" href="index.html"><i data-lucide="arrow-right"></i> العودة إلى مكتبة الوظائف</a>
        <section id="reviewState" class="loading-card">جاري تحميل الوصف الوظيفي...</section>
        <div id="reviewApp" hidden>
          <header class="role-header">
            <div class="role-title">
              <div class="role-kicker"><span id="jobCode"></span><span id="jobStatus" class="status-pill"></span></div>
              <h1 id="jobTitle"></h1>
              <p id="jobPurpose"></p>
            </div>
            <div id="headerActions" class="header-actions"></div>
          </header>

          <section id="managerAlert" class="manager-alert"></section>

          <div class="review-layout">
            <aside class="review-summary">
              <section class="summary-card">
                <h2>بطاقة الوظيفة</h2>
                <dl>
                  <div><dt>العائلة الوظيفية</dt><dd id="jobFamily"></dd></div>
                  <div><dt>المستوى</dt><dd id="jobLevel"></dd></div>
                  <div><dt>الإصدار</dt><dd id="jobRevision"></dd></div>
                  <div><dt>المدير المراجع</dt><dd id="jobReviewer"></dd></div>
                </dl>
              </section>
              <section class="summary-card progress-card">
                <h2>اكتمال المحتوى</h2>
                <div id="qualityScore" class="quality-score"></div>
                <div id="qualityChecks" class="quality-checks"></div>
              </section>
              <section class="summary-card">
                <h2>مسار الاعتماد</h2>
                <ol class="approval-path">
                  <li>مسودة مسؤول النظام</li>
                  <li>مراجعة المدير المباشر</li>
                  <li>قرار مسؤول النظام</li>
                  <li>نشر نسخة الموظف</li>
                </ol>
              </section>
            </aside>

            <section class="review-content">
              <nav id="reviewTabs" class="review-tabs" aria-label="أقسام الوصف">
                <button data-tab="overview" class="active"><i data-lucide="file-badge"></i><span>الوصف الوظيفي</span></button>
                <button data-tab="responsibilities"><i data-lucide="list-checks"></i><span>المهام والمسؤوليات</span></button>
                <button data-tab="authorities"><i data-lucide="shield-check"></i><span>حدود الصلاحيات<small>مصفوفة الصلاحيات</small></span></button>
                <button data-tab="measurement"><i data-lucide="chart-no-axes-combined"></i><span>بطاقة قياس مؤشرات الأداء KPI’s</span></button>
                <button data-tab="review">المقترحات والملاحظات <span id="proposalCount">0</span></button>
              </nav>
              <div id="reviewBody"></div>
            </section>
          </div>
        </div>
      </main>
    </section>
  </div>
  <div id="toast" class="review-toast"></div>
  <script src="../assets/js/roles-config.js"></script>
  <script src="../assets/js/start-page-config.js"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/supabase-runtime.js"></script>
  <script src="../assets/js/permissions.js"></script>
  <script type="module" src="../assets/js/job-review-page.js?v=2.5.38"></script>
</body>
</html>
