                  views: [{ rightToLeft: true }]
              });

              const columns = [{ header: '#', key: 'id', width: 8 }];
              report.fields.forEach((field, index) => {
                  columns.push({ header: field, key: `col_${index}`, width: 28 });
              });
              worksheet.columns = columns;

              const headerRow = worksheet.getRow(1);
              headerRow.height = 35;
              headerRow.eachCell((cell) => {
                  cell.fill = {
                      type: 'pattern',
                      pattern: 'solid',
                      fgColor: { argb: 'FFE0F2FE' }
                  };
                  cell.font = {
                      name: 'Arial',
                      size: 11,
                      bold: true,
                      color: { argb: 'FF0369A1' }
                  };
                  cell.alignment = { vertical: 'middle', horizontal: 'center' };
                  cell.border = {
                      top: { style: 'thin', color: { argb: 'FFBAE6FD' } },
                      left: { style: 'thin', color: { argb: 'FFBAE6FD' } },
                      bottom: { style: 'thin', color: { argb: 'FFBAE6FD' } },
                      right: { style: 'thin', color: { argb: 'FFBAE6FD' } }
                  };
              });

              [1, 2, 3, 4, 5].forEach(num => {
                  const rowData = { id: num };
                  report.fields.forEach((_, index) => {
                      rowData[`col_${index}`] = '-';
                  });
                  const row = worksheet.addRow(rowData);
                  row.height = 28;
                  
                  row.eachCell((cell, colNumber) => {
                      cell.alignment = { vertical: 'middle', horizontal: 'center' };
                      if (colNumber === 1) {
                        cell.font = { bold: true, color: { argb: 'FF64748B' }};
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' }};

                          top: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                          left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                          bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } },
                          right: { style: 'thin', color: { argb: 'FFE2E8F0' } }

                          </div>
                       </div>
                    </div>

                    <div className="bg-white rounded-[3rem] shadow-lg border border-slate-200 overflow-hidden">
                       <div className="overflow-x-auto">
                          <table className="w-full text-right text-xs">
                             <thead>
                                <tr className="bg-slate-100 text-slate-700 font-black border-b border-slate-200">
                                   <th className="p-4 text-center">#</th>
                                   <th className="p-4 w-1/5">المستهدف (KPI)</th>
                                   <th className="p-4">وحدة التقييم</th>
                                   <th className="p-4 w-1/4">الهدف والتطوير الإجرائي</th>
                                   <th className="p-4 text-center">سلم التقييم (1 - 5)</th>
                                   <th className="p-4 text-center">الوزن %</th>
                                   <th className="p-4 text-center">المستهدف</th>
                                   <th className="p-4">المصدر</th>
                                </tr>
                             </thead>
                             <tbody className="divide-y divide-slate-100 font-bold">
                                {scorecardKPIs.map((kpi) => (
                                   <tr key={kpi.id} className="hover:bg-sky-50/20 transition-colors">
                                      <td className="p-4 text-center font-black text-slate-400 bg-slate-50">{kpi.id}</td>
                                      <td className="p-4 text-slate-900 font-black text-sm">{kpi.title}</td>
                                      <td className="p-4 text-slate-500">{kpi.unit}</td>
                                      <td className="p-4 text-slate-600 leading-relaxed">{kpi.plan}</td>
                                      <td className="p-4">
                                         <div className="grid grid-cols-5 gap-1 text-[9px] text-center">
                                            {kpi.scale.map((lvl, idx) => (
                                               <div key={idx} className={`p-1.5 rounded font-black ${idx === 2 ? 'bg-sky-100 text-sky-800 border border-sky-300' : 'bg-slate-100 text-slate-600'}`}>
                                                  <span className="block text-[8px] opacity-75">{idx+1}</span>
                                                  {lvl}
                                               </div>
                                            ))}
                                         </div>
                                      </td>
                                      <td className="p-4 text-center font-black text-sky-600 text-sm">{kpi.weight}</td>
                                      <td className="p-4 text-center font-black text-emerald-600">{kpi.targetVal}</td>
                                      <td className="p-4 text-slate-500 text-[11px]">{kpi.source}</td>
                                   </tr>
                                ))}
                             </tbody>
                          </table>
                       </div>
                    </div>
                  </div>
                )}

                {/* Tab 3: Reports Directory & Excel Export */}
                {activeTab === 'reports' && (
                  <div className="animate-in fade-in duration-500">
                    <div className="grid grid-cols-1 xl:grid-cols-4 gap-8">
                      <div className="xl:col-span-1">
                        <div className="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-xl sticky top-28 border border-slate-800">
                           <h3 className="flex items-center gap-3 text-lg font-black mb-6 border-b border-white/10 pb-4 text-sky-400">
                              <Icon name="filter" className="w-5 h-5" />
                              دليل النماذج
                           </h3>
                           {['daily', 'weekly', 'monthly', 'yearly'].map((freq) => (
                              <div key={freq} className="mb-6 last:mb-0">
                                 <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">
                                    {freq === 'daily' ? 'التقارير الجارية' : freq === 'weekly' ? 'التقارير الأسبوعية' : freq === 'monthly' ? 'التقارير الشهرية' : 'التقارير السنوية'}
                                 </p>
                                 <div className="space-y-1.5 pr-3 border-r border-slate-800">
                                    {reportModels[freq].map((rep) => (
                                       <button 
                                        key={rep.name}
                                        onClick={() => setSelectedReport(rep)}
                                        className={`w-full text-right px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-between ${selectedReport?.name === rep.name ? 'bg-sky-600 text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                       >
                                          <span className="truncate">{rep.name}</span>
                                          <Icon name="chevron-left" className="w-3.5 h-3.5 flex-shrink-0" />
                                       </button>
                                    ))}
                                 </div>
                              </div>
                           ))}
                        </div>
                      </div>

                      <div className="xl:col-span-3" ref={reportViewRef}>
                        {selectedReport ? (
                          <div className="bg-white rounded-[3rem] border border-slate-200 shadow-xl p-8 md:p-12 animate-in zoom-in-95 duration-300">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 pb-6 border-b border-slate-100 gap-6">
                               <div>
                                  <span className="text-[10px] font-black text-sky-600 uppercase tracking-widest">Standard Schema Mode</span>
                                  <h3 className="text-2xl md:text-3xl font-black text-slate-900 mt-1">{selectedReport.name}</h3>
                               </div>
                               
                               <button 
                                  onClick={() => handleExportToExcel(selectedReport)}
                                  disabled={isExporting}
                                  className={`bg-emerald-50 text-emerald-800 px-6 py-3.5 rounded-2xl flex items-center gap-3 border border-emerald-200 shadow-sm transition-all group ${isExporting ? 'opacity-70 cursor-wait' : 'hover:bg-emerald-100 hover:shadow-md'}`}
                               >
                                  <Icon name={isExporting ? "loader-2" : "download"} className={`w-5 h-5 text-emerald-600 ${isExporting ? 'animate-spin' : ''}`} />
                                  <span className="text-sm font-black">{isExporting ? 'جاري إنشاء Excel...' : 'تصدير نموذج Excel'}</span>
                               </button>
                            </div>

                            <div className="overflow-x-auto border border-slate-200 rounded-2xl shadow-inner bg-slate-50/50 p-4">
                               <table className="w-full text-right text-xs font-mono">
                                  <thead>
                                     <tr className="bg-sky-100/70 text-sky-900 font-black border-b border-sky-200">
                                        <th className="p-3 text-center w-12 border-l border-sky-200">#</th>
                                        {selectedReport.fields.map((field, idx) => (
                                           <th key={idx} className="p-3 border-l border-sky-200 whitespace-nowrap">{field}</th>
                                        ))}
                                     </tr>
                                  </thead>
                                  <tbody>
                                     {[1, 2, 3].map((row) => (
                                        <tr key={row} className="border-b border-slate-200 bg-white">
                                           <td className="p-3 text-center text-slate-400 font-bold bg-slate-100/50 border-l border-slate-200">{row}</td>
                                           {selectedReport.fields.map((_, idx) => (
                                              <td key={idx} className="p-3 border-l border-slate-200 text-slate-300 text-center">-</td>
                                           ))}
                                        </tr>
                                     ))}
                                  </tbody>
                               </table>
                            </div>
                          </div>
                        ) : (
                          <div className="bg-white rounded-[3rem] border-2 border-dashed border-slate-300 h-[450px] flex flex-col items-center justify-center text-slate-400 gap-4">
                             <Icon name="file-search" className="w-16 h-16 text-sky-300" />
                             <p className="text-xl font-black text-slate-600">اختر تقريراً من القائمة للفتحه وتصديره</p>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {/* Tab 4: Authorities & Qualifications */}
                {activeTab === 'authorities' && (
                  <div className="animate-in fade-in duration-500 grid grid-cols-1 lg:grid-cols-12 gap-8">
                     <div className="lg:col-span-7 bg-white p-8 rounded-[3rem] shadow-lg border border-slate-200">
                        <h3 className="text-xl font-black text-slate-900 mb-6 flex items-center gap-3">
                           <Icon name="shield-check" className="w-6 h-6 text-sky-600" />
                           مصفوفة الصلاحيات المعتمدة
                        </h3>
                        <div className="space-y-3">
                           {authorities.map((auth, idx) => (
                              <div key={idx} className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100 hover:bg-sky-50/30 transition-colors">
                                 <span className="text-sm font-bold text-slate-800">{auth.item}</span>
                                 <span className="text-xs font-black bg-sky-100 text-sky-800 px-3 py-1.5 rounded-xl">{auth.level}</span>
                              </div>
                           ))}
                        </div>
                     </div>

                     <div className="lg:col-span-5 bg-slate-900 text-white p-8 rounded-[3rem] shadow-xl flex flex-col justify-between">
                        <div>
                           <h3 className="text-xl font-black text-sky-400 mb-6 flex items-center gap-3 border-b border-white/10 pb-4">
                              <Icon name="user-check" className="w-6 h-6 text-sky-400" />
                              مواصفات شاغل الوظيفة
                           </h3>
                           <div className="space-y-6 text-sm font-bold">
                              <div>
                                 <span className="text-slate-400 text-xs block mb-1">المؤهل العلمي</span>
                                 <p className="text-white">بكالوريوس في سلاسل الإمداد / إدارة الأعمال / الهندسة / المحاسبة</p>
                              </div>
                              <div>
                                 <span className="text-slate-400 text-xs block mb-1">الخبرة العملية</span>
                                 <p className="text-white">خبرة لا تقل عن 6 سنوات في إدارة المشتريات والمخزون</p>
                              </div>
                              <div>
                                 <span className="text-slate-400 text-xs block mb-1">المهارات والتدريب</span>
                                 <ul className="grid grid-cols-2 gap-2 text-xs text-slate-300 mt-2">
                                    <li className="flex items-center gap-2"><Icon name="check" className="w-3.5 h-3.5 text-sky-400" /> القيادة والإشراف</li>
                                    <li className="flex items-center gap-2"><Icon name="check" className="w-3.5 h-3.5 text-sky-400" /> التخطيط والتنبؤ</li>
                                    <li className="flex items-center gap-2"><Icon name="check" className="w-3.5 h-3.5 text-sky-400" /> مهارات التفاوض</li>
                                    <li className="flex items-center gap-2"><Icon name="check" className="w-3.5 h-3.5 text-sky-400" /> إدارة أنظمة ERP</li>
                                    <li className="flex items-center gap-2"><Icon name="check" className="w-3.5 h-3.5 text-sky-400" /> تحليل المخاطر</li>
                                    <li className="flex items-center gap-2"><Icon name="check" className="w-3.5 h-3.5 text-sky-400" /> إدارة الموردين</li>
                                 </ul>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div>
                )}

                {/* Tab 5: Strategic Proposals */}
                {activeTab === 'proposals' && (
                  <div className="animate-in fade-in duration-500">
                    <div className="mb-8">
                       <h3 className="text-2xl font-black text-slate-900">المقترحات والتطويرات الاستراتيجية الموصى بها</h3>
                       <p className="text-slate-500 font-bold text-sm">مبادرات قيمة مضافة لرفع كفاءة إدارة المشتريات والمخزون بالمؤسسة</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                       {proposals.map((prop, idx) => (
                          <div key={idx} className="bg-white p-8 rounded-[3rem] shadow-lg border border-slate-200 hover:border-sky-300 transition-all group">
                             <div className="w-12 h-12 bg-sky-50 text-sky-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-sky-600 group-hover:text-white transition-colors">
                                <Icon name={prop.icon} className="w-6 h-6" />
                             </div>
                             <h4 className="text-lg font-black text-slate-900 mb-3">{prop.title}</h4>
                             <p className="text-slate-600 font-bold text-sm leading-relaxed">{prop.desc}</p>
                          </div>
                       ))}
                    </div>
                  </div>
                )}

              </main>

              <footer className="py-12 text-center border-t border-slate-200 mt-12 bg-white print:hidden">
                 <p className="text-slate-500 font-bold text-sm">نظام إدارة الأداء - إدارة تطوير الأعمال</p>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
