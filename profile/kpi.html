<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مؤشرات الأداء</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.kpi-card{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:20px;box-shadow:0 5px 14px rgba(20,45,80,.045)}.bar{height:8px;background:#edf2f7;border-radius:999px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#1677ff}</style></head><body>
<div class="atwar-shell">
  <atwar-sidebar active="profile"></atwar-sidebar>
  <section class="atwar-main">
    <atwar-header></atwar-header>
<main class="atwar-content">
<section id="profileDataHost" style="min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:min(680px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 10px 30px rgba(20,45,80,.05)">
    <div style="font-size:22px;font-weight:900">مؤشرات الأداء</div>
    <p style="margin:10px auto 0;font-size:11px;color:#7b8aa5">جاري التحقق من البيانات المعتمدة...</p>
  </div>
</section>
</main>
  </section>
</div>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/permissions.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const s=document.querySelector('[data-global-search]');
 if(s) s.addEventListener('keydown',e=>{
   if(e.key==='Enter' && s.value.trim()) location.href='../search/index.html?q='+encodeURIComponent(s.value.trim());
 });
});
</script>
<script src="../assets/js/consolidation.js"></script>

<div class="atwar-copyright">جميع الحقوق محفوظة © ATWAR ONE 2026 - إدارة تطوير الأعمال</div>




<script type="module" id="realProfileDataBinding">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=getApps().length?getApps()[0]:initializeApp(window.ATWAR_FIREBASE_CONFIG),auth=getAuth(app),db=getDatabase(app);
const host=document.getElementById('profileDataHost');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function empty(){
 host.innerHTML=`<div style="width:min(560px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:34px 28px;text-align:center"><div style="font-size:22px;font-weight:900">الصفحة تحت الإنشاء</div><p style="font-size:11px;line-height:1.9;color:#7b8aa5">لم تتم إضافة بيانات مؤشرات الأداء المعتمدة لهذا المستخدم حتى الآن.</p></div>`;
}
onAuthStateChanged(auth,async user=>{
 if(!user){location.href='../login.html';return}
 try{
   const snap=await get(ref(db,`users/${user.uid}`));if(!snap.exists()){empty();return}
   const record=snap.val(),data=record.kpis || record.kpi || null;
   if(!data || (typeof data==='string'&&!data.trim()) || (typeof data==='object'&&!Object.keys(data).length)){empty();return}
   const rows=Array.isArray(data)?data:Object.entries(data).map(([name,value])=>({name,value}));
   host.innerHTML=`<div style="width:min(900px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:28px"><h1 style="margin-top:0">مؤشرات الأداء</h1><div style="display:grid;gap:10px">${rows.map(x=>`<div style="border:1px solid #e7edf5;border-radius:12px;padding:12px"><b>${esc(x.name||x.title||x.kpi||'مؤشر')}</b><div style="color:#607087;margin-top:5px">${esc(x.value??x.score??x.target??'—')}</div></div>`).join('')}</div></div>`;
 }catch(e){console.error(e);empty()}
});
</script>
</body>
</html>
