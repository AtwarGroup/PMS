<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – ملفي الوظيفي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.card{background:#fff;border:1px solid #e5edf6;border-radius:20px;padding:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{background:#f8fafc;border:1px solid #e7edf5;border-radius:12px;padding:12px}.box span{display:block;font-size:9px;color:#7a899d}.box b{display:block;margin-top:4px}.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.profile-actions a{background:#0b1d3a;color:#fff;text-decoration:none;border-radius:10px;padding:9px 12px;font-size:10px;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="atwar-shell"><atwar-sidebar active="profile"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><h1>ملفي الوظيفي</h1><section class="card"><div id="profileData">جاري التحميل...</div></section><footer class="atwar-footer"><span>ATWAR ONE • Profile</span><span>Production 1.6</span><span>profiles</span></footer></main></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function run(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}const{data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error){console.error(error);document.getElementById('profileData').textContent='تعذر تحميل الملف الوظيفي.';return}window.atwarSyncShellIdentity?.(p,session.user);let manager='-';if(p.manager_id){const{data:m}=await sb.from('profiles').select('full_name').eq('id',p.manager_id).single();if(m)manager=m.full_name}const title=String(p.job_title||'');let specialized='';if(title.includes('المدير المالي'))specialized='<a href="../Financial_Manager.html">بطاقة المدير المالي والتقارير</a>';else if(title.includes('رئيس الحسابات'))specialized='<a href="../Chief_Accountant.html">بطاقة رئيس الحسابات والتقارير</a>';else if(title.includes('المشتريات')||title.includes('المخزون'))specialized='<a href="../Purchasing_Inventory_Supv.html">بطاقة المشتريات والمخزون</a>';document.getElementById('profileData').innerHTML=`<div class="grid"><div class="box"><span>الاسم</span><b>${esc(p.full_name)}</b></div><div class="box"><span>البريد</span><b>${esc(p.email||session.user.email)}</b></div><div class="box"><span>الدور</span><b>${esc(p.role)}</b></div><div class="box"><span>المسمى الوظيفي</span><b>${esc(p.job_title||'-')}</b></div><div class="box"><span>الإدارة / القسم</span><b>${esc(p.department||'-')}</b></div><div class="box"><span>المدير المباشر</span><b>${esc(manager)}</b></div><div class="box"><span>الحالة</span><b>${p.active&&p.status==='active'?'نشط':'غير نشط'}</b></div></div>${specialized?`<div class="profile-actions">${specialized}</div>`:''}`}run().catch(console.error);</script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script></body></html>
