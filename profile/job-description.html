<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الوصف الوظيفي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.box{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 5px 14px rgba(20,45,80,.045)}.box h3{margin-top:0}.duty{padding:14px;border-right:4px solid #1677ff;background:#f8fbff;border-radius:12px;margin:10px 0;line-height:1.8}</style></head><body>
<div class="atwar-shell">
  <atwar-sidebar active="profile"></atwar-sidebar>
  <section class="atwar-main">
    <atwar-header></atwar-header>
<main class="atwar-content">
<section id="profileDataHost" style="min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:min(680px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 10px 30px rgba(20,45,80,.05)">
    <div style="font-size:22px;font-weight:900">الوصف الوظيفي</div>
    <p style="margin:10px auto 0;font-size:11px;color:#7b8aa5">جاري التحقق من البيانات المعتمدة...</p>
  </div>
</section>
</main>
  </section>
</div>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/supabase-runtime.js"></script>
<script src="../assets/js/permissions.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const s=document.querySelector('[data-global-search]');
 if(s) s.addEventListener('keydown',e=>{
   if(e.key==='Enter' && s.value.trim()) location.href='../search/index.html?q='+encodeURIComponent(s.value.trim());
 });
});
</script>
<div class="atwar-copyright">جميع الحقوق محفوظة © ATWAR ONE 2026 - إدارة تطوير الأعمال</div>




<script type="module" id="realProfileDataBinding">
const sb=await window.atwarGetSupabase();
async function authProfile(loginPath){
  const {data:{session},error:se}=await sb.auth.getSession();
  if(se||!session?.user){location.href=loginPath;return null;}
  const {data:profile,error:pe}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(pe||!profile||profile.active===false||profile.status==='inactive'||!['employee','manager','admin'].includes(profile.role)){
    await sb.auth.signOut().catch(()=>{});location.href=loginPath;return null;
  }
  window.atwarSyncShellIdentity?.(profile,session.user);
  return {session,user:session.user,profile};
}

const host=document.getElementById('profileDataHost'),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function empty(){host.innerHTML='<div style="width:min(560px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:34px 28px;text-align:center"><div style="font-size:22px;font-weight:900">لا توجد بيانات معتمدة</div><p style="font-size:11px;line-height:1.9;color:#7b8aa5">لم يُنشر وصف وظيفي لهذا الحساب حتى الآن. تبقى المسودات وملاحظات المراجعة غير ظاهرة للموظف.</p></div>'}
const list=(title,rows,show)=>rows?.length?`<section class="box"><h3>${title}</h3>${rows.map((x,i)=>`<div class="duty"><b>${i+1}.</b> ${esc(show(x))}</div>`).join('')}</section>`:'';
const a=await authProfile('../login.html');if(a){let row=null;const select='id,job_code,title,family,job_level,reports_to_title,published_at,published_snapshot';if(a.profile.job_description_id){const q=await sb.from('job_descriptions').select(select).eq('id',a.profile.job_description_id).maybeSingle();row=q.data}if(!row&&a.profile.job_title){const q=await sb.from('job_descriptions').select(select).eq('title',a.profile.job_title).not('published_at','is',null).maybeSingle();row=q.data}if(row?.published_snapshot){const d=row.published_snapshot,c=d.content||{},q=c.qualifications||{};host.style.display='block';host.innerHTML=`<div style="width:min(900px,100%);margin:auto"><section class="box"><div style="font-size:10px;color:#7b8aa5">${esc(d.job_code||row.job_code)} • النسخة المنشورة ${esc(d.revision||'')}</div><h1 style="margin:5px 0">${esc(d.title||row.title)}</h1><div style="font-size:11px;color:#718096">${esc(d.family||'')} • ${esc(d.job_level||'')} • يرفع إلى: ${esc(d.reports_to_title||'غير محدد')}</div></section><section class="box"><h3>الغرض الوظيفي</h3><div style="line-height:2;color:#40536d">${esc(d.purpose||'')}</div></section>${list('المسؤوليات',c.responsibilities,x=>x)}${list('الصلاحيات وحدودها',c.authorities,x=>typeof x==='string'?x:`${x.text}${x.limit?' — الحد: '+x.limit:''}`)}${list('مؤشرات الأداء',c.kpis,x=>typeof x==='string'?x:`${x.name}${x.target?' — المستهدف: '+x.target:''}`)}${list('التقارير',c.reports,x=>typeof x==='string'?x:`${x.name}${x.frequency?' — '+x.frequency:''}`)}${q.education?`<section class="box"><h3>المؤهلات</h3><div style="line-height:2;color:#40536d"><b>المؤهل:</b> ${esc(q.education)}<br><b>الخبرة:</b> ${esc(q.experience||'')}<br><b>اللغات:</b> ${esc(q.languages||'')}<br><b>المهارات:</b> ${esc(q.skills||'')}</div></section>`:''}</div>`}else{const legacy=a.profile.job_description||a.profile.jobDescription||'';if(!legacy)empty();else host.innerHTML=`<div style="width:min(800px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:28px"><h1 style="margin-top:0">الوصف الوظيفي</h1><div style="line-height:2;color:#40536d;white-space:pre-wrap">${esc(typeof legacy==='string'?legacy:JSON.stringify(legacy,null,2))}</div></div>`}}
</script>
</body>
</html>
