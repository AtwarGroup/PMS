<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الوصف الوظيفي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/supabase-runtime.js"></script>
<script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.box{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 5px 14px rgba(20,45,80,.045)}.box h3{margin-top:0}.duty{padding:14px;border-right:4px solid #1677ff;background:#f8fbff;border-radius:12px;margin:10px 0;line-height:1.8}</style></head><body>
<div class="atwar-shell">
  <atwar-sidebar active="profile"></atwar-sidebar>
  <section class="atwar-main">
    <atwar-header></atwar-header>
<main class="atwar-content">
<section id="profileDataHost" style="min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:min(680px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 10px 30px rgba(20,45,80,.05)">
    <div style="font-size:22px;font-weight:900">الوصف الوظيفي</div>

</section>
</main>
  </section>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
 const s=document.querySelector('[data-global-search]');
 if(s) s.addEventListener('keydown',e=>{
   if(e.key==='Enter' && s.value.trim()) location.href='../search/index.html?q='+encodeURIComponent(s.value.trim());
 });
});
</script>
<div class="atwar-copyright">جميع الحقوق محفوظة © ATWAR ONE 2026 - إدارة تطوير الأعمال</div>




<script type="module" id="realProfileDataBinding">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;
const host=document.getElementById('profileDataHost');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function empty(){host.innerHTML=`<div style="width:min(560px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:34px 28px;text-align:center"><div style="font-size:22px;font-weight:900">لا توجد بيانات معتمدة</div><p style="font-size:11px;line-height:1.9;color:#7b8aa5">لم تتم إضافة بيانات الوصف الوظيفي المعتمدة لهذا الحساب حتى الآن.</p></div>`}
const {data:{session}}=await sb.auth.getSession();if(!session?.user)location.href='../login.html';else{const{data:record,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error||!record)empty();else{window.atwarSyncShellIdentity?.(record,session.user);const data=record.job_description || record.jobDescription || '';if(!data||(typeof data==='string'&&!data.trim())||(typeof data==='object'&&!Object.keys(data).length))empty();else host.innerHTML=`<div style="width:min(800px,100%);background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:28px"><h1 style="margin-top:0">الوصف الوظيفي</h1><div style="line-height:2;color:#40536d;white-space:pre-wrap">${esc(typeof data==='string'?data:JSON.stringify(data,null,2))}</div></div>`}}
</script>
</body>
</html>
