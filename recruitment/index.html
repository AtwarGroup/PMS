  <body>
    <div class="atwar-shell">
      <atwar-sidebar active="recruitment"></atwar-sidebar>
      <section class="atwar-main">
        <atwar-header></atwar-header>
        <main class="atwar-content recruitment-page">
          <header class="atwar-page-head">
            <div>
              <p class="recruitment-eyebrow">
                الموارد البشرية · الاستقطاب والتعيين
              </p>
              <h1>التوظيف</h1>
              <p>من الاحتياج الوظيفي إلى أول يوم عمل.</p>
            </div>
            <div class="rec-actions"><a class="atwar-btn secondary" href="user-guide.html">دليل الاستخدام</a><button id="createRequest" class="rec-btn" hidden>
              طلب احتياج وظيفي
            </button></div>
          </header>
          <p id="pageStatus" role="status" aria-live="polite">
            جارٍ التحقق من الصلاحيات…
          </p>
          <div class="rec-navigation">
            <nav class="rec-tabs atwar-tabs" aria-label="أقسام التوظيف">
              <button data-view="dashboard" aria-current="page">المتابعة</button>
              <button data-view="requests">طلبات التوظيف</button>
            </nav>
            <div class="rec-tools" aria-label="أدوات التوظيف">
              <button class="rec-btn secondary" data-tool="candidates" hidden>قاعدة المرشحين</button>
              <button class="rec-btn secondary" data-tool="reports">التقارير والطباعة</button>
              <button class="rec-btn secondary" data-tool="settings" hidden>إعدادات المسار</button>
              <button class="rec-btn secondary" data-tool="calendar" hidden>تقويم العمل</button>
            </div>
          </div>
          <section id="viewContent" aria-live="polite"></section>
          <dialog id="recDialog" aria-labelledby="dialogTitle">
            <header>
              <div>
                <p class="recruitment-eyebrow">ATWAR ONE · التوظيف</p>
                <h2 id="dialogTitle"></h2>
              </div>
              <button id="closeDialog" class="rec-btn secondary" type="button">
                إغلاق
              </button>
            </header>
            <div id="dialogBody"></div>
            <p id="dialogStatus" role="status" aria-live="polite"></p>
          </dialog>
