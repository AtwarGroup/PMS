<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – ملف الموظف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.employee-hero{
  background:linear-gradient(135deg,#0b1d3a,#143e6f);
  color:#fff;border-radius:28px;padding:28px;
  box-shadow:0 16px 35px rgba(13,35,69,.13)
}
.emp-top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.emp-id{display:flex;align-items:center;gap:16px}
.emp-avatar{width:72px;height:72px;border-radius:22px;background:#fff;color:#0b1d3a;display:grid;place-items:center;font-size:25px;font-weight:900}
.emp-name{font-size:28px;font-weight:900;margin:0}
.emp-meta{color:#cdd9e8;font-size:12px;margin-top:6px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-width:360px}
.hero-stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:13px;text-align:center}
.hero-stat b{display:block;font-size:26px}
.hero-stat span{font-size:10px;color:#d9e3ee}
.emp-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.emp-tabs button{border:1px solid #e2e8f0;background:#fff;padding:10px 16px;border-radius:12px;font-family:inherit;font-weight:900;color:#475569;cursor:pointer}
.emp-tabs button.active{background:#0b1d3a;color:#fff;border-color:#0b1d3a}
.tab-panel{display:none}.tab-panel.active{display:block}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.panel{background:#fff;border:1px solid #e6edf5;border-radius:20px;padding:20px;box-shadow:0 5px 14px rgba(20,45,80,.045)}
.panel h3{margin:0 0 14px;font-size:17px}
.info-row{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid #edf2f7}
.info-row:last-child{border-bottom:0}
.info-label{color:#7b8aa5;font-size:12px;font-weight:700}
.info-value{font-size:13px;font-weight:900}
.task-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #edf2f7}
.task-row:last-child{border-bottom:0}
.task-title{font-size:13px;font-weight:900}
.task-sub{font-size:10px;color:#7b8aa5;margin-top:3px}
.pill{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap}
.pill.run{background:#eaf2ff;color:#2563eb}.pill.wait{background:#fff7e8;color:#b96d00}.pill.delay{background:#fff0f0;color:#cf3c43}
.duty{padding:13px 14px;border-right:4px solid #1d7df2;background:#f8fbff;border-radius:12px;margin-bottom:10px;font-size:13px;line-height:1.8}
.kpi-card{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:18px}
.kpi-title{font-size:12px;font-weight:900}.kpi-number{font-size:28px;font-weight:900;margin:8px 0}
.bar{height:8px;background:#edf2f7;border-radius:999px;overflow:hidden}.fill{height:100%;background:#1677ff}
.quick-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.quick-links a{text-decoration:none;border:1px solid #dbe7f5;background:#fff;color:#176fd3;padding:9px 12px;border-radius:11px;font-size:11px;font-weight:900}
@media(max-width:1000px){.emp-top{flex-direction:column;align-items:flex-start}.hero-stats{min-width:0;width:100%}.two-col,.three-col{grid-template-columns:1fr}}
</style>
<script id="hamzaApprovedProfileRoute">
(function(){
  const uid=new URLSearchParams(location.search).get('uid');
  if(uid==='SK9kgX3MHlOWQMwmnJbfGjCvtha2') location.replace('../profile/financial-manager.html');
})();
</script>
</head>
<body data-min-role="manager">
<div class="atwar-shell">
  <atwar-sidebar active="team"></atwar-sidebar>

  <section class="atwar-main">
    <atwar-header></atwar-header>

    <main class="atwar-content">
      <div style="margin-bottom:14px"><a href="index.html" style="text-decoration:none;color:#1677ff;font-size:12px;font-weight:900">← العودة إلى الفريق</a></div>
      <section style="min-height:520px;display:flex;align-items:center;justify-content:center">
        <div style="width:min(580px,100%);background:#fff;border:1px solid #e3eaf3;border-radius:20px;padding:36px;text-align:center;box-shadow:0 8px 24px rgba(20,45,80,.04)">
          <div style="width:60px;height:60px;border-radius:18px;background:#eaf3ff;color:#1677ff;display:grid;place-items:center;margin:0 auto 16px"><i data-lucide="construction" style="width:27px;height:27px"></i></div>
          <h1 id="employeeProfileStatus" style="margin:0;font-size:24px;color:#10233f">الملف الوظيفي تحت الإنشاء</h1>
          <p id="employeeProfileMessage" style="font-size:11px;color:#7b8aa5;line-height:1.9;margin:11px auto 0;max-width:450px">لم يتم تجهيز واعتماد الملف الوظيفي الخاص بهذا الموظف حتى الآن.</p>
        </div>
      </section>
      <footer class="atwar-footer"><span>ATWAR ONE • Employee Profile</span><span>ATWAR ONE</span><span>Firebase Live Data</span></footer>
    </main>
  </section>
</div>


<script>
function showEmployeeTab(name,btn){
 document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
 document.getElementById('tab-'+name)?.classList.add('active');
 btn?.classList.add('active');
}
</script>
<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/permissions.js"></script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
 const s=document.querySelector('[data-global-search]');
 if(s) s.addEventListener('keydown',e=>{
   if(e.key==='Enter' && s.value.trim()) location.href='../search/index.html?q='+encodeURIComponent(s.value.trim());
 });
});
</script>
<script type="module" id="employeeFirebaseBinding">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app=getApps().length?getApps()[0]:initializeApp(window.ATWAR_FIREBASE_CONFIG);
const auth=getAuth(app),db=getDatabase(app);
const uid=new URLSearchParams(location.search).get('uid')||'';
const HAMZA_UID='SK9kgX3MHlOWQMwmnJbfGjCvtha2';

onAuthStateChanged(auth,async viewer=>{
  if(!viewer){location.href='../login.html';return}
  if(!uid){location.replace('index.html');return}
  try{
    const [viewerSnap,targetSnap]=await Promise.all([
      get(ref(db,`users/${viewer.uid}`)),
      get(ref(db,`users/${uid}`))
    ]);
    if(!viewerSnap.exists()||!targetSnap.exists()){location.replace('index.html');return}

    const vp=viewerSnap.val(),target=targetSnap.val();
    const allowed=
      vp.role==='admin' ||
      (vp.role==='manager' && (
        String(target.managerUid||'')===String(viewer.uid) ||
        target.managerChain?.[viewer.uid]===true
      ));
    if(!allowed){location.replace('../home.html');return}

    if(uid===HAMZA_UID){
      location.replace('../profile/financial-manager.html');
      return;
    }

    const name=target.name||target.email||'الموظف';
    document.getElementById('employeeProfileMessage').textContent=
      `لم يتم تجهيز واعتماد الملف الوظيفي الخاص بـ ${name} حتى الآن.`;
    window.atwarSyncShellIdentity?.(vp,viewer);
    try{lucide.createIcons()}catch{}
  }catch(error){
    console.error('Employee profile access:',error);
    location.replace('index.html');
  }
});
</script>
</body>
</html>
