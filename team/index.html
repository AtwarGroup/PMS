<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – الفريق</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:15px}.card h3{margin:0;font-size:14px}.card p{font-size:10px;color:#7a899d}.stats{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#eef3f9;border-radius:999px;padding:5px 7px;font-size:9px;font-weight:900}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body data-min-role="manager"><div class="atwar-shell"><atwar-sidebar active="team"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><h1>الفريق</h1><p style="color:#7a899d">الأعضاء والمهام التي تسمح RLS لهذا الحساب برؤيتها.</p><div id="state"></div><div id="grid" class="grid"></div><footer class="atwar-footer"><span>ATWAR ONE • Team</span><span>Production 1.6</span><span>RLS Scope</span></footer></main></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function run(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}const[{data:p,error:pe},{data:u,error:ue},{data:t,error:te}]=await Promise.all([sb.from('profiles').select('*').eq('id',session.user.id).single(),sb.from('profiles').select('id,full_name,email,role,job_title,department,manager_id,active,status').eq('active',true).eq('status','active').order('full_name'),sb.from('tasks').select('id,assignee_id,status,progress,due_date')]);if(pe||ue||te){console.error(pe||ue||te);document.getElementById('state').textContent='تعذر تحميل بيانات الفريق.';return}window.atwarSyncShellIdentity?.(p,session.user);const people=u||[],tasks=t||[];document.getElementById('grid').innerHTML=people.map(x=>{const a=tasks.filter(z=>z.assignee_id===x.id);return`<div class="card"><h3>${esc(x.full_name)}</h3><p>${esc(x.job_title||x.role)}${x.department?' · '+esc(x.department):''}</p><div class="stats"><span class="tag">المهام ${a.length}</span><span class="tag">جارية ${a.filter(z=>z.status==='قيد التنفيذ').length}</span><span class="tag">بانتظار ${a.filter(z=>z.status==='قيد الانتظار').length}</span><span class="tag">مكتملة ${a.filter(z=>z.status==='مكتملة').length}</span></div></div>`}).join('')||'لا يوجد أعضاء ظاهرون لهذا الحساب.'}run().catch(console.error);</script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script></body></html>
