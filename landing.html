<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#07182f,#0c274a 55%,#0d3562);min-height:100vh;color:white}
.wrap{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 42px}
.brand{display:flex;align-items:center;gap:14px}.mark{width:6px;height:50px;border-radius:20px;background:#19a7ff}
.brand h1{margin:0;font-size:28px;font-weight:900}.brand p{margin:4px 0 0;color:#b9c7da;font-size:13px}
main{flex:1;display:grid;place-items:center;padding:30px}
.hero{text-align:center;max-width:820px}
.hero h2{font-size:46px;margin:0 0 14px;font-weight:900}.hero p{font-size:17px;color:#cbd7e8;line-height:1.9;margin:0 auto 34px;max-width:680px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(240px,320px));justify-content:center;gap:18px}
.app-card{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;text-decoration:none;color:#fff;transition:.2s;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.app-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.12)}





.icon{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,#1476e8,#25a8ff);display:grid;place-items:center}
.app-card h3{font-size:24px;margin:0 0 8px}.app-card p{font-size:13px;color:#cad7e8;margin:0;line-height:1.7}
footer{padding:20px 42px;color:#95a7bf;font-size:11px;display:flex;justify-content:space-between}
@media(max-width:950px){.apps{grid-template-columns:1fr;max-width:360px;margin:auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><div class="mark"></div><div><h1>ATWAR ONE</h1><p>منصة الأعمال والأداء المؤسسي</p></div></div>
  <div style="color:#9ecfff;font-weight:800;font-style:italic">Performance Management System</div>
</header>
<main>
  <section class="hero">
    <h2>مرحباً بك في ATWAR ONE</h2>
    <p>بوابة موحدة للوصول إلى أنظمة العمل الداخلية حسب صلاحيات المستخدم ودوره التنظيمي.</p>
    <div id="systemsGrid" class="apps"></div>
  </section>
</main>
<footer><span>ATWAR ONE © 2026</span><span>V0.40.1</span></footer>
</div>
<script src="assets/js/systems-config.js"></script>
<script>
const grid=document.getElementById('systemsGrid');
grid.innerHTML=(window.ATWAR_SYSTEMS||[]).map(system=>`
  <a class="app-card" href="${system.href}" target="${system.target||'_self'}" ${system.target==='_blank'?'rel="noopener noreferrer"':''}>
    <div class="icon"><i data-lucide="${system.icon}" style="width:34px;height:34px"></i></div>
    <h3>${system.name}</h3>
    <p>${system.description}</p>
  </a>
`).join('');
lucide.createIcons();
</script>
</body>
</html>
