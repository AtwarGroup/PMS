<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – الرئيسية</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-runtime.js"></script><script src="assets/js/shell-components.js"></script><link rel="stylesheet" href="assets/css/shared.css"><style>.hero h1{font-size:30px;margin:0}.hero p{color:#7a899d;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.metric,.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px}.metric span{font-size:10px;color:#7a899d;display:block}.metric b{font-size:26px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #edf2f7}.item:last-child{border-bottom:0}.item b{font-size:12px}.item small{display:block;color:#8190a3;font-size:9px;margin-top:3px}.tag{font-size:9px;font-weight:900;background:#edf3fa;border-radius:999px;padding:5px 8px;white-space:nowrap}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="atwar-shell"><atwar-sidebar active="home"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><div class="hero"><h1>مرحباً <span data-greeting-name></span></h1><p>نظرة سريعة على ما يحتاج انتباهك الآن.</p></div><div id="state"></div><section class="metrics"><div class="metric"><span>المهام المرئية</span><b id="total">—</b></div><div class="metric"><span>مهامي الجارية</span><b id="doing">—</b></div><div class="metric"><span>بانتظار الاعتماد</span><b id="approval">—</b></div><div class="metric"><span>متأخرة الآن</span><b id="late">—</b></div><div class="metric"><span>مكتملة</span><b id="done">—</b></div></section><div class="grid"><section class="card"><h3>الأولوية الآن</h3><div id="priority">جاري التحميل...</div></section><section class="card"><h3>اختصارات</h3><div class="item"><a href="tasks/index.html">فتح المهام</a></div><div class="item"><a href="my-day/index.html">يومي</a></div><div class="item"><a href="workspace/index.html">مساحة عملي</a></div><div class="item" data-role-min="manager"><a href="team/index.html">الفريق</a></div></section></div><footer class="atwar-footer"><span>ATWAR ONE</span><span>Production 1.6</span><span>PostgreSQL + RLS</span></footer></main></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toISOString().slice(0,10);const late=t=>t.due_date&&t.due_date<today()&&['قيد الانتظار','قيد التنفيذ'].includes(t.status);async function run(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='login.html';return}const[{data:p,error:pe},{data:t,error:te}]=await Promise.all([sb.from('profiles').select('*').eq('id',session.user.id).single(),sb.from('tasks').select('*').order('updated_at',{ascending:false})]);if(pe||te){console.error(pe||te);document.getElementById('state').textContent='تعذر تحميل الصفحة الرئيسية.';return}window.atwarSyncShellIdentity?.(p,session.user);const rows=t||[],mine=rows.filter(x=>x.assignee_id===p.id);document.getElementById('total').textContent=rows.length;document.getElementById('doing').textContent=mine.filter(x=>x.status==='قيد التنفيذ').length;document.getElementById('approval').textContent=rows.filter(x=>x.status==='بانتظار الاعتماد').length;document.getElementById('late').textContent=mine.filter(late).length;document.getElementById('done').textContent=rows.filter(x=>x.status==='مكتملة').length;const important=[...mine.filter(late),...mine.filter(x=>x.status==='قيد التنفيذ'&&!late(x)),...rows.filter(x=>x.status==='بانتظار الاعتماد'&&x.assignee_id!==p.id)].slice(0,8);document.getElementById('priority').innerHTML=important.length?important.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><small>${esc(x.assignee_name_snapshot)} · ${esc(x.due_date||'بدون تاريخ')}</small></div><span class="tag">${esc(x.status)}</span></div>`).join(''):'<div class="item"><b>لا توجد عناصر عاجلة حالياً.</b></div>'}run().catch(console.error);</script><script src="assets/js/roles-config.js"></script><script src="assets/js/start-page-config.js"></script><script src="assets/js/permissions.js"></script></body></html>
