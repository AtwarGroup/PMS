<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – مساحة عملي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px}.card textarea,.card input{width:100%;border:1px solid #dce5ef;border-radius:10px;padding:10px;font-family:inherit}.card textarea{min-height:170px}.item{border:1px solid #e7edf5;border-radius:11px;padding:10px;margin-top:8px}.actions{display:flex;gap:7px;margin-top:8px}.primary,.secondary,.danger{border:0;border-radius:9px;padding:8px 11px;font-family:inherit;font-weight:900;cursor:pointer}.primary{background:#0b1d3a;color:#fff}.secondary{background:#edf3fa;color:#183b62}.danger{background:#fff0f0;color:#b42318}.status{font-size:10px;margin-top:8px;color:#7a899d}.error{color:#b42318}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><div class="atwar-shell"><atwar-sidebar active="notes"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><h1>مساحة عملي</h1><p style="color:#7a899d">ملاحظاتك ومتابعاتك الشخصية في Supabase.</p><div class="grid"><section class="card"><h3>ملاحظتي</h3><textarea id="note" placeholder="اكتب ملاحظتك..."></textarea><div class="actions"><button id="saveNote" class="primary">حفظ</button></div><div id="noteStatus" class="status"></div></section><section class="card"><h3>متابعاتي</h3><input id="fTitle" placeholder="عنوان المتابعة"><input id="fDate" type="date" style="margin-top:7px"><textarea id="fNote" placeholder="ملاحظة" style="min-height:80px;margin-top:7px"></textarea><div class="actions"><button id="addFollow" class="primary">إضافة متابعة</button></div><div id="followStatus" class="status"></div><div id="followList"></div></section></div><footer class="atwar-footer"><span>ATWAR ONE • Workspace</span><span>Production 1.6</span><span>quick_notes + follow_ups</span></footer></main></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;let p=null,noteRow=null,follows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const pick=(row,keys,def='')=>{for(const k of keys)if(row&&row[k]!=null)return row[k];return def};const noteText=row=>pick(row,['text','note_text','body','value','memo','note','content'],'');const followDate=row=>pick(row,['date','follow_date','followup_date','follow_up_date','due_date','target_date'],'');const followNote=row=>pick(row,['note','notes','note_text','description','details','body'],'');async function load(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}const{data:prof,error:pe}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(pe){throw pe}p=prof;window.atwarSyncShellIdentity?.(p,session.user);const[nr,fr]=await Promise.all([sb.from('quick_notes').select('*').eq('owner_id',session.user.id).order('updated_at',{ascending:false}).limit(1),sb.from('follow_ups').select('*').eq('owner_id',session.user.id).order('created_at',{ascending:false})]);if(nr.error)console.warn('quick_notes',nr.error);if(fr.error)console.warn('follow_ups',fr.error);noteRow=(nr.data||[])[0]||null;follows=fr.data||[];document.getElementById('note').value=noteText(noteRow);renderFollows()}function renderFollows(){document.getElementById('followList').innerHTML=follows.length?follows.map(x=>`<div class="item"><b>${esc(x.title||'متابعة')}</b><div class="status">${esc(followDate(x)||'بدون تاريخ')} · ${esc(x.status||'soon')}</div><div>${esc(followNote(x))}</div><div class="actions">${x.status!=='done'?`<button class="secondary done" data-id="${x.id}">تمت</button>`:''}<button class="danger del" data-id="${x.id}">حذف</button></div></div>`).join(''):'لا توجد متابعات.';document.querySelectorAll('.done').forEach(b=>b.onclick=()=>setDone(b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>deleteFollow(b.dataset.id))}document.getElementById('saveNote').onclick=async()=>{const el=document.getElementById('noteStatus');el.textContent='جاري الحفظ...';el.className='status';const{error}=await sb.rpc('workspace_save_note',{p_text:document.getElementById('note').value});el.textContent=error?'تعذر الحفظ: '+error.message:'تم حفظ الملاحظة.';el.className='status'+(error?' error':'');if(error)console.error(error);else await load()};document.getElementById('addFollow').onclick=async()=>{const title=document.getElementById('fTitle').value.trim(),el=document.getElementById('followStatus');if(!title){el.textContent='عنوان المتابعة مطلوب.';return}el.textContent='جاري الإضافة...';const{error}=await sb.rpc('workspace_add_followup',{p_title:title,p_follow_date:document.getElementById('fDate').value||null,p_note:document.getElementById('fNote').value||''});el.textContent=error?'تعذر الإضافة: '+error.message:'تمت الإضافة.';el.className='status'+(error?' error':'');if(error){console.error(error);return}document.getElementById('fTitle').value='';document.getElementById('fNote').value='';await load()};async function setDone(id){const{error}=await sb.rpc('workspace_complete_followup',{p_followup_id:id});if(error){document.getElementById('followStatus').textContent='تعذر الإكمال: '+error.message;console.error(error)}else await load()}async function deleteFollow(id){const{error}=await sb.rpc('workspace_delete_followup',{p_followup_id:id});if(error){document.getElementById('followStatus').textContent='تعذر الحذف: '+error.message;console.error(error)}else await load()}load().catch(e=>{console.error(e);document.getElementById('followStatus').textContent='تعذر تحميل مساحة العمل: '+e.message});</script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script></body></html>
