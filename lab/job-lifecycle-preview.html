<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة السريان والمراجعة الدورية</title><link rel="stylesheet" href="../assets/css/shared.css?v=2.5.26"><link rel="stylesheet" href="../assets/css/job-review.css"><link rel="stylesheet" href="../assets/css/app-theme.css?v=2.5.36"><link rel="stylesheet" href="../assets/css/job-authoring.css?v=2.5.57"><style>body{margin:0;padding:24px;background:var(--atwar-page-bg,#f4f7fb)}main{max-width:1100px;margin:auto}.preview-notice{background:#fff7d6;border:1px solid #ebd18a;color:#775615;padding:14px;border-radius:12px;margin-bottom:18px}.preview-tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.preview-tools button{font:inherit}.preview-title{margin-bottom:20px}@media(max-width:760px){body{padding:12px}.edit-grid{grid-template-columns:1fr!important}}</style></head><body><main class="review-page"><div class="preview-notice">معاينة ببيانات تجريبية فقط، تستخدم نفس مكوّن العرض في شاشة الوصف. لا تتصل بقاعدة البيانات ولا تحفظ أي إجراء.</div><h1 class="preview-title">السريان والمراجعة الدورية</h1><div class="preview-tools"><button class="review-btn" data-state="date">تحديد السريان</button><button class="review-btn" data-state="scheduled">معتمد بانتظار السريان</button><button class="review-btn" data-state="periodic">المراجعة الدورية — مسؤول النظام</button><button class="review-btn" data-state="manager">المراجعة الدورية — المدير</button></div><div id="previewBody" class="content-stack"></div></main><script type="module">
import {renderJobLifecycle} from '../assets/js/job-lifecycle-view.mjs?v=2.5.59';
import {riyadhToday} from '../assets/js/job-workflow-model.mjs?v=2.5.59';
const today=riyadhToday();const common={job:{id:'preview',title:'وصف تجريبي',status:'MANAGER_APPROVED',final_reviewed_at:'preview',reviewer_id:'manager',published_snapshot:{revision:3}},periodicReview:null,periodicEvents:[],users:[{id:'manager',role:'manager',full_name:'مدير تجريبي'},{id:'admin',role:'admin',full_name:'مسؤول النظام التجريبي'}],stageOwners:[{stage:'DRAFT',profile_id:'admin'}],me:{id:'admin'},canStage:()=>true,today,effectiveChoice:today};
function render(state){const data=structuredClone({...common,canStage:undefined});data.canStage=()=>state!=='manager';if(state==='scheduled')data.scheduled={status:'PENDING',effective_date:'2026-11-01'};if(['periodic','manager'].includes(state)){data.job.status='PUBLISHED';data.periodicReview={enabled:true,reviewer_id:'manager',due_on:today,interval_months:12};}if(state==='manager')data.me.id='manager';document.getElementById('previewBody').innerHTML=renderJobLifecycle(data);document.querySelectorAll('#previewBody button,#previewBody a').forEach(b=>{b.addEventListener('click',e=>{e.preventDefault();alert('معاينة فقط — لم يُحفظ أي إجراء.');});});}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>render(b.dataset.state));render('date');
</script></body></html>
