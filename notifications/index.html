<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – الإشعارات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.head{display:flex;justify-content:space-between;align-items:end}.head h1{margin:0;font-size:28px}.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px;margin-top:16px}.n{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #edf2f7;padding:13px 0;cursor:pointer}.n:last-child{border-bottom:0}.n b{font-size:12px}.n p{margin:4px 0 0;color:#718198;font-size:10px}.n small{color:#8b98a9;white-space:nowrap}.primary,.secondary{border:0;border-radius:10px;padding:9px 12px;font-family:inherit;font-weight:900;cursor:pointer}.primary{background:#0b1d3a;color:#fff}.secondary{background:#edf3fa;color:#183b62}</style></head><body><div class="atwar-shell"><atwar-sidebar active=""></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><div class="head"><div><h1>الإشعارات</h1><p style="color:#7a899d;font-size:11px">الإشعار غير المقروء هو صف موجود في Supabase؛ عند فتح العنصر المرتبط يتم حذف الإشعار.</p></div><button id="clearAll" class="secondary">مسح جميع الإشعارات</button></div><div id="state"></div><section class="card" id="list">جاري التحميل...</section><footer class="atwar-footer"><span>ATWAR ONE • Notifications</span><span>Production 1.6</span><span>Transient Notifications</span></footer></main></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(p)window.atwarSyncShellIdentity?.(p,session.user);const{data,error}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100);if(error){console.error(error);document.getElementById('list').textContent='تعذر تحميل الإشعارات.';return}rows=data||[];document.getElementById('list').innerHTML=rows.length?rows.map(n=>`<div class="n" data-id="${n.id}"><div><b>${esc(n.title||n.type||'إشعار')}</b><p>${esc(n.message||n.detail||'')}</p></div><small>${esc(n.created_at?new Date(n.created_at).toLocaleString('ar-SA'):'')}</small></div>`).join(''):'لا توجد إشعارات جديدة.';document.querySelectorAll('.n').forEach(el=>el.onclick=()=>openNotification(el.dataset.id))}async function openNotification(id){const n=rows.find(x=>String(x.id)===String(id));if(!n)return;if(n.task_id){location.href=`../tasks/index.html?task=${encodeURIComponent(n.task_id)}&notification=${encodeURIComponent(n.id)}`;return}const{error}=await sb.from('notifications').delete().eq('id',n.id);if(!error)load()}document.getElementById('clearAll').onclick=async()=>{if(!rows.length)return;const{error}=await sb.from('notifications').delete().in('id',rows.map(x=>x.id));if(error)console.error(error);else load()};load().catch(console.error);</script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script></body></html>
