<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – الإشعارات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.n-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.n-head h1{margin:0;font-size:28px}.n-head p{margin:5px 0 0;color:#7b8aa5;font-size:12px}
.n-actions{display:flex;gap:8px}.n-actions button{border:1px solid #dfe7f1;background:#fff;border-radius:11px;padding:9px 12px;font-family:inherit;font-weight:900;color:#5f7086;cursor:pointer}.n-actions button.active{background:#0b1d3a;color:#fff}
.n-card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;box-shadow:0 4px 12px rgba(20,45,80,.03)}
.n-card.unread{border-right:4px solid #1677ff;background:#fbfdff}
.n-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.n-icon.task{background:#eaf2ff;color:#2563eb}.n-icon.approval{background:#fff5e6;color:#c06d00}.n-icon.system{background:#edf9f3;color:#15805a}.n-icon.alert{background:#fff0f0;color:#d33c43}
.n-title{font-weight:900;font-size:14px}.n-text{font-size:11px;color:#66778d;margin-top:4px;line-height:1.7}.n-time{font-size:10px;color:#8c99aa;white-space:nowrap}
.n-empty{display:none;background:#fff;border:1px dashed #dbe5ef;border-radius:18px;padding:50px;text-align:center;color:#8b98aa}
@media(max-width:760px){.n-head{flex-direction:column;align-items:start;gap:12px}.n-card{grid-template-columns:auto 1fr}.n-time{grid-column:2}}
</style>
</head>
<body>
<div class="atwar-shell">
<atwar-sidebar active=""></atwar-sidebar>

<section class="atwar-main">
<atwar-header></atwar-header>

<main class="atwar-content">
<div class="n-head">
<div><h1>الإشعارات</h1><p>كل ما يحتاج انتباهك في مكان واحد.</p></div>
<div class="n-actions">
<button type="button" onclick="markAllRead()">تحديد الكل كمقروء</button>
</div>
</div>

<section id="notifList"></section>
<div id="notifEmpty" class="n-empty">لا توجد إشعارات في هذا التصنيف.</div>

<footer class="atwar-footer"><span>ATWAR ONE • Notifications</span><span>V0.40.5</span><span>Firebase Live Data</span></footer>
</main>
</section>
</div>

<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/permissions.js"></script>
<script type="module" id="notificationsFirebaseBinding">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, update, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=getApps().length?getApps()[0]:initializeApp(window.ATWAR_FIREBASE_CONFIG),auth=getAuth(app),db=getDatabase(app);
let uid='',notifications=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function iconFor(t){return t==='approval'?'badge-check':(t==='overdue'||t==='overdue_summary')?'triangle-alert':t==='approved'?'circle-check-big':t==='manager_note'?'notebook-pen':'info'}
function timeLabel(ts){if(!ts)return '';const d=Math.max(0,Date.now()-Number(ts)),m=Math.floor(d/60000);return m<1?'الآن':m<60?`منذ ${m} دقيقة`:m<1440?`منذ ${Math.floor(m/60)} ساعة`:`منذ ${Math.floor(m/1440)} يوم`}
function render(){
 const rows=notifications;
 const list=document.getElementById('notifList');
 list.innerHTML=rows.map(n=>`<article class="n-card ${n.read?'':'unread'}" data-id="${esc(n.id)}" style="cursor:pointer"><div class="n-icon ${(n.type==='overdue'||n.type==='overdue_summary')?'alert':n.type==='approval'?'approval':n.type==='approved'?'system':'task'}"><i data-lucide="${iconFor(n.type)}"></i></div><div><div class="n-title">${esc(n.title||'إشعار')}</div><div class="n-text">${esc(n.message||'')}</div></div><div class="n-time">${esc(timeLabel(n.createdAt))}</div></article>`).join('');
 document.getElementById('notifEmpty').style.display=rows.length?'none':'block';
 list.querySelectorAll('[data-id]').forEach(card=>card.addEventListener('click',()=>openNotif(card.dataset.id)));
 try{lucide.createIcons()}catch{}
}
window.markAllRead=async function(){if(!uid)return;const changes={};notifications.filter(n=>!n.read).forEach(n=>changes[`${n.id}/read`]=true);if(Object.keys(changes).length)await update(ref(db,`notificationsByUser/${uid}`),changes)};
async function openNotif(id){
 const n=notifications.find(x=>x.id===id);if(!n)return;
 if(!n.read)await update(ref(db,`notificationsByUser/${uid}/${id}`),{read:true});
 if(n.type==='overdue_summary'){location.href='../tasks/index.html?scope=OVERDUE';return}
 if(n.taskKey&&n.ownerUid){location.href=`../tasks/index.html?owner=${encodeURIComponent(n.ownerUid)}&task=${encodeURIComponent(n.taskKey)}`;return}
 if(n.ownerUid){location.href=`../tasks/index.html?owner=${encodeURIComponent(n.ownerUid)}`;return}
 location.href='../home.html';
}
onAuthStateChanged(auth,user=>{
 if(!user){location.href='../login.html';return}
 uid=user.uid;
 const recent=query(ref(db,`notificationsByUser/${uid}`),orderByChild('createdAt'),limitToLast(100));
 onValue(recent,snap=>{
   notifications=snap.exists()?Object.entries(snap.val()).map(([id,v])=>({id,...v})).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)):[];
   const legacy=notifications.filter(x=>x.type==='overdue'&&x.ownerUid&&String(x.ownerUid)!==String(uid));
   if(legacy.length){
     notifications=notifications.filter(x=>!legacy.some(old=>old.id===x.id));
   }
   render();
 },e=>{console.error('Notifications:',e);document.getElementById('notifList').innerHTML='';document.getElementById('notifEmpty').style.display='block';document.getElementById('notifEmpty').textContent='الإشعارات غير متاحة حالياً.'});
});
</script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
 const s=document.querySelector('[data-global-search]');
 if(s) s.addEventListener('keydown',e=>{
   if(e.key==='Enter' && s.value.trim()) location.href='../search/index.html?q='+encodeURIComponent(s.value.trim());
 });
});
</script>
<script src="../assets/js/consolidation.js"></script>
</body></html>
