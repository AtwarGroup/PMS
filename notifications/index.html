<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – الإشعارات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.n-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.n-head h1{margin:0;font-size:28px}.n-head p{margin:5px 0 0;color:#7b8aa5;font-size:12px}
.n-actions{display:flex;gap:8px}.n-actions button{border:1px solid #dfe7f1;background:#fff;border-radius:11px;padding:9px 12px;font-family:inherit;font-weight:900;color:#5f7086;cursor:pointer}.n-actions button.active{background:#0b1d3a;color:#fff}
.n-card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;box-shadow:0 4px 12px rgba(20,45,80,.03)}
.n-card.unread{border-right:4px solid #1677ff;background:#fbfdff}
.n-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.n-icon.task{background:#eaf2ff;color:#2563eb}.n-icon.approval{background:#fff5e6;color:#c06d00}.n-icon.system{background:#edf9f3;color:#15805a}.n-icon.alert{background:#fff0f0;color:#d33c43}
.n-title{font-weight:900;font-size:14px}.n-text{font-size:11px;color:#66778d;margin-top:4px;line-height:1.7}.n-time{font-size:10px;color:#8c99aa;white-space:nowrap}
.n-empty{display:none;background:#fff;border:1px dashed #dbe5ef;border-radius:18px;padding:50px;text-align:center;color:#8b98aa}
@media(max-width:760px){.n-head{flex-direction:column;align-items:start;gap:12px}.n-card{grid-template-columns:auto 1fr}.n-time{grid-column:2}}
</style>
</head>
<body>
<div class="atwar-shell">
<atwar-sidebar active=""></atwar-sidebar>

<section class="atwar-main">
<atwar-header></atwar-header>

<main class="atwar-content">
<div class="n-head">
<div><h1>الإشعارات</h1><p>كل ما يحتاج انتباهك في مكان واحد.</p></div>
<div class="n-actions">
<button type="button" onclick="markAllRead()">تحديد الكل كمقروء</button>
</div>
</div>

<section id="notifList"></section>
<div id="notifEmpty" class="n-empty">لا توجد إشعارات في هذا التصنيف.</div>

<footer class="atwar-footer"><span>ATWAR ONE • Notifications</span><span>Production 1.7C</span><span>Supabase Live Data</span></footer>
</main>
</section>
</div>

<script src="../assets/js/roles-config.js"></script>
<script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/supabase-runtime.js"></script>
<script src="../assets/js/permissions.js"></script>
<script type="module" id="notificationsSupabaseBinding">
const sb=await window.atwarGetSupabase();
async function authProfile(loginPath){
  const {data:{session},error:se}=await sb.auth.getSession();
  if(se||!session?.user){location.href=loginPath;return null;}
  const {data:profile,error:pe}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(pe||!profile||profile.active===false||profile.status==='inactive'||!['employee','manager','admin'].includes(profile.role)){
    await sb.auth.signOut().catch(()=>{});location.href=loginPath;return null;
  }
  window.atwarSyncShellIdentity?.(profile,session.user);
  return {session,user:session.user,profile};
}

let notifications=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function iconFor(t){return t==='approval'?'badge-check':(t==='overdue'||t==='overdue_summary')?'triangle-alert':t==='approved'?'circle-check-big':t==='manager_note'?'notebook-pen':'info'}function timeLabel(ts){if(!ts)return'';const d=Math.max(0,Date.now()-new Date(ts).getTime()),m=Math.floor(d/60000);return m<1?'الآن':m<60?`منذ ${m} دقيقة`:m<1440?`منذ ${Math.floor(m/60)} ساعة`:`منذ ${Math.floor(m/1440)} يوم`}
function render(){const list=document.getElementById('notifList');list.innerHTML=notifications.map(n=>`<article class="n-card unread" data-id="${esc(n.id)}" style="cursor:pointer"><div class="n-icon ${(n.type==='overdue'||n.type==='overdue_summary')?'alert':n.type==='approval'?'approval':n.type==='approved'?'system':'task'}"><i data-lucide="${iconFor(n.type)}"></i></div><div><div class="n-title">${esc(n.title||n.type||'إشعار')}</div><div class="n-text">${esc(n.message||n.detail||'')}</div></div><div class="n-time">${esc(timeLabel(n.created_at))}</div></article>`).join('');document.getElementById('notifEmpty').style.display=notifications.length?'none':'block';list.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>openNotif(c.dataset.id));try{lucide.createIcons()}catch{}}
async function load(){const r=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100);if(r.error)throw r.error;notifications=r.data||[];render()}
window.markAllRead=async function(){if(!notifications.length)return;const ids=notifications.map(x=>x.id);const{error}=await sb.from('notifications').delete().in('id',ids);if(!error){notifications=[];render()}};
async function openNotif(id){const n=notifications.find(x=>String(x.id)===String(id));if(!n)return;if(n.task_id){location.href=`../tasks/index.html?task=${encodeURIComponent(n.task_id)}&notification=${encodeURIComponent(n.id)}`;return}await sb.from('notifications').delete().eq('id',n.id);location.href=n.type==='overdue_summary'?'../tasks/index.html?scope=OVERDUE':'../home.html'}
const a=await authProfile('../login.html');if(a){await load().catch(e=>{console.error(e);document.getElementById('notifEmpty').style.display='block';document.getElementById('notifEmpty').textContent='الإشعارات غير متاحة حالياً.'})}
</script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
 const s=document.querySelector('[data-global-search]');
 if(s) s.addEventListener('keydown',e=>{
   if(e.key==='Enter' && s.value.trim()) location.href='../search/index.html?q='+encodeURIComponent(s.value.trim());
 });
});
</script>
</body></html>
