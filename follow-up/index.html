<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – المتابعات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.f-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.f-head h1{font-size:28px;margin:0}.f-head p{font-size:12px;color:#7b8aa5;margin:5px 0 0}
.add-btn{border:0;background:#0b1d3a;color:#fff;border-radius:12px;padding:11px 15px;font-family:inherit;font-weight:900;cursor:pointer}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f-card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:17px}
.f-top{display:flex;justify-content:space-between;gap:10px}.f-title{font-size:14px;font-weight:900}.f-meta{font-size:10px;color:#8391a4;margin-top:5px}
.f-note{font-size:11px;color:#607086;line-height:1.8;margin-top:12px}.pill{font-size:9px;font-weight:900;padding:6px 8px;border-radius:999px;height:max-content}
.wait{background:#fff5e6;color:#b66b00}.soon{background:#eef6ff;color:#176fd3}.done{background:#edf9f3;color:#16805b}
.f-actions{display:flex;gap:7px;margin-top:13px}.f-actions button{border:1px solid #dfe7f1;background:#fff;border-radius:9px;padding:7px 10px;font-family:inherit;font-size:10px;font-weight:900;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(8,20,38,.48);z-index:1000;place-items:center;padding:20px}
.modal.show{display:grid}.box{width:min(520px,100%);background:#fff;border-radius:20px;padding:20px}
.box h3{margin:0 0 15px}.field{margin-bottom:11px}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:5px}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #dfe7f1;border-radius:10px;padding:10px;font-family:inherit}.field textarea{min-height:90px}
.box-actions{display:flex;justify-content:flex-end;gap:8px}.box-actions button{border:0;border-radius:9px;padding:9px 12px;font-family:inherit;font-weight:900;cursor:pointer}.save{background:#0b1d3a;color:#fff}.cancel{background:#eef2f7;color:#52647a}
@media(max-width:800px){.f-grid{grid-template-columns:1fr}.f-head{align-items:start;flex-direction:column;gap:12px}}
</style>
</head>
<body>
<div class="atwar-shell">
<atwar-sidebar active="follow"></atwar-sidebar>
<section class="atwar-main">
<atwar-header></atwar-header>
<main class="atwar-content">
<div class="f-head"><div><h1>المتابعات</h1><p>للأمور التي تحتاج تذكيراً أو انتظار رد، ولا تستحق إنشاء مهمة كاملة.</p></div><button class="add-btn" onclick="openModal()">+ إضافة متابعة</button></div>
<section id="followList" class="f-grid"></section>
<footer class="atwar-footer"><span>ATWAR ONE • Follow-up</span><span>V0.37.4</span><span>Firebase Sync</span></footer>
</main></section></div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="box">
<h3>إضافة متابعة</h3>
<div class="field"><label>عنوان المتابعة</label><input id="fTitle" placeholder="مثال: انتظار رد المورد"></div>
<div class="field"><label>تاريخ المتابعة</label><input id="fDate" type="date"></div>
<div class="field"><label>ملاحظة</label><textarea id="fNote" placeholder="ما الذي تنتظره أو تريد تذكره؟"></textarea></div>
<div class="box-actions"><button class="cancel" onclick="closeModal()">إلغاء</button><button class="save" onclick="addFollow()">حفظ</button></div>
</div></div>

<script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/permissions.js"></script>
<script type="module" id="followupsFirebaseBinding">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

let db=null,currentUid='',followRef=null,data=[],unsubscribeFollow=null;

function safeText(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
  const labels={wait:'بانتظار رد',soon:'متابعة قريبة',done:'مكتملة'};
  const list=document.getElementById('followList');if(!list)return;
  list.innerHTML=data.length?data.map(x=>`<article class="f-card">
    <div class="f-top"><div><div class="f-title">${safeText(x.title)}</div><div class="f-meta">موعد المتابعة: ${safeText(x.date||'غير محدد')}</div></div><span class="pill ${x.status||'soon'}">${labels[x.status]||'متابعة'}</span></div>
    <div class="f-note">${safeText(x.note||'')}</div>
    <div class="f-actions">${x.status!=='done'?`<button onclick="doneFollow('${x.id}')">تمت المتابعة</button>`:''}<button onclick="removeFollow('${x.id}')">حذف</button></div>
  </article>`).join(''):'<div style="background:#fff;border:1px solid #e5edf6;border-radius:14px;padding:24px;text-align:center;color:#7b8aa5">لا توجد متابعات مسجلة حالياً.</div>';
  try{lucide.createIcons()}catch(e){}
}
const app=getApps().length?getApps()[0]:initializeApp(window.ATWAR_FIREBASE_CONFIG);
const auth=getAuth(app);db=getDatabase(app);

onAuthStateChanged(auth,user=>{
  if(!user){location.href='../login.html';return}
  currentUid=user.uid;
  if(unsubscribeFollow)unsubscribeFollow();
  followRef=ref(db,`followUpsByUser/${currentUid}`);
  unsubscribeFollow=onValue(followRef,snap=>{
    const raw=snap.exists()?snap.val():{};
    data=Object.entries(raw).map(([id,v])=>({id,...v})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    render();
  },err=>{
    console.error('Follow-up listener:',err);
    const list=document.getElementById('followList');
    if(list)list.innerHTML='<div style="padding:20px;text-align:center;color:#7b8aa5">المتابعات غير متاحة حالياً، حاول تحديث الصفحة بعد لحظات.</div>';
  });
});

window.openModal=function(){document.getElementById('modal').classList.add('show')};
window.closeModal=function(){document.getElementById('modal').classList.remove('show')};
window.addFollow=async function(){
  if(!followRef||!currentUid)return;
  const title=document.getElementById('fTitle').value.trim();if(!title)return;
  const now=Date.now(),itemRef=push(followRef);
  try{
    await set(itemRef,{title,date:document.getElementById('fDate').value||'',note:document.getElementById('fNote').value.trim(),status:'soon',createdAt:now,updatedAt:now});
    document.getElementById('fTitle').value='';document.getElementById('fDate').value='';document.getElementById('fNote').value='';window.closeModal();
  }catch(e){console.error('Add follow-up:',e)}
};
window.doneFollow=async id=>{if(currentUid&&id)await update(ref(db,`followUpsByUser/${currentUid}/${id}`),{status:'done',updatedAt:Date.now()})};
window.removeFollow=async id=>{if(currentUid&&id)await remove(ref(db,`followUpsByUser/${currentUid}/${id}`))};
window.done=window.doneFollow;window.removeF=window.removeFollow;
</script>
<script src="../assets/js/consolidation.js"></script>

<div class="atwar-copyright">جميع الحقوق محفوظة © ATWAR ONE 2026 - إدارة تطوير الأعمال</div>
</body></html>
