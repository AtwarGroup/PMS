name: ATWAR Complete Routine Permission Recovery Verification

on:
  push:
    branches: [quality/permissions-restore-verification-20261030]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atwar-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Verify production backup and staging rollback without writes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RESTORE_DRILL_DB_URL: ${{ secrets.RESTORE_DRILL_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      RESTORE_DRILL_SUPABASE_URL: ${{ secrets.RESTORE_DRILL_SUPABASE_URL }}
      RESTORE_DRILL_SERVICE_ROLE_KEY: ${{ secrets.RESTORE_DRILL_SERVICE_ROLE_KEY }}
      RESTORE_DRILL_PROJECT_REF: ${{ vars.RESTORE_DRILL_PROJECT_REF }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      GDRIVE_BACKUP_FOLDER: ${{ vars.GDRIVE_BACKUP_FOLDER }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate restore drill secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in SUPABASE_DB_URL RESTORE_DRILL_DB_URL SUPABASE_URL RESTORE_DRILL_SUPABASE_URL RESTORE_DRILL_SERVICE_ROLE_KEY RESTORE_DRILL_PROJECT_REF RCLONE_CONFIG_BASE64 BACKUP_ENCRYPTION_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done

      - name: Install restore clients
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone gnupg
          docker pull postgres:17.6
          docker pull supabase/postgres:17.6.1.136
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read back and verify both encrypted archives
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          config_file="$RUNNER_TEMP/rclone.conf"
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$config_file"
          root="gdrive:${GDRIVE_BACKUP_FOLDER:-ATWAR ONE Backups}"
          for kind in production staging; do
            target="$root"
            pattern='ATWAR_ONE_*.tar.gz.gpg'
            if test "$kind" = staging; then target="$root/Staging Checkpoints"; pattern='ATWAR_STAGING_*.tar.gz.gpg'; fi
            latest="$(rclone --config "$config_file" lsf "$target" --files-only --include "$pattern" | sort -r | head -n 1)"
            test -n "$latest"
            rclone --config "$config_file" copyto "$target/$latest" "$RUNNER_TEMP/$latest"
            rclone --config "$config_file" copyto "$target/$latest.sha256" "$RUNNER_TEMP/$latest.sha256"
            expected="$(awk '{print $1}' "$RUNNER_TEMP/$latest.sha256")"
            actual="$(sha256sum "$RUNNER_TEMP/$latest" | awk '{print $1}')"
            test "$expected" = "$actual"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_ENCRYPTION_PASSWORD" --output "$RUNNER_TEMP/${latest%.gpg}" --decrypt "$RUNNER_TEMP/$latest"
            tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/${latest%.gpg}"
            work="$RUNNER_TEMP/${latest%.tar.gz.gpg}"
            (cd "$work" && sha256sum -c manifest.sha256)
            node scripts/backup/verify-storage-backup.mjs "$work/storage"
            docker run --rm --volume "$work:/backup:ro" postgres:17.6 pg_restore --list /backup/database.dump > "$work/toc.txt"
            KIND="$kind" ARCHIVE="$latest" WORK="$work" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines=fs.readFileSync(process.env.WORK+'/toc.txt','utf8').split('\n');
          const tables=lines.filter(l=>/ TABLE /.test(l)&&!l.includes('TABLE DATA'));
          const schemas={}; for(const line of tables){const m=line.match(/ TABLE (\S+) /);if(m)schemas[m[1]]=(schemas[m[1]]||0)+1;}
          console.log(JSON.stringify({kind:process.env.KIND,archive:process.env.ARCHIVE,schemas,tableData:lines.filter(l=>/ TABLE DATA /.test(l)).length,extensions:lines.filter(l=>/ EXTENSION /.test(l)&&!l.includes('COMMENT')).map(l=>l.replace(/^.* EXTENSION /,''))}));
          NODE
            if test "$kind" = production; then
              WORK="$work" node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync(process.env.WORK+'/storage/storage-manifest.json','utf8'));if(m.version!==2||Date.now()-Date.parse(m.createdAt)>86400000)throw Error('A fresh version-2 production archive is required');"
            fi
            docker run -d --name atwar-isolated --network none --volume "$work:/backup:ro" -e POSTGRES_PASSWORD="$(openssl rand -hex 24)" supabase/postgres:17.6.1.136 postgres -c config_file=/etc/postgresql/postgresql.conf -c cron.database_name=atwar_restore -c cron.launch_active_jobs=off > /dev/null
            ready=no
            for attempt in $(seq 1 60); do
              if docker exec atwar-isolated pg_isready -U supabase_admin >/dev/null 2>&1; then ready=yes; break; fi
              sleep 1
            done
            test "$ready" = yes || { echo "Isolated database did not become ready"; exit 1; }
            docker exec atwar-isolated createdb -U supabase_admin atwar_restore
            node scripts/backup/prepare-restore-roles.mjs "$work/roles.sql" | docker exec -i atwar-isolated psql -U supabase_admin -d atwar_restore -v ON_ERROR_STOP=1 > "$work/roles-restore.log" 2>&1
            if ! docker exec atwar-isolated pg_restore -U supabase_admin -d atwar_restore --exit-on-error --single-transaction --clean --if-exists --no-owner /backup/database.dump > "$work/restore.log" 2>&1; then
              python3 -c 'import re,sys; s=open(sys.argv[1]).read(); print("\n".join(x for x in s.splitlines() if x.startswith("pg_restore: error: could not execute query: ERROR:") and not any(y in x.lower() for y in ["password","token","secret"])))' "$work/restore.log"
              echo "Isolated restore failed. Neither hosted database was modified."
              exit 1
            fi
            docker exec atwar-isolated psql -U supabase_admin -d atwar_restore -v ON_ERROR_STOP=1 -Atc "SELECT json_build_object('tasks',(SELECT count(*) FROM public.tasks),'profiles',(SELECT count(*) FROM public.profiles),'public_without_rls',(SELECT count(*) FROM pg_tables WHERE schemaname='public' AND NOT rowsecurity));"
            if test "$kind" = production; then
              docker exec atwar-isolated psql -U supabase_admin -d atwar_restore -v ON_ERROR_STOP=1 -Atc "DO \$verify\$ BEGIN IF EXISTS(SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.prosecdef AND has_function_privilege('anon',p.oid,'EXECUTE')) THEN RAISE EXCEPTION 'Restored privileged functions are executable by anon'; END IF; IF EXISTS(SELECT 1 FROM pg_tables WHERE schemaname='public' AND NOT rowsecurity) THEN RAISE EXCEPTION 'Restored public table lacks RLS'; END IF; END \$verify\$;"
              docker exec atwar-isolated psql -U supabase_admin -d atwar_restore -Atc "SELECT json_build_object('security_definer_functions',count(*) FILTER(WHERE p.prosecdef),'anon_executable_security_definer',count(*) FILTER(WHERE p.prosecdef AND has_function_privilege('anon',p.oid,'EXECUTE'))) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public';"
            fi
            permissions_sql="$(cat <<'PERMISSIONS_SQL'
          WITH access AS (
          SELECT n.nspname schema_name,p.proname,ARRAY(SELECT tn.nspname||'.'||t.typname FROM unnest(p.proargtypes::oid[]) WITH ORDINALITY a(type_oid,position) JOIN pg_type t ON t.oid=a.type_oid JOIN pg_namespace tn ON tn.oid=t.typnamespace ORDER BY a.position) args,p.prosecdef,
          has_function_privilege('anon',p.oid,'EXECUTE') anon,
          has_function_privilege('authenticated',p.oid,'EXECUTE') authenticated,
          has_function_privilege('service_role',p.oid,'EXECUTE') service_role
          FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname IN ('public','private','migration')
          )
          SELECT md5(string_agg(row_to_json(a)::text,E'\n' ORDER BY schema_name COLLATE "C",proname COLLATE "C",args::text COLLATE "C")) security_hash FROM access a;
          PERMISSIONS_SQL
            )"
            actual="$(docker exec atwar-isolated psql -U supabase_admin -d atwar_restore -X -qAt -v ON_ERROR_STOP=1 -c "$permissions_sql")"
            expected="ff547fda0548505210490ad66f9ab0fd"
            if test "$kind" = staging; then expected="afb2f3e31fd071c8572f5e813040ef1e"; fi
            test "$actual" = "$expected" || { echo "Restored routine access differs from source baseline"; exit 1; }
            echo "$kind routine access for anon/authenticated/service_role matches the source baseline."
            echo "$kind database archive restored successfully into network-isolated temporary database."
            docker rm -fv atwar-isolated >/dev/null
          done
          echo "Both database archives restored in isolated containers; hosted staging and production were not modified."

      - name: Remove runner copies
        if: always()
        shell: bash
        run: |
          docker rm -fv atwar-isolated >/dev/null 2>&1 || true
          find "$RUNNER_TEMP" -maxdepth 1 -name 'ATWAR_*' -exec rm -rf -- {} +
          rm -f "$RUNNER_TEMP/rclone.conf"
