name: Configure staging administrator password
on:
  push:
    branches: [quality/staging-admin-password-20261030]
permissions:
  contents: read
concurrency:
  group: staging-admin-password-setup
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure only the existing staging administrator
        env:
          STAGE_URL: ${{ secrets.RESTORE_DRILL_SUPABASE_URL }}
          STAGE_KEY: ${{ secrets.RESTORE_DRILL_SERVICE_ROLE_KEY }}
          INITIAL_PASSWORD: ${{ secrets.STAGING_ADMIN_SETUP_20261030_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          const origin='https://eeaedzisysjarwvolbwq.supabase.co';
          const id='719473c6-5354-4775-b6f4-c0239a86c385', email='helpdesk@tiradorstores.com';
          const fail=message=>{console.error(message);process.exit(1)};
          if(process.env.STAGE_URL?.replace(/\/$/,'')!==origin)fail('Wrong target; no changes made');
          const key=process.env.STAGE_KEY,password=process.env.INITIAL_PASSWORD;
          if(!key||!password||password.length<12)fail('Waiting for the user-provided staging password secret (minimum 12 characters); no changes made');
          const headers={apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'};
          const userResponse=await fetch(origin+'/auth/v1/admin/users/'+id,{headers});
          if(!userResponse.ok)fail('Could not verify the existing staging account; no changes made');
          const body=await userResponse.json(),user=body.user||body;
          if(user.id!==id||user.email?.toLowerCase()!==email)fail('Account mismatch; no changes made');
          const p=await fetch(origin+'/rest/v1/profiles?id=eq.'+id+'&select=id,role,active,status',{headers});
          if(!p.ok)fail('Could not verify the staging profile');
          const rows=await p.json();
          if(rows.length!==1||rows[0].role!=='admin'||!rows[0].active||rows[0].status!=='active')fail('Existing administrator role does not match; no grants changed');
          const update=await fetch(origin+'/auth/v1/admin/users/'+id,{method:'PUT',headers,body:JSON.stringify({password,ban_duration:'none'})});
          if(!update.ok)fail('Staging administrator update failed; details suppressed');
          const check=await fetch(origin+'/auth/v1/admin/users/'+id,{headers});
          if(!check.ok)fail('Update completed but verification failed; review staging before retry');
          const verifiedBody=await check.json(),verified=verifiedBody.user||verifiedBody;
          if(verified.email!==email||(verified.banned_until&&new Date(verified.banned_until)>new Date()))fail('Staging activation verification failed');
          console.log('PASS: existing staging administrator password configured and login enabled. Production, roles and other users unchanged. No email sent.');
          JS
