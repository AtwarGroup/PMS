name: ATWAR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atwar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: System and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned audit dependencies
        run: npm ci --ignore-scripts
      - name: Run every JavaScript regression test
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.mjs; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done

  fleet:
    name: Fleet database and browser workflow
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest may move ahead.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Test offline vehicle mapping
        run: python scripts/test-fleet-import.py
      - name: Test PostgreSQL permissions and financial workflows
        run: |
          npm run test:fleet:db
          npm run test:recruitment:db
          npm run test:recruitment:release
          node scripts/test-fleet-alerts.mjs
          node scripts/test-action-history.mjs
          node scripts/test-business-conflict.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test driver, manager, fleet and accountant interfaces
        run: npm run test:fleet:ui
      - name: Test notification recovery after browser history navigation
        run: node tests/browser/notification-bfcache.cjs
      - name: Generate current visual fixtures
        run: |
          node scripts/daily-work-preview.mjs
          node scripts/library-preview.mjs
          node scripts/employee-change-preview.mjs
          node scripts/project-preview.mjs
          node scripts/job-document-preview.mjs
      - name: Test employee directory and per-account units
        run: |
          python3 -m http.server 8765 >/tmp/atwar-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/browser/employee-access.cjs
          node tests/browser/account-modules.cjs
          node tests/browser/home-resilience.cjs
          node tests/browser/data-state.cjs
          node tests/browser/shell-loading.cjs
          node tests/browser/theme-legibility.cjs
          node tests/browser/theme-contract.cjs
          node tests/browser/theme-dynamic.cjs
          node tests/browser/theme-runtime.cjs
          node tests/browser/policy-editor.cjs
          node tests/browser/compensation-reader.cjs
          node tests/browser/leave-reader.cjs
          PORT=4174 node scripts/recruitment-preview.mjs >/tmp/atwar-recruitment-theme.log 2>&1 &
          recruitment_pid=$!
          trap 'kill "$server_pid" "$recruitment_pid"' EXIT
          node tests/browser/theme-recruitment.cjs
