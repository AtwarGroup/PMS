name: ATWAR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atwar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: System and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run system audit
        run: node tests/system-audit.mjs
      - name: Run phase-one audit
        run: node tests/phase-one-audit.mjs
      - name: Run phase-two audit
        run: node tests/phase-two-core.mjs
      - name: Run phase-three quality gate
        run: node tests/phase-three-quality-gate.mjs
      - name: Run job-library governance audit
        run: node tests/job-library-governance.mjs
      - name: Run organization-linked job library and announcements audit
        run: node tests/job-library-organization-announcements.mjs
      - name: Run protected job review proposals and forms audit
        run: node tests/job-review-proposals-and-forms.mjs
      - name: Run professional job content and review-page audit
        run: node tests/job-library-professional-review.mjs
      - name: Run Arabic job-title matching and Power BI portal audit
        run: node tests/job-library-matching-portal.mjs
      - name: Run current HR roles and selective update audit
        run: node tests/hr-current-roles.mjs
      - name: Run phase-four UX safety audit
        run: node tests/phase-four-ux-safety.mjs
      - name: Run phase-two information architecture audit
        run: node tests/phase-two-information-architecture.mjs
      - name: Run phase-two unified task workspace audit
        run: node tests/phase-two-unified-tasks.mjs
      - name: Run phase-two team boundary audit
        run: node tests/phase-two-team-boundary.mjs
      - name: Run phase-two workspace and notifications audit
        run: node tests/phase-two-workspace-notifications.mjs
      - name: Run phase-two closeout audit
        run: node tests/phase-two-closeout.mjs
      - name: Run phase-three shared relations foundation audit
        run: node tests/phase-three-work-engine-foundation.mjs
