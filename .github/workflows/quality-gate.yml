name: ATWAR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    # 02:30 Asia/Riyadh, every day. Always runs every suite.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atwar-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  plan:
    name: Select affected verification suites
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      suites: ${{ steps.scope.outputs.suites }}
      kind: ${{ steps.scope.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scope
        run: node scripts/ci/plan.mjs

  audit:
    # Retain the existing required check name. Fast regressions always run.
    name: System and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run every JavaScript regression test
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.mjs; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done

  checks:
    name: Module verification (${{ matrix.suite }})
    needs: plan
    if: ${{ needs.plan.outputs.suites != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Verify the pinned browser runtime
        run: |
          node -e "if(require('@playwright/test/package.json').version!=='1.56.1')throw Error('Update the pinned browser image together with Playwright')"
          python3 --version
      - name: Run the selected module suite
        env:
          CI_SUITE: ${{ matrix.suite }}
        run: node scripts/ci/run-suite.mjs "$CI_SUITE"

  fleet:
    # Stable required gate; failed/cancelled work and missing plans cannot pass.
    name: Fleet database and browser workflow
    needs: [plan, audit, checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require successful classification, audit and selected suites
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-gate.mjs
