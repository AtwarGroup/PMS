name: ATWAR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atwar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: System and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run every JavaScript regression test
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.mjs; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done
