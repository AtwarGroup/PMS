name: ATWAR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atwar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: System and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned audit dependencies
        run: npm ci --ignore-scripts
      - name: Run every JavaScript regression test
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.mjs; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done

  fleet:
    name: Fleet database and browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Test offline vehicle mapping
        run: python scripts/test-fleet-import.py
      - name: Test PostgreSQL permissions and financial workflows
        run: |
          npm run test:fleet:db
          npm run test:recruitment:db
          node scripts/test-fleet-alerts.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test driver, manager, fleet and accountant interfaces
        run: npm run test:fleet:ui
      - name: Test employee directory and per-account units
        run: |
          python3 -m http.server 8765 >/tmp/atwar-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/browser/employee-access.cjs
          node tests/browser/account-modules.cjs
          node tests/browser/home-resilience.cjs
          node tests/browser/theme-contract.cjs
