name: Build tasks production CSS

on:
  push:
    branches: [ATWAR_ONE_V2.5.6_CONSOLE_CLEANUP]
    paths:
      - tasks/index.html
      - assets/js/tasks-page.js
      - assets/js/shell-components.js
      - assets/css/tasks-tailwind-input.css
      - tailwind.tasks.config.js
      - .github/workflows/build-tasks-css.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ATWAR_ONE_V2.5.6_CONSOLE_CLEANUP
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and minify Tailwind
        run: npx --yes tailwindcss@3.4.17 -c tailwind.tasks.config.js -i assets/css/tasks-tailwind-input.css -o assets/css/tasks-tailwind.min.css --minify
      - name: Commit generated stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/tasks-tailwind.min.css
          git diff --cached --quiet || git commit -m "Build production Tailwind CSS for tasks"
          git push origin HEAD:ATWAR_ONE_V2.5.6_CONSOLE_CLEANUP
