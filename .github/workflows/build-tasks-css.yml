name: Verify production assets
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atwar-assets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  assets:
    name: Production assets are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:assets
      - name: Require generated assets to match reviewed source
        run: git diff --exit-code -- assets/css/tasks-tailwind.min.css assets/vendor/supabase-client.mjs
