name: ATWAR Staging Checkpoint

on:
  push:
    branches: [quality/staging-checkpoint-20261030]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atwar-restore-drill
  cancel-in-progress: false

jobs:
  backup:
    name: Supabase, Storage and Source Backup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.RESTORE_DRILL_DB_URL }}
      SUPABASE_URL: ${{ secrets.RESTORE_DRILL_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RESTORE_DRILL_SERVICE_ROLE_KEY }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      RESTORE_DRILL_PROJECT_REF: ${{ vars.RESTORE_DRILL_PROJECT_REF }}
      GDRIVE_BACKUP_FOLDER: ${{ vars.GDRIVE_BACKUP_FOLDER }}
    steps:
      - name: Checkout checkpoint tooling source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY RCLONE_CONFIG_BASE64 BACKUP_ENCRYPTION_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done

      - name: Bind checkpoint to staging only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const ref = 'eeaedzisysjarwvolbwq';
          if (process.env.RESTORE_DRILL_PROJECT_REF !== ref) throw new Error('Staging project variable mismatch');
          const db = new URL(process.env.SUPABASE_DB_URL);
          const api = new URL(process.env.SUPABASE_URL);
          const direct = db.hostname === 'db.' + ref + '.supabase.co';
          const pooled = db.hostname.endsWith('.pooler.supabase.com') && decodeURIComponent(db.username) === 'postgres.' + ref;
          if ((!direct && !pooled) || db.port && db.port !== '5432') throw new Error('Database target must be staging direct or session connection');
          if (api.hostname !== ref + '.supabase.co' || api.protocol !== 'https:') throw new Error('Storage target must be staging');
          if (!db.password || /YOUR.PASSWORD/i.test(db.password)) throw new Error('Database URL still contains a password placeholder');
          console.log('Fixed staging target validated; no database writes are performed by this workflow.');
          NODE

      - name: Install backup clients
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone gnupg
          docker pull postgres:17.6
          docker run --rm postgres:17.6 pg_dump --version
          rclone version

      - name: Create complete backup
        id: create
        shell: bash
        run: |
          set -Eeuo pipefail
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          name="ATWAR_STAGING_${stamp}"
          work="$RUNNER_TEMP/$name"
          mkdir -p "$work/storage"
          chmod 700 "$work"

          docker run --rm \
            --volume "$work:/backup" \
            postgres:17.6 \
            pg_dump --dbname="$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file=/backup/database.dump
          docker run --rm \
            postgres:17.6 \
            pg_dumpall --dbname="$SUPABASE_DB_URL" --roles-only --no-role-passwords > "$work/roles.sql"
          node scripts/backup/download-supabase-storage.mjs "$work/storage"
          git archive --format=tar.gz --output="$work/source.tar.gz" HEAD
          {
            echo "backup_name=$name"
            echo "created_utc=$(date -u --iso-8601=seconds)"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "database=Supabase PostgreSQL including auth and storage metadata"
            echo "storage=All Supabase Storage bucket objects"
            echo "retention=manual checkpoint; no automatic deletion"
          } > "$work/backup-info.txt"

          bash scripts/backup/verify-backup.sh "$work"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          gpg --batch --yes --pinentry-mode loopback --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_PASSWORD" \
            --symmetric --output "$RUNNER_TEMP/$name.tar.gz.gpg" "$RUNNER_TEMP/$name.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum "$name.tar.gz.gpg" > "$name.tar.gz.gpg.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup to Google Drive
        shell: bash
        run: |
          set -Eeuo pipefail
          config_file="$RUNNER_TEMP/rclone.conf"
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$config_file"
          chmod 600 "$config_file"
          target="gdrive:${GDRIVE_BACKUP_FOLDER:-ATWAR ONE Backups}/Staging Checkpoints"
          name="${{ steps.create.outputs.name }}"
          rclone --config "$config_file" mkdir "$target"
          rclone --config "$config_file" copyto "$RUNNER_TEMP/$name.tar.gz.gpg" "$target/$name.tar.gz.gpg" --retries 3 --checkers 4
          rclone --config "$config_file" copyto "$RUNNER_TEMP/$name.tar.gz.gpg.sha256" "$target/$name.tar.gz.gpg.sha256" --retries 3
          rclone --config "$config_file" lsf "$target" --files-only | grep -Fx "$name.tar.gz.gpg"

      - name: Remove runner copies
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -name 'ATWAR_STAGING_*' -exec rm -rf -- {} +
          rm -f "$RUNNER_TEMP/rclone.conf"
