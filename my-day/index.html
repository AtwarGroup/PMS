<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATWAR ONE – يومي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../assets/js/shell-components.js"></script>
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
.day-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.day-head h1{font-size:30px;margin:0}.day-head p{font-size:12px;color:#7b8aa5;margin:5px 0 0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sum{background:#fff;border:1px solid #e5edf6;border-radius:17px;padding:15px}
.sum b{display:block;font-size:24px}.sum span{font-size:10px;color:#7b8aa5}
.day-grid{display:grid;grid-template-columns:1.25fr .85fr;gap:16px}
.card{background:#fff;border:1px solid #e5edf6;border-radius:19px;padding:18px}
.card h3{margin:0 0 14px;font-size:16px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf2f7}
.item:last-child{border-bottom:0}.item b{font-size:12px}.item small{display:block;color:#8290a3;margin-top:4px;font-size:10px}
.tag{font-size:9px;font-weight:900;padding:6px 8px;border-radius:999px;white-space:nowrap}
.task{background:#eef6ff;color:#176fd3}.follow{background:#fff5e6;color:#b66b00}.approval{background:#edf9f3;color:#16805b}.late{background:#fff0f0;color:#c83c43}
.note{background:#fffdf4;border:1px solid #f0e5b8;border-radius:15px;padding:14px;font-size:12px;line-height:1.8;color:#5f6570;min-height:90px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.quick a{text-decoration:none;background:#f8fbff;border:1px solid #e2ebf5;border-radius:12px;padding:12px;color:#31445d;font-size:11px;font-weight:900}
@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.day-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="atwar-shell">
<atwar-sidebar active=""></atwar-sidebar>
<section class="atwar-main">
<atwar-header></atwar-header>
<main class="atwar-content">
<div class="day-head"><div><h1>يومي</h1><p>ما يحتاج انتباهك اليوم، بدون أن تبحث بين الصفحات.</p></div></div>

<section class="summary">
<div class="sum"><b id="dayTaskCount">—</b><span>مهام اليوم</span></div>
<div class="sum"><b id="dayLateCount" style="color:#c83c43">—</b><span>مهمة متأخرة</span></div>
<div class="sum"><b id="dayFollowCount">—</b><span>متابعات قريبة</span></div>
<div class="sum" data-role-min="manager"><b id="dayApprovalCount">—</b><span>بانتظار اعتمادي</span></div>
</section>

<div class="day-grid">
<section class="card">
<h3>الأولوية اليوم</h3>
<div id="dayPriority"><div class="item"><div><b>جاري تجهيز يومك...</b><small>من بيانات حسابك</small></div></div></div>
</section>

<section>
<div class="card">
<h3>ملاحظتي</h3>
<div id="dayNote" class="note">جاري تحميل ملاحظتك...</div>
<div class="quick">
<a href="../workspace/index.html">فتح مساحة عملي</a>
<a href="../tasks/index.html">فتح مهامي</a>
<a href="../follow-up/index.html">فتح المتابعات</a>
<a data-role-min="manager" href="../approvals/index.html">فتح الاعتمادات</a>
</div>
</div>
</section>
</div>

<footer class="atwar-footer"><span>ATWAR ONE • My Day</span><span>V0.40.6</span><span>Firebase Live Data</span></footer>
</main></section></div>
<script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/permissions.js"></script>

<script src="../assets/js/consolidation.js"></script>
<script type="module" id="myDayFirebaseBinding">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=getApps().length?getApps()[0]:initializeApp(window.ATWAR_FIREBASE_CONFIG),auth=getAuth(app),db=getDatabase(app);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const localDateISO=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>localDateISO();
function late(t){
  if(!t?.end||t.status==='مكتملة')return false;
  const end=new Date(t.end+'T23:59:59');
  const compare=(t.status==='بانتظار الاعتماد'&&t.submittedAt)?new Date(Number(t.submittedAt)):new Date();
  return compare>end;
}
onAuthStateChanged(auth,async user=>{
 if(!user){location.href='../login.html';return}
 try{
  const us=await get(ref(db,'users')),users=us.exists()?Object.entries(us.val()).map(([uid,v])=>({uid,...v})):[];
  const profile=users.find(u=>u.uid===user.uid)||{uid:user.uid,role:'employee'};
  const direct=users.filter(u=>u.managerUid===user.uid);
  const ownerIds=profile.role==='admin'?users.map(u=>u.uid):profile.role==='manager'?[user.uid,...direct.map(u=>u.uid)]:[user.uid];
  const buckets=await Promise.all([...new Set(ownerIds)].map(async uid=>{try{const q=await get(ref(db,`tasksByUser/${uid}`));return q.exists()?Object.entries(q.val()).map(([k,v])=>({_key:k,_ownerUid:uid,...v})):[]}catch{return []}}));
  const all=buckets.flat(),mine=all.filter(t=>t._ownerUid===user.uid),d=today();
  const todayTasks=mine.filter(t=>t.status!=='مكتملة'&&(t.start===d||t.end===d));
  const lateTasks=mine.filter(late);
  let follows=[];
  try{const fs=await get(ref(db,`followUpsByUser/${user.uid}`));follows=fs.exists()?Object.entries(fs.val()).map(([id,v])=>({id,...v})):[]}catch{}
  const closeFollows=follows.filter(x=>x.status!=='done'&&(!x.date||x.date<=d));
  const approvals=all.filter(t=>{
    if(t.status!=='بانتظار الاعتماد'||t._ownerUid===user.uid)return false;
    if(profile.role==='admin')return true;
    const owner=users.find(u=>u.uid===t._ownerUid);
    return profile.role==='manager'&&owner?.managerUid===user.uid;
  });
  document.getElementById('dayTaskCount').textContent=todayTasks.length;
  document.getElementById('dayLateCount').textContent=lateTasks.length;
  document.getElementById('dayFollowCount').textContent=closeFollows.length;
  const ap=document.getElementById('dayApprovalCount');if(ap)ap.textContent=approvals.length;
  const rows=[
    ...lateTasks.slice(0,2).map(t=>`<div class="item"><div><b>${esc(t.title||'مهمة')}</b><small>مهمة متأخرة</small></div><span class="tag late">متأخرة</span></div>`),
    ...todayTasks.slice(0,3).map(t=>`<div class="item"><div><b>${esc(t.title||'مهمة')}</b><small>استحقاق اليوم</small></div><span class="tag task">مهمة</span></div>`),
    ...closeFollows.slice(0,2).map(x=>`<div class="item"><div><b>${esc(x.title||'متابعة')}</b><small>متابعة شخصية</small></div><span class="tag follow">متابعة</span></div>`),
    ...approvals.slice(0,2).map(t=>`<div class="item"><div><b>${esc(t.title||'مهمة')}</b><small>بانتظار قرارك</small></div><span class="tag approval">اعتماد</span></div>`)
  ];
  document.getElementById('dayPriority').innerHTML=rows.length?rows.join(''):'<div class="item"><div><b>يومك واضح</b><small>لا توجد عناصر عاجلة مسجلة حالياً.</small></div></div>';
  try{const ns=await get(ref(db,`notesByUser/${user.uid}/quickNote`));const v=ns.exists()?ns.val():null;document.getElementById('dayNote').textContent=(typeof v==='string'?v:v?.text)||'لا توجد ملاحظة محفوظة.'}catch{document.getElementById('dayNote').textContent='الملاحظة غير متاحة حالياً.'}
  try{lucide.createIcons()}catch{}
 }catch(e){console.error('My Day:',e);document.getElementById('dayPriority').innerHTML='<div class="item"><div><b>بيانات يومك غير متاحة حالياً</b><small>أعد تحميل الصفحة بعد لحظات.</small></div></div>'}
});
</script>
</body></html>
