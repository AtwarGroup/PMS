<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – يومي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/shell-components.js"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.m,.card{background:#fff;border:1px solid #e5edf6;border-radius:18px;padding:16px}.m span{display:block;color:#7a899d;font-size:10px}.m b{font-size:24px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:15px}.item{padding:11px 0;border-bottom:1px solid #edf2f7}.item:last-child{border-bottom:0}.item b{font-size:12px}.item small{display:block;color:#7a899d;font-size:9px;margin-top:4px}@media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><div class="atwar-shell"><atwar-sidebar></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="atwar-content"><h1>يومي</h1><p style="color:#7a899d">ما يحتاج انتباهك اليوم من البيانات التي تسمح RLS برؤيتها.</p><div class="metrics"><div class="m"><span>مهامي اليوم</span><b id="todayCount">—</b></div><div class="m"><span>متأخرة الآن</span><b id="lateCount">—</b></div><div class="m"><span>بانتظار الاعتماد</span><b id="approvalCount">—</b></div><div class="m"><span>مهامي الجارية</span><b id="doingCount">—</b></div></div><div class="grid"><section class="card"><h3>الأولوية</h3><div id="list">جاري التحميل...</div></section><section class="card"><h3>اختصارات</h3><div class="item"><a href="../tasks/index.html">المهام</a></div><div class="item"><a href="../workspace/index.html">مساحة عملي</a></div><div class="item" data-role-min="manager"><a href="../team/index.html">الفريق</a></div></section></div><footer class="atwar-footer"><span>ATWAR ONE • My Day</span><span>Production 1.6</span><span>RLS</span></footer></main></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ATWAR_SUPABASE_CONFIG,sb=window.ATWAR_SUPABASE||createClient(c.url,c.publishableKey);window.ATWAR_SUPABASE=sb;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toISOString().slice(0,10);const late=t=>t.due_date&&t.due_date<today()&&['قيد الانتظار','قيد التنفيذ'].includes(t.status);async function run(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='../login.html';return}const[{data:p},{data:t,error}]=await Promise.all([sb.from('profiles').select('*').eq('id',session.user.id).single(),sb.from('tasks').select('*').order('due_date')]);if(error){console.error(error);document.getElementById('list').textContent='تعذر تحميل البيانات.';return}window.atwarSyncShellIdentity?.(p,session.user);const all=t||[],mine=all.filter(x=>x.assignee_id===p.id),d=today(),todayTasks=mine.filter(x=>x.status!=='مكتملة'&&(x.start_date===d||x.due_date===d)),lateTasks=mine.filter(late),approvals=all.filter(x=>x.status==='بانتظار الاعتماد'&&x.assignee_id!==p.id);document.getElementById('todayCount').textContent=todayTasks.length;document.getElementById('lateCount').textContent=lateTasks.length;document.getElementById('approvalCount').textContent=approvals.length;document.getElementById('doingCount').textContent=mine.filter(x=>x.status==='قيد التنفيذ').length;const rows=[...lateTasks,...todayTasks.filter(x=>!late(x)),...approvals].slice(0,10);document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${esc(x.title)}</b><small>${esc(x.status)} · ${esc(x.assignee_name_snapshot)} · ${esc(x.due_date||'بدون تاريخ')}</small></div>`).join(''):'لا توجد عناصر عاجلة اليوم.'}run().catch(console.error);</script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script></body></html>
