<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – الاطلاع التنفيذي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/shell-components.js?v=2.4.23"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>
.task-table{width:100%;border-collapse:collapse;font-size:11px}.task-table th{background:#f1f6fc;color:#52657c;text-align:right;padding:11px}.task-table td{padding:12px 11px;border-top:1px solid #e8eef5}.task-table b{font-size:12px;color:#162c49}.badge{display:inline-block;border-radius:99px;padding:5px 8px;background:#e8f2ff;color:#1769e0;font-weight:900}.progress{height:6px;background:#e5ebf2;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#1d75db}.empty{text-align:center;color:#7b899b;padding:40px}@media(max-width:800px){.task-suite-panel{overflow:auto}.task-table{min-width:800px}}
</style></head><body><div class="atwar-shell"><atwar-sidebar active="tasks"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="task-suite-page"><section class="task-suite-hero"><div><h1>الاطلاع التنفيذي</h1><p>رؤية مستقلة وشاملة لمهام المؤسسة لدعم المتابعة واتخاذ القرار.</p></div><span class="task-suite-hero-badge"><i data-lucide="shield-check"></i> قراءة فقط • جميع عمليات الدخول مسجلة</span></section><section class="task-suite-metrics four"><article class="task-suite-metric"><strong id="allCount">0</strong><span>إجمالي المهام</span></article><article class="task-suite-metric"><strong id="activeCount">0</strong><span>مهام نشطة</span></article><article class="task-suite-metric"><strong id="overdueCount">0</strong><span>مهام متأخرة</span></article><article class="task-suite-metric"><strong id="completedCount">0</strong><span>مهام مكتملة</span></article></section><section class="task-suite-panel"><div class="task-suite-panel-head"><div><h2>جميع مهام المؤسسة</h2><p>ابحث وصفِّ النتائج حسب الموظف أو الحالة.</p></div></div><div class="task-suite-filters"><input id="search" placeholder="ابحث باسم المهمة أو الموظف"><select id="owner"><option value="">جميع الموظفين</option></select><select id="status"><option value="">جميع الحالات</option></select></div><div id="results">جاري تحميل المهام...</div></section></main></section></div><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script><script type="module">
const sb=await window.atwarGetSupabase(),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[];const searchInput=document.getElementById('search'),ownerFilter=document.getElementById('owner'),statusFilter=document.getElementById('status'),resultsHost=document.getElementById('results'),allCountNode=document.getElementById('allCount'),activeCountNode=document.getElementById('activeCount'),overdueCountNode=document.getElementById('overdueCount'),completedCountNode=document.getElementById('completedCount');
const {data:{session}}=await sb.auth.getSession();if(!session?.user)location.href='../login.html';
const {data:me}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(!me||(me.role!=='admin'&&!(me.permissions||[]).includes('tasks.read_all')))location.href='index.html';
window.atwarSyncShellIdentity?.(me,session.user);if(me.role!=='admin')await sb.rpc('record_executive_task_access',{p_user_agent:navigator.userAgent});
const result=await sb.from('tasks').select('id,title,status,priority,progress,assignee_id,assignee_name_snapshot,creator_name_snapshot,start_date,due_date,updated_at').is('deleted_at',null).order('updated_at',{ascending:false});if(result.error){resultsHost.innerHTML=`<div class="empty">تعذر تحميل المهام: ${esc(result.error.message)}</div>`;throw result.error}rows=result.data||[];
const unique=(values)=>[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));ownerFilter.innerHTML+=unique(rows.map(x=>x.assignee_name_snapshot)).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');statusFilter.innerHTML+=unique(rows.map(x=>x.status)).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
function overdue(x){return x.due_date&&!['مكتملة','معتمدة'].includes(x.status)&&new Date(`${x.due_date}T23:59:59`)<new Date()}
function render(){const q=searchInput.value.trim().toLowerCase(),person=ownerFilter.value,state=statusFilter.value,filtered=rows.filter(x=>(!q||`${x.title} ${x.assignee_name_snapshot} ${x.creator_name_snapshot}`.toLowerCase().includes(q))&&(!person||x.assignee_name_snapshot===person)&&(!state||x.status===state));allCountNode.textContent=rows.length;activeCountNode.textContent=rows.filter(x=>!['مكتملة','معتمدة'].includes(x.status)).length;overdueCountNode.textContent=rows.filter(overdue).length;completedCountNode.textContent=rows.filter(x=>x.status==='مكتملة'||x.status==='معتمدة').length;resultsHost.innerHTML=filtered.length?`<table class="task-table"><thead><tr><th>المهمة</th><th>الموظف</th><th>المنشئ</th><th>الحالة</th><th>المدة</th><th>الإنجاز</th></tr></thead><tbody>${filtered.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.assignee_name_snapshot||'—')}</td><td>${esc(x.creator_name_snapshot||'—')}</td><td><span class="badge">${overdue(x)?'متأخرة':esc(x.status)}</span></td><td>${esc(x.start_date||'—')} ← ${esc(x.due_date||'—')}</td><td><div class="progress"><span style="width:${Math.max(0,Math.min(100,Number(x.progress)||0))}%"></span></div><small>${Number(x.progress)||0}%</small></td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد مهام مطابقة.</div>'}
[searchInput,ownerFilter,statusFilter].forEach(x=>x.addEventListener(x===searchInput?'input':'change',render));render();try{lucide.createIcons()}catch{}
</script></body></html>
