<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATWAR ONE – الاطلاع التنفيذي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/shell-components.js?v=2.4.23"></script><link rel="stylesheet" href="../assets/css/shared.css"><style>
.executive-page{padding:24px;background:#f4f7fb;min-height:calc(100vh - 70px)}.executive-hero{background:linear-gradient(135deg,#071d3d,#115aa7);color:#fff;border-radius:22px;padding:25px;display:flex;justify-content:space-between;gap:20px;align-items:center}.executive-hero h1{margin:0 0 6px;font-size:27px}.executive-hero p{margin:0;color:#d4e7ff;font-size:11px}.readonly{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:9px 13px;font-size:10px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metrics article,.panel{background:#fff;border:1px solid #e0e8f2;border-radius:16px;padding:16px}.metrics strong,.metrics span{display:block}.metrics strong{font-size:24px;color:#103d75}.metrics span{font-size:9px;color:#718198}.filters{display:grid;grid-template-columns:1fr 220px 220px;gap:9px;margin-bottom:13px}.filters input,.filters select{border:1px solid #dce5ef;border-radius:10px;padding:11px;font-family:inherit;background:#fff}.task-table{width:100%;border-collapse:collapse;font-size:10px}.task-table th{background:#f1f6fc;color:#52657c;text-align:right;padding:11px}.task-table td{padding:12px 11px;border-top:1px solid #e8eef5}.task-table b{font-size:11px;color:#162c49}.badge{display:inline-block;border-radius:99px;padding:5px 8px;background:#e8f2ff;color:#1769e0;font-weight:900}.progress{height:6px;background:#e5ebf2;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#1d75db}.empty{text-align:center;color:#7b899b;padding:40px}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.panel{overflow:auto}.task-table{min-width:800px}.executive-hero{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="atwar-shell"><atwar-sidebar active="tasks"></atwar-sidebar><section class="atwar-main"><atwar-header></atwar-header><main class="executive-page"><section class="executive-hero"><div><h1>الاطلاع التنفيذي</h1><p>رؤية مستقلة وشاملة لمهام المؤسسة لدعم المتابعة واتخاذ القرار.</p></div><span class="readonly">قراءة فقط • جميع عمليات الدخول مسجلة</span></section><section class="metrics"><article><strong id="allCount">0</strong><span>إجمالي المهام</span></article><article><strong id="activeCount">0</strong><span>مهام نشطة</span></article><article><strong id="overdueCount">0</strong><span>مهام متأخرة</span></article><article><strong id="completedCount">0</strong><span>مهام مكتملة</span></article></section><section class="panel"><div class="filters"><input id="search" placeholder="ابحث باسم المهمة أو الموظف"><select id="owner"><option value="">جميع الموظفين</option></select><select id="status"><option value="">جميع الحالات</option></select></div><div id="results">جاري تحميل المهام...</div></section></main></section></div><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script><script type="module">
const sb=await window.atwarGetSupabase(),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[];
const {data:{session}}=await sb.auth.getSession();if(!session?.user)location.href='../login.html';
const {data:me}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(!me||(me.role!=='admin'&&!(me.permissions||[]).includes('tasks.read_all')))location.href='index.html';
window.atwarSyncShellIdentity?.(me,session.user);if(me.role!=='admin')await sb.rpc('record_executive_task_access',{p_user_agent:navigator.userAgent});
const result=await sb.from('tasks').select('id,title,status,priority,progress,assignee_id,assignee_name_snapshot,creator_name_snapshot,start_date,due_date,updated_at').is('deleted_at',null).order('updated_at',{ascending:false});if(result.error)throw result.error;rows=result.data||[];
const unique=(values)=>[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));owner.innerHTML+=unique(rows.map(x=>x.assignee_name_snapshot)).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');status.innerHTML+=unique(rows.map(x=>x.status)).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
function overdue(x){return x.due_date&&!['مكتملة','معتمدة'].includes(x.status)&&new Date(`${x.due_date}T23:59:59`)<new Date()}
function render(){const q=search.value.trim().toLowerCase(),person=owner.value,state=status.value,filtered=rows.filter(x=>(!q||`${x.title} ${x.assignee_name_snapshot} ${x.creator_name_snapshot}`.toLowerCase().includes(q))&&(!person||x.assignee_name_snapshot===person)&&(!state||x.status===state));allCount.textContent=rows.length;activeCount.textContent=rows.filter(x=>!['مكتملة','معتمدة'].includes(x.status)).length;overdueCount.textContent=rows.filter(overdue).length;completedCount.textContent=rows.filter(x=>x.status==='مكتملة'||x.status==='معتمدة').length;results.innerHTML=filtered.length?`<table class="task-table"><thead><tr><th>المهمة</th><th>الموظف</th><th>المنشئ</th><th>الحالة</th><th>المدة</th><th>الإنجاز</th></tr></thead><tbody>${filtered.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.assignee_name_snapshot||'—')}</td><td>${esc(x.creator_name_snapshot||'—')}</td><td><span class="badge">${overdue(x)?'متأخرة':esc(x.status)}</span></td><td>${esc(x.start_date||'—')} ← ${esc(x.due_date||'—')}</td><td><div class="progress"><span style="width:${Math.max(0,Math.min(100,Number(x.progress)||0))}%"></span></div><small>${Number(x.progress)||0}%</small></td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد مهام مطابقة.</div>'}
[search,owner,status].forEach(x=>x.addEventListener(x===search?'input':'change',render));render();try{lucide.createIcons()}catch{}
</script></body></html>
