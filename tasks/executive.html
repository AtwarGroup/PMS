<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATWAR ONE – الاطلاع التنفيذي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script><script src="../assets/js/shell-components.js?v=2.4.29"></script>
  <link rel="stylesheet" href="../assets/css/shared.css?v=2.4.29">
  <style>
    .executive-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.executive-toolbar .task-suite-filters{flex:1}.executive-view-switch{display:flex;gap:4px;padding:4px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc}.executive-view-switch button{border:0;background:transparent;color:#64748b;font-weight:900;padding:7px 13px;cursor:pointer}.executive-view-switch button.active{background:#fff;color:#1769e0;box-shadow:0 2px 7px rgba(15,23,42,.08)}
    .executive-table-wrap{overflow:auto;max-height:calc(100vh - 390px)}.task-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;min-width:900px}.task-table th{position:sticky;top:0;z-index:2;background:#f1f6fc;color:#52657c;text-align:right;padding:11px}.task-table td{padding:12px 11px;border-top:1px solid #e8eef5}.task-table tbody tr:hover{background:#f8fbff}.task-table b{font-size:12px;color:#162c49}.badge{display:inline-block;border-radius:99px;padding:5px 8px;background:#e8f2ff;color:#1769e0;font-weight:900}.badge.overdue{background:#fff0f1;color:#c62836}.progress{height:6px;background:#e5ebf2;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#1d75db}.empty{text-align:center;color:#7b899b;padding:40px}
    .executive-kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:11px;overflow:auto;padding-bottom:8px}.executive-column{background:#f8fafc;border:1px solid #e2e8f0;border-radius:15px;overflow:hidden}.executive-column.overdue{background:#fff8f8;border-color:#fecaca}.executive-column-head{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;background:#fff;border-bottom:1px solid #e2e8f0;font-size:11px;font-weight:900}.executive-column-head span:last-child{min-width:24px;height:24px;padding:0 6px;display:grid;place-items:center;border-radius:99px;background:#eef2f7;color:#52657c}.executive-column-body{display:grid;align-content:start;gap:8px;padding:9px;min-height:280px}.executive-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px;box-shadow:0 3px 10px rgba(15,23,42,.035)}.executive-card h3{font-size:12px;margin:0 0 8px;line-height:1.7}.executive-card p{font-size:9px!important;color:#718198;margin:3px 0!important}.executive-card .progress{margin-top:8px}
    [hidden]{display:none!important}@media(max-width:850px){.executive-toolbar{align-items:stretch;flex-direction:column}.executive-view-switch{align-self:flex-start}.executive-table-wrap{max-height:none}.executive-kanban{grid-template-columns:repeat(5,270px)}}
  </style>
</head>
<body><div class="atwar-shell"><atwar-sidebar active="tasks"></atwar-sidebar><section class="atwar-main"><atwar-header mode="task-suite"></atwar-header>
<main class="task-suite-page">
  <section class="task-suite-hero"><div><h1>الاطلاع التنفيذي</h1><p>رؤية مستقلة وشاملة لمهام المؤسسة لدعم المتابعة واتخاذ القرار.</p></div><span class="task-suite-hero-badge"><i data-lucide="shield-check"></i> قراءة فقط • جميع عمليات الدخول مسجلة</span></section>
  <section class="task-suite-metrics four"><article class="task-suite-metric"><strong id="allCount">0</strong><span>إجمالي المهام</span></article><article class="task-suite-metric"><strong id="activeCount">0</strong><span>مهام نشطة</span></article><article class="task-suite-metric"><strong id="overdueCount">0</strong><span>مهام متأخرة</span></article><article class="task-suite-metric"><strong id="completedCount">0</strong><span>مهام مكتملة</span></article></section>
  <section class="task-suite-panel"><div class="task-suite-panel-head"><div><h2>جميع مهام المؤسسة</h2><p>ابحث وصفِّ النتائج حسب الموظف أو الحالة، ثم اختر طريقة العرض.</p></div></div>
    <div class="executive-toolbar"><div class="task-suite-filters"><input id="search" type="search" placeholder="ابحث باسم المهمة أو الموظف"><select id="owner"><option value="">جميع الموظفين</option></select><select id="status"><option value="">جميع الحالات</option></select></div><div class="executive-view-switch" aria-label="طريقة العرض"><button id="listView" class="active" type="button">قائمة</button><button id="kanbanView" type="button">كانبان</button></div></div>
    <div id="listResults" class="executive-table-wrap">جاري تحميل المهام...</div><div id="kanbanResults" hidden></div>
  </section>
</main></section></div>
<script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-runtime.js"></script><script src="../assets/js/roles-config.js"></script><script src="../assets/js/start-page-config.js"></script><script src="../assets/js/permissions.js"></script>
<script type="module">
const sb=await window.atwarGetSupabase();
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dateDay=v=>{if(!v)return null;const d=v instanceof Date?v:new Date(String(v).length===10?v+'T00:00:00':v);return Number.isNaN(d.getTime())?null:Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)};
let rows=[],viewMode=localStorage.getItem('atwarExecutiveView')==='KANBAN'?'KANBAN':'LIST';
const searchInput=document.getElementById('search'),ownerFilter=document.getElementById('owner'),statusFilter=document.getElementById('status');
const {data:{session}}=await sb.auth.getSession();if(!session?.user)location.href='../login.html';
const {data:me}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(!me||(me.role!=='admin'&&!(me.permissions||[]).includes('tasks.read_all')))location.href='index.html';
window.atwarSyncShellIdentity?.(me,session.user);if(me.role!=='admin')await sb.rpc('record_executive_task_access',{p_user_agent:navigator.userAgent});
const [taskResult,profileResult]=await Promise.all([sb.from('tasks').select('id,title,status,priority,progress,assignee_id,creator_id,assignee_name_snapshot,creator_name_snapshot,start_date,due_date,actual_end_date,submitted_at,completed_at,updated_at').is('deleted_at',null).order('updated_at',{ascending:false}),sb.from('profiles').select('id,full_name,email,active,status')]);
if(taskResult.error){document.getElementById('listResults').innerHTML=`<div class="empty">تعذر تحميل المهام: ${esc(taskResult.error.message)}</div>`;throw taskResult.error}
const profiles=new Map((profileResult.data||[]).map(p=>[String(p.id),p]));rows=(taskResult.data||[]).map(t=>({...t,assignee_name:profiles.get(String(t.assignee_id))?.full_name||t.assignee_name_snapshot||'—',creator_name:profiles.get(String(t.creator_id))?.full_name||t.creator_name_snapshot||'—'}));
const uniqueOwners=[...new Map(rows.filter(x=>x.assignee_id).map(x=>[String(x.assignee_id),x.assignee_name])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'ar'));ownerFilter.innerHTML+=uniqueOwners.map(([id,name])=>`<option value="${esc(id)}">${esc(name)}</option>`).join('');statusFilter.innerHTML+=[...new Set(rows.map(x=>x.status).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar')).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
function delayDays(x){const end=dateDay(x.due_date);if(end===null||['مكتملة','معتمدة'].includes(x.status))return 0;const compare=x.status==='بانتظار الاعتماد'&&x.submitted_at?dateDay(x.submitted_at):dateDay(new Date());return compare===null?0:Math.max(0,compare-end)}
function filtered(){const q=searchInput.value.trim().toLowerCase(),owner=ownerFilter.value,status=statusFilter.value;return rows.filter(x=>(!q||`${x.title} ${x.assignee_name} ${x.creator_name} ${x.assignee_name_snapshot||''}`.toLowerCase().includes(q))&&(!owner||String(x.assignee_id)===owner)&&(!status||x.status===status))}
const progress=x=>Math.max(0,Math.min(100,Number(x.progress)||0));
function renderList(data){document.getElementById('listResults').innerHTML=data.length?`<table class="task-table"><thead><tr><th>المهمة</th><th>الموظف</th><th>المنشئ</th><th>الحالة</th><th>المدة</th><th>الإنجاز</th></tr></thead><tbody>${data.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.assignee_name)}</td><td>${esc(x.creator_name)}</td><td><span class="badge ${delayDays(x)>0?'overdue':''}">${delayDays(x)>0?'متأخرة '+delayDays(x)+' يوم':esc(x.status)}</span></td><td>${esc(x.start_date||'—')} ← ${esc(x.due_date||'—')}</td><td><div class="progress"><span style="width:${progress(x)}%"></span></div><small>${progress(x)}%</small></td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد مهام مطابقة.</div>'}
function renderKanban(data){const defs=[['قيد الانتظار','قيد الانتظار'],['قيد التنفيذ','قيد التنفيذ'],['بانتظار الاعتماد','بانتظار الاعتماد'],['OVERDUE','متأخرة'],['مكتملة','مكتملة']];document.getElementById('kanbanResults').innerHTML=`<div class="executive-kanban">${defs.map(([key,label])=>{const subset=data.filter(x=>key==='OVERDUE'?delayDays(x)>0&&!['بانتظار الاعتماد','مكتملة','معتمدة'].includes(x.status):x.status===key&&(key==='بانتظار الاعتماد'||key==='مكتملة'||delayDays(x)===0));return `<section class="executive-column ${key==='OVERDUE'?'overdue':''}"><div class="executive-column-head"><span>${label}</span><span>${subset.length}</span></div><div class="executive-column-body">${subset.map(x=>`<article class="executive-card"><h3>${esc(x.title)}</h3><p>الموظف: ${esc(x.assignee_name)}</p><p>${esc(x.start_date||'—')} ← ${esc(x.due_date||'—')}</p><div class="progress"><span style="width:${progress(x)}%"></span></div></article>`).join('')||'<div class="empty">لا توجد مهام</div>'}</div></section>`}).join('')}</div>`}
function applyView(){const list=viewMode==='LIST';document.getElementById('listResults').hidden=!list;document.getElementById('kanbanResults').hidden=list;document.getElementById('listView').classList.toggle('active',list);document.getElementById('kanbanView').classList.toggle('active',!list)}
function render(){const data=filtered();document.getElementById('allCount').textContent=rows.length;document.getElementById('activeCount').textContent=rows.filter(x=>!['مكتملة','معتمدة'].includes(x.status)).length;document.getElementById('overdueCount').textContent=rows.filter(x=>delayDays(x)>0).length;document.getElementById('completedCount').textContent=rows.filter(x=>['مكتملة','معتمدة'].includes(x.status)).length;renderList(data);renderKanban(data);applyView()}
document.getElementById('listView').onclick=()=>{viewMode='LIST';localStorage.setItem('atwarExecutiveView',viewMode);applyView()};document.getElementById('kanbanView').onclick=()=>{viewMode='KANBAN';localStorage.setItem('atwarExecutiveView',viewMode);applyView()};[searchInput,ownerFilter,statusFilter].forEach(x=>x.addEventListener(x===searchInput?'input':'change',render));render();try{lucide.createIcons()}catch{}
</script></body></html>
